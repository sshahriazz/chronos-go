# -----------------------------------------------------------------------------
# OpenTelemetry Collector — the single ingress for traces.
#
# Everything that emits OTLP points here (OpenFGA today, the Go services next),
# so sampling, attribute scrubbing and backend routing are configured in one
# place instead of in every service.
#
# Traces  -> Tempo
# Metrics -> exposed on :8889 for Prometheus to scrape (pull, not push)
# -----------------------------------------------------------------------------

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Bound memory before it becomes the container's problem.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  batch:
    timeout: 5s
    send_batch_size: 1024

  # Every span gets stamped with the stack it came from.
  resource:
    attributes:
      - key: stack
        value: chronos
        action: upsert
      - key: deployment.environment
        value: local
        action: upsert

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Prometheus scrapes this endpoint; the collector does not push.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
