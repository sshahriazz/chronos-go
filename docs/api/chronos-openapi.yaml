  /chronos.identity.v1.IdentityService/ListSessions:
    get:
      tags:
        - IdentityService
      summary: |-
        ListSessions returns the caller's device list, newest first, one page at a
         time.
      description: |-
        AAL1. It is a read of a list the holder needs in order to NOTICE a
         compromise, and putting step-up in front of noticing is backwards — the
         revocation that follows is what carries the AAL2 requirement.
      operationId: IdentityService_ListSessions.get
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
        - name: message
          in: query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.ListSessionsRequest'
        - name: encoding
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/encoding'
        - name: base64
          in: query
          schema:
            $ref: '#/components/schemas/base64'
        - name: compression
          in: query
          schema:
            $ref: '#/components/schemas/compression'
        - name: connect
          in: query
          schema:
            $ref: '#/components/schemas/connect'
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            One page of the device list, newest first. No token and no digest
            appears here: a device list that returned anything derived from the
            bearer token would put a credential on the one screen whose purpose is
            to let a user revoke one.

            `nextPageToken` empty means done. Do not infer the end from a short
            page — the server clamps an oversized `pageSize`, so short pages are
            ordinary. `lastSeenAt` is unset for a session that has made no request
            since it was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.ListSessionsResponse'
              example:
                sessions:
                  - sessionId: sess_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    deviceId: dev_9f2c1b7e
                    assuranceLevel: ASSURANCE_LEVEL_2
                    idleExpiresAt: '2026-08-14T12:04:55Z'
                    absoluteExpiresAt: '2026-08-21T11:04:55Z'
                    createdAt: '2026-08-14T11:04:55Z'
                    lastSeenAt: '2026-08-14T11:39:12Z'
                  - sessionId: sess_01ARZ3NDEKTSV4RRFFQ69G5FB2
                    deviceId: ''
                    assuranceLevel: ASSURANCE_LEVEL_2
                    idleExpiresAt: '2026-08-14T10:22:00Z'
                    absoluteExpiresAt: '2026-08-20T09:22:00Z'
                    createdAt: '2026-08-13T09:22:00Z'
                nextPageToken: ''
    post:
      tags:
        - IdentityService
      summary: |-
        ListSessions returns the caller's device list, newest first, one page at a
         time.
      description: |-
        AAL1. It is a read of a list the holder needs in order to NOTICE a
         compromise, and putting step-up in front of noticing is backwards — the
         revocation that follows is what carries the AAL2 requirement.
      operationId: IdentityService_ListSessions
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.ListSessionsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            One page of the device list, newest first. No token and no digest
            appears here: a device list that returned anything derived from the
            bearer token would put a credential on the one screen whose purpose is
            to let a user revoke one.

            `nextPageToken` empty means done. Do not infer the end from a short
            page — the server clamps an oversized `pageSize`, so short pages are
            ordinary. `lastSeenAt` is unset for a session that has made no request
            since it was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.ListSessionsResponse'
              example:
                sessions:
                  - sessionId: sess_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    deviceId: dev_9f2c1b7e
                    assuranceLevel: ASSURANCE_LEVEL_2
                    idleExpiresAt: '2026-08-14T12:04:55Z'
                    absoluteExpiresAt: '2026-08-21T11:04:55Z'
                    createdAt: '2026-08-14T11:04:55Z'
                    lastSeenAt: '2026-08-14T11:39:12Z'
                  - sessionId: sess_01ARZ3NDEKTSV4RRFFQ69G5FB2
                    deviceId: ''
                    assuranceLevel: ASSURANCE_LEVEL_2
                    idleExpiresAt: '2026-08-14T10:22:00Z'
                    absoluteExpiresAt: '2026-08-20T09:22:00Z'
                    createdAt: '2026-08-13T09:22:00Z'
                nextPageToken: ''
  /chronos.identity.v1.IdentityService/Register:
    post:
      tags:
        - IdentityService
      summary: Register claims an address and creates the account that claims it.
      description: |-
        Public: the caller has no session and, by definition, no account. It is a
         WRITE rather than a GROW — a person is not a seat, and seats are consumed
         when an organization adds a member, not when a human being signs up.

         It sets NO PASSWORD and creates no credential of any kind. The account is
         unusable by everybody until the link mailed to the address is followed and
         VerifyEmail supplies one.

         The response is identical whether or not the address was free. See
         RegisterResponse.
      operationId: IdentityService_Register
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.RegisterRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            Accepted. The body is empty, and its emptiness is the feature: this
            response is identical whether or not the address was free, and the
            server pays the same cost either way, so neither content nor timing
            reveals whether an account exists. Render one sentence for both — "if
            that address can be registered, we have sent it a link".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.RegisterResponse'
              example: {}
      security:
        - {}
  /chronos.identity.v1.IdentityService/ResendEmailVerification:
    post:
      tags:
        - IdentityService
      summary: |-
        ResendEmailVerification issues a new verification link for an address whose
         account has not proven it yet.
      description: |-
        Public, and the choice is forced rather than preferred. A Pending account
         can hold no session, so requiring one would make this call unavailable to
         every account that needs it — the endpoint would exist and serve nobody.

         The cost of being public is that it is an unauthenticated mail trigger
         pointed at a third party's mailbox, so it is rate limited on TWO axes before
         anything is looked up: per address, which bounds mail-bombing one victim, and
         per caller, which bounds an enumeration sweep. Both counters are consumed
         whether or not an account exists, so the ceiling itself is not an oracle.

         A WRITE: the successful path appends EmailVerificationRequested to the
         account's stream, and the verification reactor does the rest.
      operationId: IdentityService_ResendEmailVerification
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.ResendEmailVerificationRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.ResendEmailVerificationResponse'
      security:
        - {}
  /chronos.identity.v1.IdentityService/RevokeAllSessions:
    post:
      tags:
        - IdentityService
      summary: |-
        RevokeAllSessions ends every live session on the caller's account, in one
         atomic append.
      description: |-
        AAL2, on the same argument as RevokeSession and more so: this is the
         account-wide version, so the denial of service an attacker could inflict
         with it is total.
      operationId: IdentityService_RevokeAllSessions
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
        - name: Idempotency-Key
          in: header
          description: |
            A client-generated ULID or UUID, required on every authenticated mutating
            call. Replaying it with the SAME body returns the stored response instead
            of re-executing; replaying it with a DIFFERENT body returns `CONFLICT`.
            Scoped to `(principal, method, key)` and retained 24 hours — see
            *Idempotency* in the introduction.
          required: true
          explode: false
          schema:
            type: string
            examples:
              - 01ARZ3NDEKTSV4RRFFQ69G5FAV
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.RevokeAllSessionsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            Every live session on the account has ended, in one atomic append —
            "sign out everywhere" that half happened is worse than one that failed,
            because the user is told every device is signed out, one is not, and
            nothing in the system disagrees with them.

            `revoked` counts what this call ended; sessions already revoked or
            expired are not counted, because nothing was appended for them.
            `scanned` is how many live sessions the work list returned, the spared
            one included — reported so a client can tell "nothing to do" apart from
            "the list came back empty because it is broken".

            Send an empty `exceptSessionId` to spare nothing, which is what a
            compromise response needs: the party asking may be the attacker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.RevokeAllSessionsResponse'
              example:
                revoked: 3
                scanned: 4
  /chronos.identity.v1.IdentityService/RevokeSession:
    post:
      tags:
        - IdentityService
      summary: RevokeSession ends one of the caller's sessions.
      description: |-
        AAL2. Revocation is the control a person reaches for when they believe they
         are compromised, and it must not be usable BY the compromise: a
         single-factor session that could end sessions could sign the legitimate
         holder out of the device they are using to investigate.
      operationId: IdentityService_RevokeSession
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
        - name: Idempotency-Key
          in: header
          description: |
            A client-generated ULID or UUID, required on every authenticated mutating
            call. Replaying it with the SAME body returns the stored response instead
            of re-executing; replaying it with a DIFFERENT body returns `CONFLICT`.
            Scoped to `(principal, method, key)` and retained 24 hours — see
            *Idempotency* in the introduction.
          required: true
          explode: false
          schema:
            type: string
            examples:
              - 01ARZ3NDEKTSV4RRFFQ69G5FAV
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.RevokeSessionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            The session is no longer usable.

            `changed: false` means it was already revoked or already expired.
            Nothing was appended, and it is NOT an error: the caller wanted the
            session unusable, and it is.

            A request naming a session that is not the caller's own gets the same
            answer as one naming a session that does not exist — telling the two
            apart would turn the device list into a probe for which session ids
            exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.RevokeSessionResponse'
              example:
                changed: true
  /chronos.identity.v1.IdentityService/VerifyEmail:
    post:
      tags:
        - IdentityService
      summary: |-
        VerifyEmail proves control of an address, sets the account's first
         password, and makes the claim on the address permanent.
      description: |-
        Public: it is reached from a link in a mailbox, by a browser that has never
         authenticated. The token IS the authentication, and it is single-use.

         It is the ONLY call that can give a brand-new account a password, and that
         is the pre-hijacking defence: the credential is created by the party that
         has just proven the mailbox, in the same request as the proof.
      operationId: IdentityService_VerifyEmail
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.VerifyEmailRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            The token was valid and has been spent. Unlike registration this is
            not an existence oracle — presenting a valid single-use token IS proof
            of control over the address — so the caller is told whose account it
            belongs to. `changed: false` means a link clicked twice, or prefetched
            by a mail client; nothing was appended and it is not an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.VerifyEmailResponse'
              example:
                subjectId: subj_01ARZ3NDEKTSV4RRFFQ69G5FAV
                userId: usr_01ARZ3NDEKTSV4RRFFQ69G5FAV
                changed: true
      security:
        - {}
  /chronos.system.v1.SystemService/GetStatus:
    get:
      tags:
        - SystemService
      summary: |-
        GetStatus reports per-dependency state so a client can grey out affected
