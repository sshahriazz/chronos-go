                $ref: '#/components/schemas/chronos.identity.v1.ListMethodsResponse'
              example:
                methods:
                  - credentialId: cred_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    kind: METHOD_KIND_PASSWORD
                    usable: true
                    addedAt: '2026-07-02T08:15:00Z'
                    enabledAt: '2026-07-02T08:15:00Z'
