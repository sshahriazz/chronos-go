        resource_type:
          type: string
          description: A name for the type of resource being accessed, e.g. "sql table", "cloud storage bucket", etc.
        resource_name:
          type: string
          description: The name of the resource being accessed.
        owner:
          type: string
          description: The owner of the resource (optional).
        description:
          type: string
          description: A description of the resource (optional).
      title: ResourceInfo
      description: Describes the resource that is being accessed.
    google.rpc.RetryInfo:
      type: object
      properties:
        retry_delay:
          type: string
          format: duration
          description: Clients consuming this error should wait at least this long before retrying. The value is a duration string, following the protobuf Duration format (e.g., "1.5s" for one and a half seconds).
      title: RetryInfo
      description: Describes when the clients can retry a failed request.
paths:
  /chronos.identity.v1.IdentityService/Authenticate:
    post:
      tags:
        - IdentityService
      summary: |-
        Authenticate verifies the factors presented and reports what remains
         (ADR-050).
      description: |-
        Public: this is where a session comes from, so requiring one is circular.

         A WRITE, and not a read despite minting nothing: every attempt appends to
         the authentication journal, and classing it as a read would let it through
         gates whose whole purpose is to stop writes. There is no `min_aal` for the
         same reason there is no authz — the caller has no session to have a level.
      operationId: IdentityService_Authenticate
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.AuthenticateRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            The factors presented were correct. A refusal does not arrive here at
            all — it is an error, and it is the SAME error for every cause — so
            this response distinguishes only the two successful shapes.

            The example is the first leg: the password was correct and a second
            factor is owed. `offered` lists KINDS only; credential identifiers are
            deliberately absent, so a correct password does not enumerate the
            account's authenticators. When nothing further is owed,
            `secondFactorRequired` is `false` and `offered` is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.AuthenticateResponse'
              example:
                secondFactorRequired: true
                offered:
                  - METHOD_KIND_TOTP
                  - METHOD_KIND_RECOVERY_CODE
      security:
        - {}
  /chronos.identity.v1.IdentityService/ConfirmTotp:
    post:
      tags:
        - IdentityService
      summary: |-
        ConfirmTotp proves possession of a provisioned secret, and may be what
         activates the account.
      description: |-
        AAL2, matching EnrollTotp: a confirmation is the half of an enrolment that
         makes a factor real, and letting it run at a lower level than the enrolment
         itself would leave the pair only as strong as its weaker call.

         The bootstrap floor matches EnrollTotp for the same reason. The two calls
         are one operation split in half, and exempting only the first would leave
         an account able to provision a secret it could never prove — the deadlock
         moved one call to the right rather than removed.

         This is the call that CLOSES the window: the account it activates has a
         proven second factor from that moment, so the next call to either method
         faces AAL2. The exemption is therefore self-limiting, and it is limited by
         the very thing it was granted to produce.
      operationId: IdentityService_ConfirmTotp
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
        - name: Idempotency-Key
          in: header
          description: |
            A client-generated ULID or UUID, required on every authenticated mutating
            call. Replaying it with the SAME body returns the stored response instead
            of re-executing; replaying it with a DIFFERENT body returns `CONFLICT`.
            Scoped to `(principal, method, key)` and retained 24 hours — see
            *Idempotency* in the introduction.
          required: true
          explode: false
          schema:
            type: string
            examples:
              - 01ARZ3NDEKTSV4RRFFQ69G5FAV
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.ConfirmTotpRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            Possession of the provisioned secret has been proven.

            `activated: true` means this confirmation was the event that completed
            the account — a verified address plus a REAL second factor. Only a TOTP
            confirmation can set it; generating recovery codes never activates an
            account. `changed: false` means the authenticator was already proven,
            so nothing was appended and it is not an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.ConfirmTotpResponse'
              example:
                credentialId: cred_01ARZ3NDEKTSV4RRFFQ69G5FB2
                activated: true
                changed: true
  /chronos.identity.v1.IdentityService/CreateSession:
    post:
      tags:
        - IdentityService
      summary: CreateSession completes a login and mints the bearer token.
      description: |-
        Public, for the same reason as Authenticate: it is the call that creates the
         session everything else requires.
      operationId: IdentityService_CreateSession
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.CreateSessionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            The session, and the ONLY delivery of its token. Store the token
            immediately; no endpoint returns it again.

            `requiresCredentialRotation` is `true` when the password that
            established this session was found in a breach corpus. The session is
            then restricted to profile and credential endpoints — the login is not
            blocked, because blocking locks a person out of the only place they
            can fix the problem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.CreateSessionResponse'
              example:
                sessionId: sess_01ARZ3NDEKTSV4RRFFQ69G5FAV
                subjectId: subj_01ARZ3NDEKTSV4RRFFQ69G5FAV
                token: PLACEHOLDER-not-a-real-token-the-real-one-is-opaque
                assuranceLevel: ASSURANCE_LEVEL_2
                idleExpiresAt: '2026-08-14T12:04:55Z'
                absoluteExpiresAt: '2026-08-21T11:04:55Z'
                requiresCredentialRotation: false
      security:
        - {}
  /chronos.identity.v1.IdentityService/EnrollTotp:
    post:
      tags:
        - IdentityService
      summary: EnrollTotp provisions a new authenticator secret and returns it once.
      description: |-
        AAL2. Enrolling a second factor is how an attacker holding one factor makes
         their access durable, so it must not be reachable from a session that only
         ever presented one. It replaces any unproven enrolment on the account, so
         the abandoned secret stops existing at the moment the new one is written
         rather than lingering as a second confirmable factor.

         AAL1 while the account has never held a proven second factor, and only
         then. Read the two levels together and they say: presenting the existing
         factor is what buys the right to add another, and an account with no
         existing factor is exempt from a demand nothing could satisfy. Without the
         exemption an account registered through this API could never activate — the
         factor it must have to reach AAL2 is the factor this call exists to give it
         (identity.md §2).

         The exemption is not a weaker version of the same permission. It applies to
         a strictly poorer target: an account with no second factor, whose password
         is therefore already the only thing standing between an attacker and it. An
         attacker who enrols there has gained nothing they did not already have. On
         an account that HAS a factor the floor is AAL2, so the same attacker must
         present that factor — and it does not re-open when a factor is removed,
         because the window closes on first proof and never re-opens.
      operationId: IdentityService_EnrollTotp
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
        - name: Idempotency-Key
          in: header
          description: |
            A client-generated ULID or UUID, required on every authenticated mutating
            call. Replaying it with the SAME body returns the stored response instead
            of re-executing; replaying it with a DIFFERENT body returns `CONFLICT`.
            Scoped to `(principal, method, key)` and retained 24 hours — see
            *Idempotency* in the introduction.
          required: true
          explode: false
          schema:
            type: string
            examples:
              - 01ARZ3NDEKTSV4RRFFQ69G5FAV
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.EnrollTotpRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            The provisioning material, delivered ONCE. Both `secret` and
            `provisioningUri` are returned here and are then unrecoverable —
            nothing stores them in the clear, and the sealed copy is opened only to
            check a code. `provisioningUri` CONTAINS the secret. Never log either;
            render the URI as a QR code and the secret for manual entry.

            `expiresAt` is short by design: it bounds the window in which a secret
            exists that nobody has demonstrated possession of, so a secret captured
            from a screen stops being usable quickly. A user who takes longer
            starts again at no cost.

            This call replaces any unproven enrolment on the account, so an
            abandoned secret stops existing rather than lingering as a second
            confirmable factor.

            The secret below is a placeholder and is not valid anywhere.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.EnrollTotpResponse'
              example:
                credentialId: cred_01ARZ3NDEKTSV4RRFFQ69G5FB2
                secret: PLACEHOLDERSECRETNOTREAL234567AB
                provisioningUri: otpauth://totp/Chronos:ada@example.com?secret=PLACEHOLDERSECRETNOTREAL234567AB&issuer=Chronos&algorithm=SHA1&digits=6&period=30
                expiresAt: '2026-08-14T11:19:55Z'
  /chronos.identity.v1.IdentityService/GenerateRecoveryCodes:
    post:
      tags:
        - IdentityService
      summary: |-
        GenerateRecoveryCodes replaces the whole recovery-code set and returns the
         new plaintext codes once.
      description: |-
        AAL2. A recovery code is a standing bypass of every other factor, so minting
         a fresh set from a single-factor session would hand an attacker a permanent
         credential that survives the password change the victim makes in response.
         Generating codes never activates an account — only a real second factor
         does.

         NO bootstrap exemption, deliberately, and this is the method where the
         decision is load-bearing. The exemption exists to break a deadlock, and
         there is no deadlock here: recovery codes cannot activate an account, so
         nothing about the path from registered to Active runs through this call. An
         account reaches its first AAL2 session by confirming a TOTP secret, and only
         then asks for codes — by which time the strict floor is satisfiable. Granting
         the exemption anyway would mean a single-factor session could mint the one
         credential that outlives every remedy the account holder has, on an account
         that has no second factor to lose. That is the exact hole the floor is
         shaped to keep shut, and it would be opened for no gain.
      operationId: IdentityService_GenerateRecoveryCodes
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
        - name: Idempotency-Key
          in: header
          description: |
            A client-generated ULID or UUID, required on every authenticated mutating
            call. Replaying it with the SAME body returns the stored response instead
            of re-executing; replaying it with a DIFFERENT body returns `CONFLICT`.
            Scoped to `(principal, method, key)` and retained 24 hours — see
            *Idempotency* in the introduction.
          required: true
          explode: false
          schema:
            type: string
            examples:
              - 01ARZ3NDEKTSV4RRFFQ69G5FAV
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.GenerateRecoveryCodesRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            The plaintext codes, delivered ONCE, in the order they should be
            presented. Only digests are stored, so this is the only moment they
            exist anywhere this system can reach.

            This REPLACES the whole existing set — any previous codes stop working.
            Show them once, tell the user to store them offline, and never log
            them. A caller who loses them generates a new set, which is the correct
            outcome: an endpoint that could re-display them would turn a stolen
            session into a permanent bypass of every factor on the account.

            The codes below are placeholders and are not valid anywhere.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.GenerateRecoveryCodesResponse'
              example:
                credentialId: cred_01ARZ3NDEKTSV4RRFFQ69G5FC7
                codes:
                  - PLACEHOLDER-code-01
                  - PLACEHOLDER-code-02
                  - PLACEHOLDER-code-03
                  - PLACEHOLDER-code-04
                  - PLACEHOLDER-code-05
                  - PLACEHOLDER-code-06
                  - PLACEHOLDER-code-07
                  - PLACEHOLDER-code-08
                  - PLACEHOLDER-code-09
                  - PLACEHOLDER-code-10
  /chronos.identity.v1.IdentityService/GetUser:
    get:
      tags:
        - IdentityService
      summary: |-
        GetUser returns the caller's own account: what it is, where it is in its
         lifecycle, and whether its address has been proven.
      description: |-
        AAL1 — no `min_aal` declared, so the default applies. This discloses nothing
         an attacker holding a session does not already have, and demanding step-up
         to render the account screen would make step-up routine, which is how people
         learn to approve it without reading it.
      operationId: IdentityService_GetUser.get
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
        - name: message
          in: query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.GetUserRequest'
        - name: encoding
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/encoding'
        - name: base64
          in: query
          schema:
            $ref: '#/components/schemas/base64'
        - name: compression
          in: query
          schema:
            $ref: '#/components/schemas/compression'
        - name: connect
          in: query
          schema:
            $ref: '#/components/schemas/connect'
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            The caller's own account. No address comes back, by construction: the
            caller holds a `subjectId` and resolves it against the vault, which is
            what keeps erasure a key destruction rather than a sweep across every
            projection that ever copied an address.

            `state` and `emailVerified` answer DIFFERENT questions. An account can
            be verified and still `PENDING`, because a proven second factor is also
            required before it activates. An unset timestamp means never — not
            unknown.
