            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.GetUserResponse'
              example:
                subjectId: subj_01ARZ3NDEKTSV4RRFFQ69G5FAV
                userId: usr_01ARZ3NDEKTSV4RRFFQ69G5FAV
                state: ACCOUNT_STATE_ACTIVE
                emailVerified: true
                registeredAt: '2026-07-02T08:15:00Z'
                activatedAt: '2026-07-02T08:19:41Z'
