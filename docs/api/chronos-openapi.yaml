  /chronos.identity.v1.IdentityService/ListMethods:
    get:
      tags:
        - IdentityService
      summary: |-
        ListMethods returns the authentication methods on the caller's account:
         which exist, what kind each is, whether it can be used now, and when it last
         was.
      description: |-
        AAL1, on the same argument as ListSessions: this is the screen on which
         somebody discovers an authenticator they did not enrol.
      operationId: IdentityService_ListMethods.get
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
        - name: message
          in: query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.ListMethodsRequest'
        - name: encoding
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/encoding'
        - name: base64
