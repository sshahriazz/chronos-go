syntax = "proto3";

// Package compliance is the wire contract for a data subject's own rights.
//
// Every method here acts on the CALLER'S OWN data and names no subject. That is
// not a convenience: a request that could name a subject is a request to
// exercise somebody else's rights, and the most dangerous endpoint in a product
// like this is one that acts on a person named by whoever asked.
//
// The rights are Chapter III of the GDPR. What is here is what is built;
// compliance.md §3 lists six and this carries one, because shipping an endpoint
// for a right the system cannot actually deliver is worse than not having it.
package chronos.compliance.v1;

import "chronos/options/v1/options.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

// RestrictProcessingRequest halts processing of the caller's data (Article 18).
message RestrictProcessingRequest {}

// RestrictProcessingResponse reports the state after the call.
message RestrictProcessingResponse {
  // Whether this call changed anything. False means processing was ALREADY
  // restricted, which is a success: the caller asked for a state that holds.
  bool changed = 1;

  // When the restriction began — the FIRST time it was invoked, not this call.
  // A repeated request must not move a date the person has been given.
  google.protobuf.Timestamp restricted_since = 2;
}

// LiftProcessingRestrictionRequest resumes processing of the caller's data.
message LiftProcessingRestrictionRequest {}

// LiftProcessingRestrictionResponse reports the state after the call.
message LiftProcessingRestrictionResponse {
  // False means nothing was restricted, which is a success for the same reason
  // the cancel path is: the control is clicked twice, and neither click is
  // wrong.
  bool changed = 1;
}

// GetProcessingRestrictionRequest asks whether the caller's data is restricted.
message GetProcessingRestrictionRequest {}

// GetProcessingRestrictionResponse is the current state.
message GetProcessingRestrictionResponse {
  // Whether processing is currently halted.
  bool restricted = 1;

  // When it began. Unset when there is no restriction.
  google.protobuf.Timestamp restricted_since = 2;
}

// ExportMyDataRequest asks for a copy of everything held about the caller.
message ExportMyDataRequest {}

// ExportMyDataResponse carries a short-lived link to the bundle.
message ExportMyDataResponse {
  // A signed, EXPIRING URL. Not stored anywhere by this system: it is a bearer
  // capability, and persisting one would turn an expiring link into a durable
  // credential for the most concentrated personal data we hold.
  //
  // Delivered here rather than as an email attachment, which compliance.md §5
  // requires: an attachment sits in a mailbox forever, is forwarded, and is
  // backed up by a provider nobody here controls.
  string download_url = 1 [(gnostic.openapi.v3.property) = {
    example: {yaml: "https://s3.example.com/chronos/avatar9f2.../k4m2n?X-Amz-Signature=..."}
    max_length: 4096
    pattern: "^https://"
  }];

  // When the link stops working.
  google.protobuf.Timestamp expires_at = 2;
}

// ComplianceService is the data subject's own rights, exercised on their own
// data.
service ComplianceService {
  // RestrictProcessing halts processing of the caller's data (Article 18).
  //
  // # What it stops, and what it deliberately does not
  //
  // Storage CONTINUES and nothing is deleted — that is the whole distinction
  // from erasure. The account keeps working, sign-in keeps working, projections
  // keep building. What stops is being contacted: no transactional mail, no
  // activity nudges, nothing product.
  //
  // SECURITY ALERTS STILL ARRIVE, and that exemption is deliberate. A control a
  // session holder can set, which stops a security alert, is a control an
  // attacker sets to silence the message that would reveal them — the same
  // reason a notification preference cannot switch one off. Article 18(2)
  // permits it: restriction does not bar processing needed to protect the
  // rights of a natural person, and a warning to the account's own holder about
  // their own account is exactly that.
  //
  // # Why AAL2
  //
  // Restricting somebody silences most of what would tell them their account is
  // being used. Requiring step-up does not remove that risk — the security
  // exemption above is what addresses it — but an endpoint that quietens a
  // person's mail must not be reachable from a session that has proven one
  // factor.
  //
  // Idempotent: a second call reports `changed: false` and returns the ORIGINAL
  // instant.
  rpc RestrictProcessing(RestrictProcessingRequest) returns (RestrictProcessingResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // LiftProcessingRestriction resumes processing of the caller's data.
  //
  // Nothing was lost while the restriction stood, which is Article 18's point as
  // distinct from Article 17: the data was held and not processed, so resuming
  // needs no recovery.
  //
  // Lifting nothing succeeds and reports `changed: false`.
  rpc LiftProcessingRestriction(LiftProcessingRestrictionRequest) returns (LiftProcessingRestrictionResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // ExportMyData produces a machine-readable copy of the caller's personal data
  // (Articles 15 and 20).
  //
  // # This is the most dangerous endpoint in the product
  //
  // It exports everything known about a person, on demand, in a convenient
  // bundle — which is compliance.md §3's own description of it. That is why the
  // subject is the authenticated caller and nothing else, why it takes AAL2, and
  // why the result is a link that expires rather than a payload in the response.
  //
  // # What the bundle contains, and what it does not
  //
  // Every personal-data field the vault holds, plus a statement of what is
  // RETAINED and why — Article 15(1) asks about the processing, not only the
  // values, so a file listing a name and an address while saying nothing about
  // invoices retained under a statutory obligation would be accurate and
  // misleading.
  //
  // It carries no event log, no password hash, no TOTP secret and no session
  // digests. The first names pseudonyms and positions meaningless outside this
  // deployment; the rest are derived from credentials rather than data about the
  // person, and exporting them would turn a privacy right into an offline attack
  // surface.
  //
  // # The bundle is purged by erasure, structurally
  //
  // It is written under the subject's OWN object prefix, which is the namespace
  // an erasure already empties. compliance.md §4 step 9 requires exported
  // bundles to be purged on erasure; putting them there makes that a property of
  // where they live rather than a step somebody has to remember.
  rpc ExportMyData(ExportMyDataRequest) returns (ExportMyDataResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    // EXPORT, not READ. Gate 4 never blocks this class: withholding a person's
    // own data from a suspended tenant is a portability violation, not leverage.
    option (chronos.options.v1.operation) = OPERATION_CLASS_EXPORT;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;
  }

  // GetProcessingRestriction reports whether the caller's data is restricted.
  //
  // A READ, and AAL1: somebody must be able to see the state of their own
  // request from an ordinary session. Requiring step-up to read what you already
  // asked for would make the setting hard to verify and easy to forget.
  rpc GetProcessingRestriction(GetProcessingRestrictionRequest) returns (GetProcessingRestrictionResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_READ;
  }
}
