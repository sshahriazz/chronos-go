syntax = "proto3";

// Package system exposes the server's own state — the probe surface the
// frontend uses to degrade deliberately rather than showing failed requests
// (ADR-010).
package chronos.system.v1;

import "buf/validate/validate.proto";
import "chronos/options/v1/options.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

// Health is a dependency's current state.
enum Health {
  HEALTH_UNSPECIFIED = 0;

  // Reachable and behaving.
  HEALTH_UP = 1;

  // Reachable but impaired, or unreachable in a way the system absorbs.
  // The product keeps working with reduced capability.
  HEALTH_DEGRADED = 2;

  // Unreachable, and the capability it provides is unavailable.
  HEALTH_DOWN = 3;
}

// Criticality states what happens to the product when a dependency is down.
// It is fixed per dependency at wiring time, never decided during an incident.
enum Criticality {
  CRITICALITY_UNSPECIFIED = 0;

  // Readiness fails. The process stays up; it just cannot serve.
  CRITICALITY_CRITICAL = 1;

  // Some capability is lost; the rest of the product continues.
  CRITICALITY_DEGRADABLE = 2;

  // Down means DENY, not degrade. Reserved for authorization: an attacker who
  // can take out the authorization service must not thereby gain access.
  CRITICALITY_FAIL_CLOSED = 3;
}

// Dependency is one piece of infrastructure the server relies on, and how it is
// currently behaving.
message Dependency {
  // Stable identifier, e.g. "postgres" or "openfga". Safe to switch on.
  //
  // "Safe to switch on" is what the pattern makes true: lower snake, so a client
  // matching on it is matching on an identifier rather than on prose that could
  // acquire a capital or a space.
  string name = 1 [
    (gnostic.openapi.v3.property) = {example: {yaml: "postgres"}},
    (buf.validate.field).string = {
      max_len: 64
      pattern: "^[a-z][a-z0-9_]*$"
    }
  ];

  // Current observed state.
  Health health = 2;

  // What losing this dependency costs the product.
  Criticality criticality = 3;

  // Operator-facing detail, such as a connection error. Never contains
  // credentials or personal data.
  string detail = 4 [
    (gnostic.openapi.v3.property) = {example: {yaml: "connect: connection refused"}},
    (buf.validate.field).string = {
      max_len: 512
      pattern: "^[^\\r\\n]*$"
    }
  ];

  // Client-facing description of what is unavailable while this dependency is
  // not up, so a UI can explain itself rather than showing a generic error.
  string impact = 5 [
    (gnostic.openapi.v3.property) = {example: {yaml: "Live updates stop; reloading a page still shows current data."}},
    (buf.validate.field).string = {
      max_len: 512
      pattern: "^[^\\r\\n]*$"
    }
  ];

  // When this dependency was last probed, in UTC (ADR-008).
  google.protobuf.Timestamp last_checked_at = 6;

  // Observed latency of the most recent probe, in milliseconds.
  //
  // The ceiling is one hour, which no probe can approach: every probe runs under
  // a context deadline far shorter than that. It is stated because a duration
  // published without one describes a field a client must treat as arbitrary.
  int64 latency_ms = 7 [
    (gnostic.openapi.v3.property) = {example: {yaml: "3"}},
    (buf.validate.field).int64 = {
      gte: 0
      lte: 3600000
    }
  ];
}

// GetStatusRequest is empty: the response describes the server, not a resource.
message GetStatusRequest {}

// GetStatusResponse is the full picture of server and dependency state.
message GetStatusResponse {
  // True when every CRITICAL dependency is up. Mirrors the /readyz probe.
  bool ready = 1;

  // True when every dependency is up. A server can be ready without being
  // fully operational — for example with realtime degraded.
  bool fully_operational = 2;

  // One entry per registered dependency, in registration order.
  //
  // The registry is a compile-time list, so the ceiling is a statement about this
  // binary rather than about a request: nine components today (CLAUDE.md's
  // architecture table), with room to double.
  repeated Dependency dependencies = 3 [(buf.validate.field).repeated.max_items = 32];

  // Build version of the running binary.
  //
  // Bounded but NOT pinned to semantic versioning: a development build carries
  // whatever `git describe` produced, and a document that promised `x.y.z` would
  // be wrong on every machine that is not a release runner.
  string version = 4 [
    (gnostic.openapi.v3.property) = {example: {yaml: "1.4.0"}},
    (buf.validate.field).string = {
      max_len: 64
      pattern: "^[A-Za-z0-9._+-]*$"
    }
  ];

  // When this process started, in UTC.
  google.protobuf.Timestamp started_at = 5;

  // The server's presentation timezone. Storage is always UTC (ADR-008); this
  // is exposed so a misconfigured deployment is visible.
  //
  // An IANA zone name, with the same grammar `chronos.profile.v1` holds a
  // person's timezone to.
  string timezone = 6 [
    (gnostic.openapi.v3.property) = {example: {yaml: "UTC"}},
    (buf.validate.field).string = {
      max_len: 64
      pattern: "^[A-Za-z][A-Za-z0-9_+-]*(/[A-Za-z0-9_+.-]+)*$"
    }
  ];
}

// SystemService reports server and dependency state.
service SystemService {
  // GetStatus reports per-dependency state so a client can grey out affected
  // features instead of discovering them through failed calls.
  //
  // Public by design: it must answer while the system is degraded, including
  // when authentication itself is unavailable.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    // No side effects, so Connect may serve it over GET and it is cacheable.
    option idempotency_level = NO_SIDE_EFFECTS;
    option (chronos.options.v1.public) = true;
    option (chronos.options.v1.operation) = OPERATION_CLASS_READ;

    // OpenAPI facts the generator cannot infer, stated here so the published
    // REST document is generated from this schema rather than written beside
    // it (CONVENTIONS §7.1).
    //
    // `security: [{}]` restates `public` for the generator, which reads gnostic
    // annotations and knows nothing of this repo's own options. The empty
    // requirement overrides the document-level `bearerAuth`, so
    // "unauthenticated" is a statement in the document rather than the absence
    // of one. internal/tools/checkopenapi asserts the two agree, so this cannot
    // drift away from the option the interceptor actually reads.
    //
    // The `200` response is restated in full because the generator REPLACES a
    // status code it is given rather than merging into it; the `schema`
    // reference below is the one it would have emitted, and a wrong one is
    // caught by the dangling-$ref check in internal/tools/checkopenapi.
    option (gnostic.openapi.v3.operation) = {
      security: [{}]
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description:
                  "Server and dependency state.\n"
                  "\n"
                  "The example is the interesting case rather than the happy one: `ready` is\n"
                  "true because every CRITICAL dependency is up, and `fullyOperational` is\n"
                  "false because a DEGRADABLE one is not. A client greys out the affected\n"
                  "feature and leaves the rest alone.\n"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {reference: {_ref: "#/components/schemas/chronos.system.v1.GetStatusResponse"}}
                        example: {
                          yaml:
                            "ready: true\n"
                            "fullyOperational: false\n"
                            "version: 1.4.0\n"
                            "startedAt: '2026-08-14T09:12:03Z'\n"
                            "timezone: UTC\n"
                            "dependencies:\n"
                            "  - name: postgres\n"
                            "    health: HEALTH_UP\n"
                            "    criticality: CRITICALITY_CRITICAL\n"
                            "    detail: ''\n"
                            "    impact: Nothing can be read or written.\n"
                            "    lastCheckedAt: '2026-08-14T11:04:55Z'\n"
                            "    latencyMs: '3'\n"
                            "  - name: openfga\n"
                            "    health: HEALTH_UP\n"
                            "    criticality: CRITICALITY_FAIL_CLOSED\n"
                            "    detail: ''\n"
                            "    impact: Every authorization check is denied while this is down.\n"
                            "    lastCheckedAt: '2026-08-14T11:04:55Z'\n"
                            "    latencyMs: '7'\n"
                            "  - name: centrifugo\n"
                            "    health: HEALTH_DEGRADED\n"
                            "    criticality: CRITICALITY_DEGRADABLE\n"
                            "    detail: 'connect: connection refused'\n"
                            "    impact: Live updates stop; reloading a page still shows current data.\n"
                            "    lastCheckedAt: '2026-08-14T11:04:55Z'\n"
                            "    latencyMs: '1004'\n"
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }
}
