syntax = "proto3";

// Package options defines the enforcement policy that every RPC must declare
// (ADR-021).
//
// The gates are declarative on purpose. A per-handler design fails in exactly
// one way: the endpoint nobody remembered to guard is the one that leaks. Here
// the policy lives beside the method, the interceptors read it, and an RPC with
// no policy fails at server startup rather than at request time.
//
// These options are also rendered into the generated documentation
// (CONVENTIONS §7.1), so "what permission does this endpoint need?" is answered
// by the schema instead of by reading the source.
package chronos.options.v1;

import "google/protobuf/descriptor.proto";

// OperationClass drives the payment gate (organization.md §5.2). The org's
// lifecycle state decides which classes are permitted.
enum OperationClass {
  OPERATION_CLASS_UNSPECIFIED = 0;

  // Reads. Permitted in every org state, including Suspended and Closed.
  OPERATION_CLASS_READ = 1;

  // Ordinary writes. Blocked once an org is Suspended.
  OPERATION_CLASS_WRITE = 2;

  // Consumes a seat or a quota unit. Blocked earlier than WRITE — stop them
  // adding seats before you stop them working.
  OPERATION_CLASS_GROW = 3;

  // Viewing billing. NEVER blocked: an org admin may always see spend.
  OPERATION_CLASS_BILLING_VIEW = 4;

  // Changing billing. NEVER blocked: locking a past-due customer out of the
  // page where they would pay you is self-inflicted revenue loss.
  OPERATION_CLASS_BILLING_MANAGE = 5;

  // Data export. NEVER blocked: withholding data from a suspended tenant is a
  // GDPR portability violation, not leverage.
  OPERATION_CLASS_EXPORT = 6;
}

// AssuranceLevel is the authentication strength a method requires
// (identity.md §2). Step-up raises a session for a time-boxed window.
enum AssuranceLevel {
  ASSURANCE_LEVEL_UNSPECIFIED = 0;
  ASSURANCE_LEVEL_1 = 1; // single factor
  ASSURANCE_LEVEL_2 = 2; // two factors, or a passkey with user verification
  ASSURANCE_LEVEL_3 = 3; // hardware-bound authenticator
}

// Authz declares the permission check the authz gate performs.
message Authz {
  // The relation required, e.g. "admin".
  string relation = 1;

  // The resource type the relation applies to, e.g. "organization".
  string resource_type = 2;

  // Request field holding the resource id. Empty means the request is scoped
  // to the org already resolved by the org-context gate.
  string resource_id_field = 3;
}

extend google.protobuf.MethodOptions {
  // Required on every method. The server refuses to start without it.
  chronos.options.v1.Authz authz = 51001;

  // Required on every method.
  chronos.options.v1.OperationClass operation = 51002;

  // Entitlement key checked by gate 4, e.g. "seats.member". Optional: many
  // methods consume no entitlement.
  string entitlement = 51003;

  // Minimum assurance level. Defaults to AAL1 when unset.
  chronos.options.v1.AssuranceLevel min_aal = 51004;

  // The assurance floor that applies while — and only while — the caller's
  // account has never held a proven second factor.
  //
  // It exists because `min_aal = ASSURANCE_LEVEL_2` on second-factor management
  // is otherwise a deadlock, not a policy. A second factor is mandatory before
  // an account activates (identity.md §2), and AAL2 means a second factor was
  // presented, so an account that has none can never obtain the one it must
  // have: the only calls that could give it one are the calls it cannot reach.
  //
  // The distinction the floor draws is between FIRST enrolment, where there is
  // no factor to present and nothing yet to protect, and adding or replacing a
  // factor, where the existing one must be presented — which is exactly the
  // step that stops an attacker holding a stolen password from making their
  // access durable. Only the first is exempted, and the exemption ends the
  // moment the first factor is proven.
  //
  // Three properties make it safe, and all three are enforced rather than
  // documented:
  //
  //   - The condition is a fact about the caller's own account, read
  //     server-side from the session. No request field, no header and no claim
  //     the caller controls takes part in it, so it cannot be asserted.
  //   - It is one-way. The account leaves the bootstrap window when its first
  //     factor is proven, and nothing returns it — removing or losing a factor
  //     later does NOT re-open the exemption, which is what stops "delete the
  //     factor, then enrol my own".
  //   - The policy loader refuses every incoherent declaration at startup: on a
  //     public method, on a method that is not scoped to the caller's own
  //     account, with no `min_aal` to be an exemption from, or at a level that
  //     is not strictly below it. A floor that could be misdeclared silently
  //     would be worse than the deadlock it removes.
  //
  // Unset means no exemption: `min_aal` applies in every state. That is the
  // right default — a method that says nothing about bootstrap gets the strict
  // answer.
  chronos.options.v1.AssuranceLevel bootstrap_min_aal = 51006;

  // Marks a method as public — no authentication, no gates. Used only by
  // health and discovery endpoints. Mutually exclusive with authz.
  bool public = 51005;
}
