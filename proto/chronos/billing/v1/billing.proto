syntax = "proto3";

// Package billing is the wire contract for money.
//
// It is deliberately small, and the reason is the rule billing.md §1 states:
// **Stripe owns subscriptions and invoices; we own the plan catalogue and the
// mapping to organization lifecycle.** Anything this service could compute — a
// total, a proration, a tax amount — is a second implementation of arithmetic
// Stripe already did, and two implementations of the same arithmetic disagree
// eventually. So there is no "add a card" method here, no "change plan", no
// "cancel": those are the Customer Portal's, and this service's job is to hand
// the customer a signed door to it.
//
// # Why a hosted portal rather than our own billing screens
//
// A card field of ours is a PCI surface, a UI to maintain, and a second place
// where a subscription can be changed. The Portal does update payment method,
// view and download invoices, change plan, cancel, and — the one that matters
// most for a cardless trial — RESUME A PAUSED SUBSCRIPTION. Every one of those
// arrives back as a webhook, which is why the webhook handler re-fetches rather
// than trusting a payload: for a change made inside Stripe's UI, the webhook is
// the only signal this system ever gets.
package chronos.billing.v1;

import "buf/validate/validate.proto";
import "chronos/options/v1/options.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

// CreateBillingPortalSessionRequest asks for a signed link into Stripe's
// Customer Portal.
message CreateBillingPortalSessionRequest {
  // Where Stripe returns the customer when they are finished.
  //
  // Required, and validated as an absolute HTTPS URL rather than accepted as
  // free text. This value is handed to Stripe and Stripe redirects a browser to
  // it, so an unvalidated one turns a billing call into an open redirect — the
  // classic phishing primitive, wearing our domain's session.
  //
  // The bound is the published one and the enforced one both: `uri` here is
  // protovalidate's absolute-URI rule, and the pattern pins the scheme.
  string return_url = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "https://app.example.com/settings/billing"}
      max_length: 2048
    },
    (buf.validate.field).string = {
      min_len: 8
      max_len: 2048
      uri: true
      pattern: "^https://"
    },
    (buf.validate.field).required = true
  ];
}

// CreateBillingPortalSessionResponse carries the door.
message CreateBillingPortalSessionResponse {
  // The Portal URL. Short-lived and single-use — Stripe expires it, and this
  // system stores nothing about it.
  //
  // Redirect the browser here. Do not embed it in an iframe: Stripe sets frame
  // headers that refuse it, and a customer who cannot see the page cannot pay.
  //
  // The pattern is DOCUMENTATION of Stripe's shape, not a rule this server
  // enforces — a response field has no protovalidate to enforce it, and pinning
  // the host would make a Stripe change look like our bug. It says the one thing
  // a client must be able to rely on: this is an absolute https URL, safe to put
  // in a redirect.
  string url = 1 [(gnostic.openapi.v3.property) = {
    example: {yaml: "https://billing.stripe.com/p/session/live_YWNjdF8xMjM"}
    max_length: 2048
    pattern: "^https://"
  }];
}

// Invoice is one invoice, as Stripe reported it.
//
// A REFERENCE and a STATUS. There is no line-item breakdown, no tax detail and
// no computed total, because billing.md §6's rule generalises: we never compute
// an amount, since reimplementing the arithmetic guarantees the two disagree
// eventually. Anything richer than this is on Stripe's hosted invoice page,
// which `hosted_url` links to.
message Invoice {
  // Stripe's invoice id.
  //
  // The pattern deliberately does NOT spell the `in_` prefix, even though every
  // Stripe invoice id has one. A published pattern of the form `^xx_...` claims
  // this repository's identifier grammar — a prefixed ULID that
  // internal/platform/ids can parse — and `internal/tools/checkopenapi` holds
  // every such field to it. This id is STRIPE'S: they own its shape, they may
  // change its length, and nothing here can parse it. Describing the character
  // set is honest; claiming our grammar would be a bound that lies.
  string invoice_id = 1 [(gnostic.openapi.v3.property) = {
    example: {yaml: "in_1MtHbELkdIwHu7ixl4OzzPMv"}
    max_length: 255
    pattern: "^[A-Za-z0-9_]+$"
  }];

  // The human-facing reference a customer quotes to support. Empty on a draft:
  // Stripe assigns it at finalization, and inventing one would create a
  // reference nobody else can match.
  string number = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "C1D2E3F4-0001"}
    max_length: 64
    pattern: "^[A-Za-z0-9-]*$"
  }];

  // Stripe's own vocabulary: draft, open, paid, uncollectible, void. NOT a
  // mapping of ours — this value is shown to people, and a translation would
  // make our word differ from the word on Stripe's dashboard during exactly the
  // conversation where they must not.
  string status = 3 [(gnostic.openapi.v3.property) = {
    example: {yaml: "paid"}
    max_length: 32
    pattern: "^(draft|open|paid|uncollectible|void)$"
  }];

  // MINOR UNITS — cents, or the currency's smallest denomination — exactly as
  // Stripe sent them. Not converted to a decimal, because converting means
  // choosing a scale per currency, which is the arithmetic we refuse to
  // reimplement. Divide by the exponent for `currency` to render.
  // The ceiling is 2^31-1 rather than the wire type's maximum, for the reason
  // notification.GetUnreadCountResponse records: gnostic's `maximum` is a
  // DOUBLE, and 2^63-1 does not survive a round trip through one — it comes back
  // larger than any int64 and looks like a typo in the published document. In
  // minor units 2^31-1 is about 21 million dollars on one invoice, which is a
  // bound a client can act on.
  //
  // The floor is a `gte` rule and not an annotation because `minimum: 0` is
  // proto3's zero value for that field and is dropped before the generator sees
  // it.
  int64 amount_due = 4 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "2400"}
      maximum: 2147483647
    },
    (buf.validate.field).int64.gte = 0
  ];

  // Minor units, with the same bounds and for the same reasons.
  int64 amount_paid = 5 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "2400"}
      maximum: 2147483647
    },
    (buf.validate.field).int64.gte = 0
  ];

  // ISO 4217, lower case, as Stripe sends it. A customer's currency is fixed by
  // their first invoice (billing.md §5 case 12), so this is where that becomes
  // observable.
  string currency = 6 [(gnostic.openapi.v3.property) = {
    example: {yaml: "usd"}
    max_length: 3
    pattern: "^[a-z]{3}$"
  }];

  // The billing period covered. UNSET on a one-off invoice, which reports none.
  //
  // Timestamps rather than formatted strings, which is this schema's convention
  // for an instant: a string would need a pattern that re-implements RFC 3339
  // badly, and every client would parse it by hand.
  google.protobuf.Timestamp period_start = 7;

  // The billing period covered. Unset on a one-off invoice.
  google.protobuf.Timestamp period_end = 8;

  // Stripe's hosted invoice page: the full breakdown, and the PDF download. We
  // render neither. Empty on a draft, which has no hosted page yet.
  string hosted_url = 9 [(gnostic.openapi.v3.property) = {
    example: {yaml: "https://invoice.stripe.com/i/acct_1/test_YWNjdF8x"}
    max_length: 2048
    pattern: "^(https://.*)?$"
  }];

  // When Stripe created it. The ordering this list returns.
  google.protobuf.Timestamp created_at = 10;
}

// ListInvoicesRequest asks for a page of the organization's billing history.
message ListInvoicesRequest {
  // How many to return. Defaults to 20 when unset.
  int32 page_size = 1 [
    (gnostic.openapi.v3.property) = {example: {yaml: "20"}},
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    }
  ];

  // The `next_page_token` from a previous response. Opaque: it encodes the sort
  // key this list pages on, and is bound to the query that issued it — a token
  // from a different list is refused rather than silently reinterpreted.
  string page_token = 2 [
    (gnostic.openapi.v3.property) = {max_length: 512},
    (buf.validate.field).string = {
      max_len: 512
      pattern: "^[A-Za-z0-9_-]*$"
    }
  ];
}

// ListInvoicesResponse is one page, newest first.
message ListInvoicesResponse {
  // The page, ordered by creation instant descending.
  repeated Invoice invoices = 1 [
    (gnostic.openapi.v3.property) = {max_items: 100},
    (buf.validate.field).repeated = {max_items: 100}
  ];

  // Empty when there are no more. Pass it back as `page_token`.
  string next_page_token = 2 [(gnostic.openapi.v3.property) = {
    max_length: 512
    pattern: "^[A-Za-z0-9_-]*$"
  }];
}

// BillingService is the commercial self-service surface.
service BillingService {
  // ListInvoices returns the organization's billing history, newest first.
  //
  // A reference and a status per invoice, never a computed total — the full
  // breakdown and the PDF live on Stripe's hosted invoice page, which each entry
  // links to. There is nothing here to reconcile against Stripe because nothing
  // here was calculated.
  //
  // # Why BILLING_VIEW and not BILLING_MANAGE
  //
  // `billing_viewer` includes organization ADMINS, while `billing_manager`
  // resolves to the owner alone (organization.md §5.1). That split is ADR-027's:
  // an admin may always see what the company is spending without being able to
  // change what it is committed to. Seeing an invoice is the first half.
  //
  // Never blocked by gate 4, in any organization state. A suspended tenant's
  // admin may still read what they were billed — withholding it is leverage, not
  // security, and the invoice is theirs.
  //
  // A trialing organization has no invoices and a paused one generates none, so
  // an empty list is the ordinary answer during a trial rather than a fault.
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse) {
    option (chronos.options.v1.authz) = {
      relation: "billing_viewer"
      resource_type: "organization"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_BILLING_VIEW;
  }

  // CreateBillingPortalSession returns a signed link into Stripe's Customer
  // Portal for the caller's organization.
  //
  // # This is how a trial becomes revenue
  //
  // The trial is cardless (ORG-WORKSPACE-SCOPE §3), and the subscription is
  // created with `trial_settings.end_behavior.missing_payment_method = pause`.
  // So a trial that ends with no card leaves the organization `Suspended` —
  // unreachable, not gone, and reversible the moment a card arrives. THIS is
  // the call that lets it arrive. Without it a trial has exactly one outcome.
  //
  // The subscription created at trial start is the subscription the
  // organization keeps for its whole life (billing.md §5 case 25): the Portal
  // updates it rather than replacing it, so the subscription id is stable,
  // billing history stays continuous, and there is never more than one
  // subscription per organization.
  //
  // # Why it is BILLING_MANAGE, and why that class is never blocked
  //
  // Gate 4 refuses ordinary writes once an organization is suspended. If it
  // refused this one, a suspended organization could never pay, and suspension
  // — which exists to be reversible — would be terminal. Locking a past-due
  // customer out of the page where they would pay you is self-inflicted revenue
  // loss, so `BILLING_MANAGE` is permitted in every organization state.
  //
  // # Who may call it
  //
  // `billing_manager`, which organization.md §5.1 resolves to the OWNER ALONE.
  // An organization admin holds `billing_viewer` instead and can see spend and
  // invoices without being able to change what the company is committed to
  // (ADR-027) — because the Portal can cancel the subscription and change the
  // plan, and those are the owner's decisions.
  //
  // Returns `CONFLICT` if the organization has no Stripe customer yet, which is
  // the provisioning window: creation appends the event and a reactor mirrors it
  // to Stripe seconds later. It is a state that passes on its own, so the
  // remedy is to retry rather than to report a fault.
  rpc CreateBillingPortalSession(CreateBillingPortalSessionRequest) returns (CreateBillingPortalSessionResponse) {
    option (chronos.options.v1.authz) = {
      relation: "billing_manager"
      resource_type: "organization"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_BILLING_MANAGE;

    // A MUTATING class, so it carries an Idempotency-Key. The header is
    // described once, in proto/openapi.base.yaml's components, and every
    // operation that requires it references that one description.
    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }
}
