syntax = "proto3";

// Package workspace is the wire contract for the collaboration boundary: the
// spaces inside an organization where work actually happens.
//
// Three properties of this schema are load-bearing.
//
// **A workspace lives inside exactly one organization, and never names it.**
// There is no `org_id` field on any request. The organization comes from the
// resolved tenant scope, and a request that could name its own would be a
// request to create a workspace inside somebody else's tenant.
//
// **Creating one CONSUMES QUOTA**, which is why `CreateWorkspace` declares
// `(chronos.options.v1.entitlement)`. The declaration is what makes gate 4 run:
// without it the RPC is ungated and the plan's workspace cap does not apply.
//
// **The creator is its first admin**, from the creation event itself rather than
// a second one. A workspace that existed for even one event with no admin would
// violate the never-zero rule from birth, and a replay would reproduce that.
package chronos.workspace.v1;

import "buf/validate/validate.proto";
import "chronos/options/v1/options.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

// CreateWorkspaceRequest opens a workspace in the caller's organization.
message CreateWorkspaceRequest {
  // The display name people read. Free text within a bound.
  string name = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "Engineering"}
      max_length: 80
      pattern: "^\\S(.*\\S)?$"
    },
    (buf.validate.field).string = {
      min_len: 1
      max_len: 80
      pattern: "^\\S(.*\\S)?$"
    }
  ];
}

// CreateWorkspaceResponse names what was created.
message CreateWorkspaceResponse {
  // The workspace's public id, a prefixed ULID (ADR-030).
  string workspace_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ws_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 29
    },
    (buf.validate.field).string = {
      max_len: 29
      pattern: "^ws_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The name as stored, which is the trimmed form of what was sent.
  //
  // Carries the SAME pattern as the request. A response string is published to
  // clients exactly as a request string is, and a generated client validating
  // what it receives must be given the shape to validate against.
  string name = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "Engineering"}
      max_length: 80
      pattern: "^\\S(.*\\S)?$"
    },
    (buf.validate.field).string = {
      max_len: 80
      pattern: "^\\S(.*\\S)?$"
    }
  ];

  // The lifecycle status. Always `active` for a workspace just created.
  string status = 3 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "active"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: ["active", "archived", "deleted"]
    }
  ];
}

// AddWorkspaceMemberRequest puts an existing account into a workspace.
//
// It names a SUBJECT, never an address. A pseudonym is the only way an account
// appears on this wire (ADR-002), and adding by email would need the caller to
// know one — which is what invitations are for, and they are a different call.
message AddWorkspaceMemberRequest {
  // Which workspace. Read by the authz gate, which asks for `admin` on THIS
  // object rather than on the organization: an org admin inherits it through the
  // `parent` edge, and a workspace admin who is not an org admin does not.
  string workspace_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ws_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 29
    },
    (buf.validate.field).string = {
      max_len: 29
      pattern: "^ws_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Who joins, by pseudonym.
  string subject_id = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "subj_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 31
    },
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^subj_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The role they join with: `admin`, `member` or `guest`.
  //
  // `admin` and `member` draw on the member seat pool; `guest` draws on the
  // separate guest pool (ADR-027). Which pool is consulted is decided from this
  // value, so it is bounded by an enumeration rather than by a length.
  string role = 3 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "member"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: [
        "admin",
        "member",
        "guest"
      ]
    }
  ];
}

// AddWorkspaceMemberResponse reports what the join cost.
message AddWorkspaceMemberResponse {
  // The role as recorded.
  string role = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "member"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: [
        "admin",
        "member",
        "guest"
      ]
    }
  ];

  // Whether this join took a seat from the organization's pool.
  //
  // False is the ordinary answer for somebody already in the organization: a
  // seat is per person per organization, so their second workspace is free
  // (workspace.md §2). Published because a caller adding people in bulk
  // otherwise has no way to see which of them were billable.
  bool seat_consumed = 2;
}

// RemoveWorkspaceMemberRequest takes an account out of a workspace.
message RemoveWorkspaceMemberRequest {
  // Which workspace.
  string workspace_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ws_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 29
    },
    (buf.validate.field).string = {
      max_len: 29
      pattern: "^ws_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Who leaves, by pseudonym.
  string subject_id = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "subj_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 31
    },
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^subj_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];
}

// RemoveWorkspaceMemberResponse reports what the removal returned.
message RemoveWorkspaceMemberResponse {
  // Whether a seat went back to the pool.
  //
  // False when the person is still in another workspace of the same
  // organization, which is the half of the seat rule that leaks revenue if
  // inverted: releasing on every removal hands back a seat the person still
  // holds.
  bool seat_released = 1;
}

// ChangeWorkspaceMemberRoleRequest promotes or demotes an existing member.
message ChangeWorkspaceMemberRoleRequest {
  // Which workspace.
  string workspace_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ws_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 29
    },
    (buf.validate.field).string = {
      max_len: 29
      pattern: "^ws_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Whose role changes, by pseudonym.
  string subject_id = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "subj_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 31
    },
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^subj_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The role to move to.
  string role = 3 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "admin"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: [
        "admin",
        "member",
        "guest"
      ]
    }
  ];
}

// ChangeWorkspaceMemberRoleResponse reports the role now held.
message ChangeWorkspaceMemberRoleResponse {
  // The role as recorded. Equal to the requested one on success, and equal to
  // the previous one when the request asked for the role already held — which
  // is a no-op rather than a conflict.
  string role = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "admin"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: [
        "admin",
        "member",
        "guest"
      ]
    }
  ];
}

// InviteToWorkspaceRequest invites an address into a workspace.
//
// The ADDRESS is the one piece of personal data on this service's wire. It
// reaches the vault and the blind indexer and goes no further: no event, no log
// line and no projection carries it, and the response never echoes it back.
message InviteToWorkspaceRequest {
  // Which workspace. Read by the authz gate, which asks for `admin` on THIS
  // object rather than on the organization.
  string workspace_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ws_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 29
    },
    (buf.validate.field).string = {
      max_len: 29
      pattern: "^ws_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Where to send the invitation.
  //
  // The bound is PUBLISHED rather than enforced, for the reason every other
  // email field in this schema publishes one: the CEL `email` rule is measured
  // on the trimmed value and a `max_len` rule is measured by the interceptor on
  // the raw one, so an enforced length would refuse an address the handler
  // accepts (CONVENTIONS §7.2).
  string email = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "colleague@example.com"}
      max_length: 254
      pattern: "^.+@.+\\..+$"
    },
    (buf.validate.field).string = {email: true}
  ];

  // The role they join with: `admin`, `member` or `guest`.
  string role = 3 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "member"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: [
        "admin",
        "member",
        "guest"
      ]
    }
  ];
}

// InviteToWorkspaceResponse names the invitation that was created.
//
// It carries NO TOKEN. The link is a credential, and the only party entitled to
// it is the person at the address — putting it in this response would hand it to
// the inviter, who could then join as somebody else. It also never echoes the
// address back, so the response cannot be used to confirm what was typed.
message InviteToWorkspaceResponse {
  // The invitation's public id, a prefixed ULID (ADR-030).
  string invitation_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "inv_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 30
    },
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^inv_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The role as recorded.
  string role = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "member"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: [
        "admin",
        "member",
        "guest"
      ]
    }
  ];

  // Whether issuing took a seat from the organization's pool.
  //
  // The seat is taken AT ISSUE, not at acceptance: otherwise 60 pending
  // invitations against 50 seats all look valid, and the 51st acceptance fails
  // for somebody who did nothing wrong (workspace.md §5). False means the
  // invitee is already in the organization and already holds one.
  bool seat_consumed = 3;

  // When the link stops working.
  //
  // A Timestamp rather than a formatted string, which is this schema's
  // convention for an instant: a string would need a pattern that re-implements
  // RFC 3339 badly, and every client would parse it by hand.
  google.protobuf.Timestamp expires_at = 4;
}

// WorkspaceService is the collaboration surface.
service WorkspaceService {
  // CreateWorkspace opens a workspace in the caller's organization.
  //
  // # It runs the whole pipeline, in order
  //
  // organization.md §6: authz (org `admin`) -> subscription (`grow`, so blocked
  // outside Trialing and Active) -> entitlement (`workspaces.count` reserved) ->
  // handler. This is the first RPC in the system to declare an entitlement, and
  // therefore the first that gate 4 has ever run for.
  //
  // The `grow` class matters as much as the entitlement: a past-due organization
  // is refused here while its existing workspaces keep working, which is
  // organization.md §5.2's rule that growth stops before work does.
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "organization"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_GROW;
    option (chronos.options.v1.entitlement) = "workspaces.count";

    // A MUTATION, so it carries an Idempotency-Key. The header is described
    // once, in proto/openapi.base.yaml's components, and every operation that
    // requires it references that one description.
    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // AddWorkspaceMember puts an existing account into a workspace.
  //
  // # `admin` on the WORKSPACE, not on the organization
  //
  // The authz gate reads `workspace_id` from the request and asks about that
  // object. An org admin still passes, through the `parent` edge that
  // `CreateWorkspace` writes (organization.md §5.1) — but a workspace admin who
  // administers nothing else passes too, which is the point of the edge.
  //
  // # GROW, because it may consume a seat
  //
  // May, not will. A seat is per person per ORGANIZATION, so somebody joining
  // their second workspace consumes nothing (workspace.md §2). That is why this
  // method declares no `(chronos.options.v1.entitlement)`: gate 4 reserves
  // unconditionally, and reserving here would take a seat from somebody who
  // already holds one, every time they joined another workspace. The reservation
  // is conditional and therefore belongs in the handler, which is the only place
  // that can ask "is this person already in this organization".
  //
  // The response reports `seat_consumed` so a caller adding people in bulk can
  // see which of them were billable.
  rpc AddWorkspaceMember(AddWorkspaceMemberRequest) returns (AddWorkspaceMemberResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_GROW;

    // A MUTATION, so it carries an Idempotency-Key.
    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // RemoveWorkspaceMember takes an account out of a workspace.
  //
  // # WRITE, not GROW
  //
  // Removal returns capacity rather than taking it, so gating it at GROW would
  // stop a past-due organization from reducing what it owes — which is the
  // opposite of what organization.md §5.2 is for.
  //
  // # The last admin cannot be removed
  //
  // A workspace with no admin is unadministrable and no event can fix it from
  // the outside, so the aggregate refuses rather than recording it. The refusal
  // is FAILED_PRECONDITION: the request is well formed and the caller is
  // permitted, and the state is what says no.
  //
  // The seat goes back only when this was the person's LAST membership in the
  // organization. `seat_released` reports which happened.
  rpc RemoveWorkspaceMember(RemoveWorkspaceMemberRequest) returns (RemoveWorkspaceMemberResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    // A MUTATION, so it carries an Idempotency-Key.
    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // ChangeWorkspaceMemberRole promotes or demotes an existing member.
  //
  // # GROW, because a promotion can cross seat pools
  //
  // Guest seats and member seats are independent limits (ADR-027), so moving
  // somebody from `guest` to `member` releases one and takes the other. The new
  // seat is taken BEFORE the old one is returned, so a promotion into a full
  // pool fails visibly instead of leaving the person holding neither.
  //
  // A change within one pool — `member` to `admin` — costs nothing and is still
  // GROW, because the class is a property of the method and not of the argument.
  rpc ChangeWorkspaceMemberRole(ChangeWorkspaceMemberRoleRequest) returns (ChangeWorkspaceMemberRoleResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_GROW;

    // A MUTATION, so it carries an Idempotency-Key.
    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // InviteToWorkspace invites an address into a workspace.
  //
  // # GROW, and it consumes the seat NOW
  //
  // workspace.md §5: the seat is reserved at ISSUE and not at acceptance.
  // Reserving at acceptance means 60 pending invitations against 50 seats all
  // look valid, and the 51st person to click their link is refused for something
  // somebody else did.
  //
  // The reservation is still CONDITIONAL — somebody already in the organization
  // holds a seat, and inviting them into another workspace costs nothing — which
  // is why this declares no `(chronos.options.v1.entitlement)`: gate 4 reserves
  // unconditionally, and would charge a second seat every time.
  //
  // # The address goes no further than the vault
  //
  // It is the one piece of personal data on this service's wire. The event
  // carries a keyed blind index and a pseudonym; the mail resolves the real
  // address from the vault at send time (ADR-002).
  //
  // # The response carries no link
  //
  // The token is a credential and the only party entitled to it is the person at
  // the address. Returning it here would hand it to the inviter, who could then
  // accept as somebody else.
  rpc InviteToWorkspace(InviteToWorkspaceRequest) returns (InviteToWorkspaceResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_GROW;

    // A MUTATION, so it carries an Idempotency-Key.
    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }
}
