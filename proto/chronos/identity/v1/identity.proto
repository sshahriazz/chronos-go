    // on the annotation is proto3's zero value for that field, indistinguishable
    // from unset, so the generator never sees it and the document silently loses
    // the bound. `gte` survives, and on a response message it adds no refusal to
    // anything — the interceptor validates requests.
    (buf.validate.field).int32.gte = 0
  ];
