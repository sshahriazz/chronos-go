syntax = "proto3";

// Package identity is the wire contract for accounts, credentials, sessions and
// the security-settings screen.
//
// Three properties of this schema are load-bearing, and each of them is a rule
// the messages below are shaped by rather than a convention they happen to
// follow.
//
// **Nothing personal is here.** Identity holds the most personal data in the
// system and puts the least of it in the log (ADR-002). Every account is named
// on the wire by its `subject_id` pseudonym, and an address appears in exactly
// three places: `RegisterRequest.email`,
// `ResendEmailVerificationRequest.email` and `AuthenticateRequest.identifier`,
// where the user has just typed it. No response returns one. That is what makes
// erasure the destruction of a key rather than a migration across every
// projection that ever copied an address.
//
// **A password is set by the party that proved the mailbox, and by nobody
// else.** `RegisterRequest` carries NO password and field 2 is reserved so it
// can never carry one again; `VerifyEmailRequest` carries it instead. The
// ordering is the whole defence against the pre-hijacking attack (Sudhodanan &
// Paverd, USENIX Security 2022): a credential set at registration is set by
// whoever typed the address, and the verification click that follows proves
// control of the MAILBOX rather than authorship of that credential. With no
// credential in existence until the link is followed, there is nothing for a
// stranger's registration to leave behind.
//
// **A secret crosses this boundary at most once.** The session token, the TOTP
// shared secret and its provisioning URI, and the plaintext recovery codes are
// returned by the single call that mints them and are then unrecoverable. There
// is deliberately no endpoint that re-displays any of them: one that did would
// turn a stolen session into a permanent bypass of every factor on the account.
// No password, verifier, digest, sealed secret or blind index appears anywhere
// in this file, in either direction.
//
// **A refusal says nothing (ADR-036).** An unknown identifier, a wrong password,
// a wrong code, a replayed code, an unverified address, a deactivated account, a
// suspended account and a throttled attempt all produce one undifferentiated
// error. No message here carries a field that could distinguish them. The real
// reason is recorded in the event log, where an operator can read it and an
// attacker cannot, and it is surfaced to the account HOLDER — after the fact,
// about their own account — by ListLoginHistory.
//
// **Validation here is deliberately asymmetric, and the asymmetry is the third
// property enforced rather than described.** Constraints are declarative
// protovalidate rules (ADR-007, CONVENTIONS §7) and the interceptor applies them
// before a handler runs — so on the ENROLMENT side, where the rules are public
// and printed next to the signup form, they are stated in full: RegisterRequest
// carries the whole address and password policy.
//
// On the AUTHENTICATION side they are almost entirely absent, and their absence
// is load-bearing. A request refused as malformed tells the caller their guess
// was structurally wrong, which is information a wrong password does not give.
// AuthenticateRequest.password, AuthenticateRequest.code,
// CreateSessionRequest.password and CreateSessionRequest.code therefore carry NO
// rules at all: no length, no shape, no `required`. A validation rule on a
// credential being presented is an oracle, and ADR-036's single undifferentiated
// refusal cannot survive one.
package chronos.identity.v1;

import "buf/validate/validate.proto";
import "chronos/options/v1/options.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

// MethodKind labels an authentication method.
//
// The wire enum mirrors the module's stored labels, which are strings that live
// in events forever. New kinds are added here as they become implementable, so a
// client must treat an unrecognised value as "some factor this build does not
// render" rather than as an error.
enum MethodKind {
  METHOD_KIND_UNSPECIFIED = 0;

  // A knowledge factor. Never sufficient alone on this system.
  METHOD_KIND_PASSWORD = 1;

  // A time-based one-time password from an authenticator app.
  METHOD_KIND_TOTP = 2;

  // A single-use printed code, for when every other factor is unavailable.
  METHOD_KIND_RECOVERY_CODE = 3;

  // A WebAuthn credential. With user verification it reaches AAL2 alone.
  METHOD_KIND_PASSKEY = 4;

  // An external identity provider.
  METHOD_KIND_FEDERATED = 5;
}

// AccountState is where an account sits in its lifecycle (identity.md §1).
//
// Deactivated and Suspended look identical from outside and are kept apart
// because they behave differently: the holder may reverse the first and may
// never reverse the second. Collapsing them would make suspension decorative.
enum AccountState {
  ACCOUNT_STATE_UNSPECIFIED = 0;

  // Registered but not yet usable. Leaving it needs a verified address AND a
  // proven second factor.
  ACCOUNT_STATE_PENDING = 1;

  // Usable.
  ACCOUNT_STATE_ACTIVE = 2;

  // Switched off by the holder, and reversible by them.
  ACCOUNT_STATE_DEACTIVATED = 3;

  // Switched off administratively, and not reversible by the holder.
  ACCOUNT_STATE_SUSPENDED = 4;
}

// FailureReason classifies a failed authentication attempt in the account
// holder's own history.
//
// It is NOT what a failing caller is told — every refusal is one
// undifferentiated error (ADR-036), because naming which factor was wrong hands
// an attacker a working oracle for the other. Showing the same fact to the
// account holder, after the fact, about their own account, is the opposite
// situation: it is the difference between "somebody guessed at my password" and
// "somebody already has my password and is stuck on my authenticator", and only
// the second is worth waking up for.
enum FailureReason {
  FAILURE_REASON_UNSPECIFIED = 0;

  // No account claims the identifier that was presented.
  FAILURE_REASON_NO_SUCH_IDENTIFIER = 1;

  FAILURE_REASON_WRONG_PASSWORD = 2;

  FAILURE_REASON_WRONG_SECOND_FACTOR = 3;

  // A genuine code was presented a second time. Worth alerting on: a wrong code
  // is a typo, a replayed one means somebody OBSERVED a real code.
  FAILURE_REASON_REPLAYED_CODE = 4;

  // Correct credentials on an account whose address was never proven.
  FAILURE_REASON_UNVERIFIED_EMAIL = 5;

  // Correct credentials on an account that never finished enrolling a factor.
  FAILURE_REASON_INCOMPLETE_ENROLLMENT = 6;

  FAILURE_REASON_DEACTIVATED = 7;

  FAILURE_REASON_SUSPENDED = 8;

  // Refused by the attempt ceiling before any credential was examined.
  FAILURE_REASON_RATE_LIMITED = 9;
}

// RegisterRequest claims an address and creates the account that claims it.
//
// It creates NO CREDENTIAL. The account it produces is Pending, passwordless
// and cannot be signed into by anybody, including whoever sent this request —
// the password is supplied to `VerifyEmail`, by whoever holds the link that was
// mailed to the address. Field 2 is reserved to keep it that way: it carried a
// password, and a password here is the premise of the pre-hijacking attack
// rather than a step in it.
message RegisterRequest {
  // Field 2 held `password`. It is reserved rather than reused because the
  // reason it is gone is a security property, and a future field at this number
  // would be indistinguishable on the wire from the one that was removed.
  reserved 2;
  reserved "password";

  // The address as typed. It is normalized server-side, and the normalized form
  // is the only one that reaches the vault or the blind indexer. It appears in
  // no event, no log line and no error message.
  //
  // The rules mirror `domain.NormalizeEmail` rather than approximating it, which
  // is why they are CEL rather than the built-in `email` rule: that rule is
  // ASCII-only, and this system accepts internationalized domains and converts
  // them to punycode. A rule stricter than the handler would refuse an address
  // the handler would have accepted, which is worse than no rule.
  //
  // Every bound is measured on the TRIMMED value, because the handler trims
  // first. Bounds are BYTES, not characters — RFC 5321 counts octets, and so
  // does the normalizer.
  //
  // `max_length` and `pattern` are declared on the GNOSTIC annotation rather than
  // as protovalidate rules, and which of the two carries them is the whole point.
  // A protovalidate rule is enforced by the interceptor against the RAW value,
  // while every rule below is measured against the TRIMMED one — so `max_len: 254`
  // as a rule would refuse a 250-byte address sent with six bytes of leading
  // whitespace, an address the handler accepts. That is the "a rule stricter than
  // the handler" failure named four paragraphs up, and it is the one this file
  // must not commit while closing an audit finding. As annotations they publish
  // the bound to clients and to the auditor and add no refusal the server does not
  // make. The pattern is deliberately the LOOSEST reading of the shape rule: a
  // published pattern that refuses more than the handler does turns a valid
  // address into a client-side rejection nothing on this side can see.
  string email = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ada@example.com"}
      max_length: 254
      pattern: "^.+@.+\\..+$"
    },
    (buf.validate.field) = {
      required: true
      cel: [
        {
          id: "identity.email.length"
          message: "an email address may not exceed 254 bytes"
          expression: "bytes(this.trim()).size() <= 254"
        },
        {
          id: "identity.email.shape"
          message: "an email address must contain a local part and a fully qualified domain"
          expression:
            "this.trim().lastIndexOf('@') > 0"
            " && this.trim().lastIndexOf('@') < this.trim().size() - 1"
            " && this.trim().substring(this.trim().lastIndexOf('@') + 1).contains('.')"
        },
        {
          id: "identity.email.local_part"
          message: "the local part of an email address may not exceed 64 bytes"
          expression:
            "this.trim().lastIndexOf('@') <= 0"
            " || bytes(this.trim().substring(0, this.trim().lastIndexOf('@'))).size() <= 64"
        }
      ]
    }
  ];
}

// RegisterResponse is deliberately empty, and its emptiness is the feature.
//
// The handler reports whether the address was free; this message does not, and
// must not gain a field that does. Registration is one of the four flows
// identity.md §11 names as leaking account existence when written naively, and
// the fix is not a vague message — it is that the two outcomes are
// indistinguishable in content.
//
// The client renders one sentence for both: "if that address can be registered,
// we have sent it a link".
message RegisterResponse {}

// VerifyEmailRequest presents the token from a verification link, and the
// password the account will be signed into with.
//
// The two travel together because that pairing IS the security property. The
// token proves control of the mailbox; the password is the credential that
// control authorises. Splitting them — a credential set earlier, activated by a
// later proof — is the shape the pre-hijacking attack needs, because the party
// that sets the credential and the party that proves the mailbox are then
// allowed to be different people.
message VerifyEmailRequest {
  // The plaintext from the link. It is hashed and spent server-side and is never
  // stored, logged or placed in an event: a token in a log line is a live
  // credential in a system whose logs outlive it by months.
  //
  // `required` matches the handler, which refuses an empty token. The ceiling is
  // a DENIAL-OF-SERVICE bound rather than a format rule, and it is deliberately
  // far above any token this system mints: it must not become a probe for the
  // token's real length. A wrong token and a spent one remain one refusal.
  string token = 1 [
    // The published `pattern` says only that a token carries no whitespace, and
    // its looseness is deliberate: the real alphabet is base64url, and publishing
    // THAT would hand a guesser the shape the ceiling above is careful not to
    // leak. "No spaces" is true of every token this system mints, refuses nothing
    // the handler accepts, and describes the field for a client without
    // describing it for an attacker.
    (gnostic.openapi.v3.property) = {
      example: {yaml: "PLACEHOLDER-not-a-real-verification-token"}
      pattern: "^\\S+$"
    },
    (buf.validate.field) = {
      required: true
      string: {max_len: 512}
    }
  ];

  // The secret as typed. Normalized under RFC 8265's OpaqueString profile before
  // it is screened against the breach corpus and hashed.
  //
  // Stated in full, and only here. This is the ENROLMENT side, where the
  // password policy is PUBLIC — it is printed beside the field the user is
  // typing into — so enforcing it declaratively costs nothing and tells an
  // attacker nothing they could not read off the form. The same two numbers are
  // deliberately NOT repeated on AuthenticateRequest or CreateSessionRequest;
  // see the package comment.
  //
  // Declaring it here is not an oracle, and the reason is the order the handler
  // runs in: this rule is evaluated by the interceptor BEFORE the handler, and
  // the handler screens the password before it spends the token. Both refusals
  // are therefore functions of the caller's own input alone — they say nothing
  // about whether the token was real, and they leave it unspent, so a person who
  // chose a breached password still has their link.
  //
  // `min_len` counts CHARACTERS and `max_bytes` counts BYTES, matching
  // `domain.MinPasswordRunes` (8) and `domain.MaxPasswordBytes` (4096). The
  // minimum is checked here against the raw input and by the handler against the
  // NFC-normalized one, which can only be shorter — so this rule is never
  // stricter than the handler it fronts.
  string password = 2 [
    // `max_bytes` is a byte count and OpenAPI's `maxLength` is a character count,
    // so the rule below cannot publish itself: the generator correctly declines to
    // restate 4096 bytes as 4096 characters. The annotation states the character
    // ceiling separately, and 4096 characters is the loosest true reading of a
    // 4096-byte limit — every input the rule accepts satisfies it.
    //
    // The pattern excludes the C0 controls and DEL, which `domain.NormalizePassword`
    // refuses outright (RFC 8264 §7.5, and tabs and newlines by name). It is a
    // subset of what the handler refuses rather than a superset, which is the only
    // safe direction for a published pattern.
    (gnostic.openapi.v3.property) = {
      example: {yaml: "PLACEHOLDER-not-a-real-password"}
      max_length: 4096
      pattern: "^[^\\u0000-\\u001F\\u007F]+$"
    },
    (buf.validate.field).string = {
      min_len: 8
      max_bytes: 4096
    }
  ];

  // The public handle the account will be known by. MANDATORY (ADR-051).
  //
  // It arrives here, beside the password, and NOT on RegisterRequest. Two
  // reasons, and the second decides it.
  //
  // A handle claimed at registration is claimed by whoever typed an address they
  // may not control. The address squat that leaves is bounded — an unverified
  // claim lapses after 48 hours — but a handle squat is not: a handle is claimed
  // permanently and, once tombstoned by an erasure, can never be reissued even in
  // principle. So the cheapest attack would be a script sweeping every desirable
  // handle with addresses it never proves. Claiming here prices each squatted
  // handle at one mailbox the attacker must actually control.
  //
  // The decisive reason is that a handle on RegisterRequest would DESTROY
  // registration's indistinguishability. RegisterResponse is empty precisely so
  // "the address was free" and "the address was taken" are one answer. Pair the
  // address with a fresh random handle and they stop being one answer: register,
  // then ask CheckUsernameAvailability about the handle. Taken means the
  // registration went through, which means the address was free. One extra
  // unauthenticated call, and the account-existence oracle identity.md §11 closes
  // is open again — through a field rather than through a message.
  //
  // The rules below mirror `domain.NormalizeUsername` rather than approximating
  // it. The character set is ASCII [A-Za-z0-9_] — the handler folds case, so the
  // rule must accept both — and it excludes the HYPHEN for a technical reason
  // rather than a stylistic one: the handle names a KurrentDB stream key, and a
  // dash in a key is refused because KurrentDB derives a category from everything
  // before the first one.
  //
  // Reserved names (`admin`, `support`, `api`, …) are NOT expressible here and
  // are refused by the handler. A CEL rule listing them would be a second copy of
  // a list that must have one, and the two would disagree the first time either
  // changed.
  //
  // Stating the rules in full is safe for RegisterRequest.email's reason: this is
  // the ENROLMENT side, the policy is public and printed beside the field, and
  // the handler screens the handle BEFORE it spends the token — so a refusal here
  // says nothing about the token and leaves the link live.
  string username = 3 [
    (gnostic.openapi.v3.property) = {example: {yaml: "ada_lovelace"}},
    (buf.validate.field) = {
      required: true
      string: {
        min_len: 3
        max_len: 30
        pattern: "^[A-Za-z][A-Za-z0-9]*(_[A-Za-z0-9]+)*$"
      }
    }
  ];
}

// VerifyEmailResponse reports what the verification established.
//
// Unlike registration, this call is not an existence oracle: presenting a valid
// single-use token IS proof of control over the address, so the caller is
// entitled to learn whose account it belongs to. An invalid, spent or expired
// token is one undifferentiated refusal.
message VerifyEmailResponse {
  // The account's pseudonym. Every other call names the account by this.
  string subject_id = 1 [
    (gnostic.openapi.v3.property) = {example: {yaml: "subj_01ARZ3NDEKTSV4RRFFQ69G5FAV"}},
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^subj_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The account's public identifier, a prefixed ULID (ADR-030).
  string user_id = 2 [
    (gnostic.openapi.v3.property) = {example: {yaml: "usr_01ARZ3NDEKTSV4RRFFQ69G5FAV"}},
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^usr_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // False when the token was valid but everything it asserts was already
  // recorded — a link clicked twice, or prefetched by a mail client. Nothing was
  // appended, and it is not an error.
  bool changed = 3;
}

// ResendEmailVerificationRequest asks for a fresh verification link.
//
// It names an ADDRESS rather than an account, and it has to: the population that
// needs this call is exactly the population that cannot sign in. A Pending
// account holds no session (identity.md §1), so there is no principal to read
// from the context and no identifier available to the caller other than the
// address they typed into the registration form.
message ResendEmailVerificationRequest {
  // The address as typed. Reduced to a blind index server-side; neither the raw
  // nor the normalized form reaches an event, a log line or an error message.
  //
  // The rules are RegisterRequest.email's, character for character, and the
  // duplication is deliberate rather than lazy. This call fronts the same
  // normalizer, so a rule that differed in either direction would be visible on
  // the wire: stricter and it refuses an address that was successfully
  // registered, looser and "that is not an address" becomes a cheaper answer
  // than "that address has no pending account", which is the first half of an
  // enumeration oracle.
  string email = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ada@example.com"}
      max_length: 254
      pattern: "^.+@.+\\..+$"
    },
    (buf.validate.field) = {
      required: true
      cel: [
        {
          id: "identity.email.length"
          message: "an email address may not exceed 254 bytes"
          expression: "bytes(this.trim()).size() <= 254"
        },
        {
          id: "identity.email.shape"
          message: "an email address must contain a local part and a fully qualified domain"
          expression:
            "this.trim().lastIndexOf('@') > 0"
            " && this.trim().lastIndexOf('@') < this.trim().size() - 1"
            " && this.trim().substring(this.trim().lastIndexOf('@') + 1).contains('.')"
        },
        {
          id: "identity.email.local_part"
          message: "the local part of an email address may not exceed 64 bytes"
          expression:
            "this.trim().lastIndexOf('@') <= 0"
            " || bytes(this.trim().substring(0, this.trim().lastIndexOf('@'))).size() <= 64"
        }
      ]
    }
  ];
}

// ResendEmailVerificationResponse is deliberately empty, for RegisterResponse's
// reason and one more.
//
// RegisterResponse hides whether an address was free. This message hides four
// outcomes rather than two: no account claims the address, an account claims it
// and is still Pending, an account claims it and is already verified, and an
// account claims it and is deactivated or suspended. Exactly one of those four
// appends an event and sends mail; all four answer with these zero bytes.
//
// A field here — `sent`, `already_verified`, anything — would turn an
// unauthenticated endpoint into a precise account-existence and account-state
// oracle for any address a prober can type. The client renders one sentence for
// all four: "if that address has an account waiting to be verified, we have sent
// it a new link".
message ResendEmailVerificationResponse {}

// RequestPasswordResetRequest asks for a password-reset link.
//
// It names an ADDRESS rather than an account, and it has to: the population that
// needs this call is exactly the population that cannot sign in, so there is no
// principal to read from the context and no identifier available to the caller
// other than the address they typed into the login form.
//
// The address is used to FIND an account and never to address the mail. The link
// goes to the address the vault holds for the account that was found — never to
// the one this request supplied (identity.md §4.5) — which is what stops this
// message from being a way to have somebody else's reset link delivered to you.
message RequestPasswordResetRequest {
  // The address as typed. Reduced to a blind index server-side; neither the raw
  // nor the normalized form reaches an event, a log line or an error message.
  //
  // The rules are RegisterRequest.email's and
  // ResendEmailVerificationRequest.email's, character for character, and the
  // duplication is deliberate rather than lazy. All three front the same
  // normalizer, so a rule that differed in either direction would be visible on
  // the wire: stricter and it refuses an address that was successfully
  // registered, looser and "that is not an address" becomes a cheaper answer
  // than "that address has no account", which is the first half of an
  // enumeration oracle.
  string email = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ada@example.com"}
      max_length: 254
      pattern: "^.+@.+\\..+$"
    },
    (buf.validate.field) = {
      required: true
      cel: [
        {
          id: "identity.email.length"
          message: "an email address may not exceed 254 bytes"
          expression: "bytes(this.trim()).size() <= 254"
        },
        {
          id: "identity.email.shape"
          message: "an email address must contain a local part and a fully qualified domain"
          expression:
            "this.trim().lastIndexOf('@') > 0"
            " && this.trim().lastIndexOf('@') < this.trim().size() - 1"
            " && this.trim().substring(this.trim().lastIndexOf('@') + 1).contains('.')"
        },
        {
          id: "identity.email.local_part"
          message: "the local part of an email address may not exceed 64 bytes"
          expression:
            "this.trim().lastIndexOf('@') <= 0"
            " || bytes(this.trim().substring(0, this.trim().lastIndexOf('@'))).size() <= 64"
        }
      ]
    }
  ];
}

// ---------------------------------------------------------------------------
// Email change (identity.md §12)
// ---------------------------------------------------------------------------

// RequestEmailChangeRequest names the address the account is moving to.
message RequestEmailChangeRequest {
  // The new address as typed. Reduced to a blind index server-side; neither the
  // raw nor the normalized form reaches an event, a log line or an error message
  // (ADR-002).
  //
  // The rules are RegisterRequest.email's and RequestPasswordResetRequest.email's
  // character for character, and the duplication is deliberate for the reason
  // stated there: all of them front the same normalizer, so a rule that differed
  // in either direction would be visible on the wire.
  string new_email = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ada@example.com"}
      max_length: 254
      pattern: "^.+@.+\\..+$"
    },
    (buf.validate.field) = {
      required: true
      cel: [
        {
          id: "identity.email.length"
          message: "an email address may not exceed 254 bytes"
          expression: "bytes(this.trim()).size() <= 254"
        },
        {
          id: "identity.email.shape"
          message: "an email address must contain a local part and a fully qualified domain"
          expression:
            "this.trim().lastIndexOf('@') > 0"
            " && this.trim().lastIndexOf('@') < this.trim().size() - 1"
            " && this.trim().substring(this.trim().lastIndexOf('@') + 1).contains('.')"
        },
        {
          id: "identity.email.local_part"
          message: "the local part of an email address may not exceed 64 bytes"
          expression:
            "this.trim().lastIndexOf('@') <= 0"
            " || bytes(this.trim().substring(0, this.trim().lastIndexOf('@'))).size() <= 64"
        }
      ]
    }
  ];
}

// RequestEmailChangeResponse is deliberately empty, and its emptiness is the
// feature.
//
// Three outcomes reach it and all three produce these zero bytes: the address
// was free and is now claimed, the address is already claimed by somebody else,
// and the address is the one this account already holds. Reporting which would
// turn an authenticated caller into an address-enumeration oracle — they could
// walk a list and learn which addresses have accounts, one refusal at a time,
// which is the ability identity.md §7 removes from every other surface.
//
// The client renders one sentence: "check the new address for a link".
message RequestEmailChangeResponse {}

// CancelEmailChangeRequest calls off a pending change. It names nothing: the
// account is the caller's own, and the pending change is whichever one it holds.
message CancelEmailChangeRequest {}

// CancelEmailChangeResponse is empty. Cancelling when nothing is pending is
// success, so there is no outcome to report.
message CancelEmailChangeResponse {}

// ConfirmEmailChangeRequest presents the token from the link mailed to the new
// address.
message ConfirmEmailChangeRequest {
  // The plaintext from the link. It is hashed and spent server-side and is never
  // stored, logged or placed in an event.
  //
  // The ceiling is a DENIAL-OF-SERVICE bound rather than a format rule, and it
  // is deliberately far above any token this system mints so it cannot become a
  // probe for the token's real length. A wrong token, a spent one and an expired
  // one remain one refusal.
  string token = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "PLACEHOLDER-not-a-real-change-token"}
      pattern: "^\\S+$"
    },
    (buf.validate.field) = {
      required: true
      string: {max_len: 512}
    }
  ];
}

// ConfirmEmailChangeResponse is empty.
//
// It reports neither the new address nor the old one. The caller is holding a
// link from a mailbox and has not authenticated, so echoing an address would
// tell whoever intercepted that mail which account it belongs to.
message ConfirmEmailChangeResponse {}

// RevertEmailChangeRequest presents the token from the link mailed to the
// address the account moved away from.
message RevertEmailChangeRequest {
  // The plaintext from the link, under ConfirmEmailChangeRequest.token's rules.
  string token = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "PLACEHOLDER-not-a-real-revert-token"}
      pattern: "^\\S+$"
    },
    (buf.validate.field) = {
      required: true
      string: {max_len: 512}
    }
  ];
}

// RevertEmailChangeResponse is empty, under ConfirmEmailChangeResponse's rule.
message RevertEmailChangeResponse {}

// RequestPasswordResetResponse is deliberately empty, and its emptiness is the
// feature.
//
// Five outcomes reach this message and all five produce these zero bytes: no
// account claims the address, an account claims it and can be reset, an account
// claims it and has no password to reset, an account claims it and is
// deactivated, and an account claims it and is suspended. Exactly one of them
// appends an event and sends mail.
//
// A field here — `sent`, `already_reset`, a next-allowed timestamp — would turn
// an unauthenticated endpoint into a precise account-existence and account-state
// oracle for any address a prober can type. The client renders one sentence for
// all five: "if that address has an account with a password, we have sent it a
// reset link".
message RequestPasswordResetResponse {}

// ResetPasswordRequest presents the token from a reset link and the password the
// account will be signed into with next.
//
// The two travel together for VerifyEmailRequest's reason: the token proves
// control of the mailbox and the password is the credential that control
// authorises, in one request, so the party choosing the credential and the party
// proving the mailbox cannot be different people.
message ResetPasswordRequest {
  // The plaintext from the link. It is hashed and spent server-side and is never
  // stored, logged or placed in an event.
  //
  // `required` matches the handler, which refuses an empty token. The ceiling is
  // a DENIAL-OF-SERVICE bound rather than a format rule, and it is deliberately
  // far above any token this system mints so it cannot become a probe for the
  // token's real length. A wrong token, a spent one and an expired one remain
  // one refusal.
  string token = 1 [
    // Loose by design, as on VerifyEmailRequest.token.
    (gnostic.openapi.v3.property) = {
      example: {yaml: "PLACEHOLDER-not-a-real-reset-token"}
      pattern: "^\\S+$"
    },
    (buf.validate.field) = {
      required: true
      string: {max_len: 512}
    }
  ];

  // The new secret as typed. Normalized under RFC 8265's OpaqueString profile
  // before it is screened against the breach corpus and hashed.
  //
  // The same two numbers VerifyEmailRequest declares, and stated here for the
  // same reason: this is an ENROLMENT surface, where the password policy is
  // PUBLIC because it is printed beside the field the user is typing into. They
  // are deliberately NOT repeated on AuthenticateRequest or
  // CreateSessionRequest.
  //
  // Declaring them here is not an oracle. The rule is evaluated by the
  // interceptor BEFORE the handler, and the handler screens the password before
  // it spends the token — so both refusals are functions of the caller's own
  // input alone, say nothing about whether the token was real, and leave it
  // unspent. A person who chose a breached password still has their link.
  //
  // `min_len` counts CHARACTERS and `max_bytes` counts BYTES, matching
  // `domain.MinPasswordRunes` (8) and `domain.MaxPasswordBytes` (4096).
  string password = 2 [
    // `max_bytes` is a byte count and OpenAPI's `maxLength` is a character count,
    // so the rule below cannot publish itself: the generator correctly declines to
    // restate 4096 bytes as 4096 characters. The annotation states the character
    // ceiling separately, and 4096 characters is the loosest true reading of a
    // 4096-byte limit — every input the rule accepts satisfies it.
    //
    // The pattern excludes the C0 controls and DEL, which `domain.NormalizePassword`
    // refuses outright (RFC 8264 §7.5, and tabs and newlines by name). It is a
    // subset of what the handler refuses rather than a superset, which is the only
    // safe direction for a published pattern.
    (gnostic.openapi.v3.property) = {
      example: {yaml: "PLACEHOLDER-not-a-real-password"}
      max_length: 4096
      pattern: "^[^\\u0000-\\u001F\\u007F]+$"
    },
    (buf.validate.field).string = {
      min_len: 8
      max_bytes: 4096
    }
  ];
}

// ResetPasswordResponse is empty, and unlike VerifyEmailResponse that is a
// SECURITY choice rather than an enumeration one.
//
// VerifyEmail returns the account's identifiers because presenting a valid
// single-use token IS proof of control, and the party holding it is about to
// become the account holder. A reset is different in one decisive respect: it
// must not advance the caller towards a session (ASVS 5.0 V6.4.3). The caller's
// next act is an ordinary CreateSession that presents the account's second
// factor, unchanged by the reset, and there is nothing this message could carry
// that would help with that.
//
// So it carries nothing: no subject id, no user id, no bearer token, no
// assurance level. A reset that returned a session would convert "the attacker
// can read the mailbox" into full account takeover in one step, and the surest
// way not to write that is to have no field to put it in.
message ResetPasswordResponse {}

// AuthenticateRequest is one login attempt, presenting whichever factors the
// caller has (ADR-050).
message AuthenticateRequest {
  // The address as typed. Reduced to a blind index server-side; neither the raw
  // nor the normalized form reaches an event, a log line or an error message.
  //
  // Bounded, and NOT format-checked — unlike RegisterRequest.email, which
  // carries the full address grammar. The ceiling is the same 254 bytes the
  // normalizer enforces, so it refuses only input no account could ever have
  // been registered with; that is a denial-of-service bound and discloses
  // nothing. A SHAPE rule would disclose something: it would split ADR-036's one
  // undifferentiated refusal into "that is not an address" and "that is an
  // address, and the answer is still no", and the second is the answer an
  // enumerating attacker is trying to buy.
  string identifier = 1 [
    // Published bounds, not rules — the CEL above measures the trimmed value and
    // the interceptor would measure the raw one. `pattern` says only "one line,
    // no line breaks": it is NOT the address grammar, because publishing that here
    // would describe the shape the paragraph above refuses to distinguish on.
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ada@example.com"}
      max_length: 254
      pattern: "^[^\\r\\n]+$"
    },
    (buf.validate.field).cel = {
      id: "identity.identifier.length"
      message: "an identifier may not exceed 254 bytes"
      expression: "bytes(this.trim()).size() <= 254"
    }
  ];

  // The secret as typed.
  //
  // NO RULES, and their absence is the decision. Not `required`, not a minimum,
  // not a maximum: every one of them answers a guess with "your guess was
  // structurally wrong", which is strictly more than a wrong password tells the
  // caller and is exactly the oracle ADR-036 exists to close. The floor and the
  // ceiling are stated on RegisterRequest.password, where they are public.
  //
  // Length is still bounded — by `domain.MaxPasswordBytes` inside the handler
  // and by Connect's message size cap in front of it — so declaring nothing here
  // costs no denial-of-service protection.
  //
  // The published `maxLength` is an ANNOTATION, so it adds no interceptor rule and
  // no refusal: it restates `domain.MaxPasswordBytes`, which the handler already
  // enforces, for the benefit of a client and of a document that must not contain
  // an unbounded string. The paragraph above rules out a protovalidate maximum,
  // not a documented one — what makes a ceiling an oracle is the interceptor
  // answering "structurally wrong" before the handler runs, and nothing here does
  // that.
  string password = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "PLACEHOLDER-not-a-real-password"}
    max_length: 4096
    pattern: "^[^\\u0000-\\u001F\\u007F]*$"
  }];

  // The second factor, and OPTIONAL. Sent empty on a first leg, which is
  // answered with the kinds the account can complete with rather than with a
  // session.
  //
  // There is no challenge token, and that is a decision rather than an omission
  // (ADR-050): every place to put one — a token row, an in-process map, a signed
  // stateless artifact — makes a partial authentication into a bearer credential
  // an attacker can steal and replay. The cost of not having one is a second
  // Argon2id evaluation on the completing call, paid by legitimate users only.
  //
  // Should that cost ever become the binding constraint, the challenge arrives
  // as an OPTIONAL field on this message and an optional one on the response,
  // which `buf breaking` permits. Nothing here has to be designed for it now.
  //
  // NO RULES, for the reason given on `password` and one more that is specific
  // to this field: it carries EITHER a TOTP code or a recovery code, and those
  // have different shapes. A rule admitting one shape and refusing the other
  // would report which second factors the account holds — the inventory
  // AuthenticateResponse.offered is deliberately trimmed to kinds in order not
  // to publish.
  // The bounds are ANNOTATIONS — published, not enforced — so the paragraph above
  // still holds: no interceptor rule distinguishes a TOTP code from a recovery
  // code, and nothing refuses either shape before the handler runs. The pattern is
  // "one line" and nothing more, deliberately: `normalizeRecoveryCode` accepts
  // lowercase, spaces, hyphens and stray punctuation and reduces them, so any
  // tighter pattern would describe a rejection this system does not perform.
  string code = 3 [(gnostic.openapi.v3.property) = {
    example: {yaml: "000000"}
    max_length: 64
    pattern: "^[^\\r\\n]*$"
  }];

  // An opaque pseudonym for the client. It is NOT a device name, a platform
  // string, a user agent or an address — all of those are personal data and
  // belong in the vault under this handle, because this value enters events.
  //
  // Optional, and bounded only. This is not a credential — nothing is proven by
  // presenting it — so a bound on it is not an oracle. The bound is here because
  // the value ENTERS EVENTS, and an event is append-only: an unbounded field
  // that reaches the log is unbounded there forever.
  string device_id = 4 [
    (gnostic.openapi.v3.property) = {example: {yaml: "dev_9f2c1b7e"}},
    (buf.validate.field).string = {
      max_len: 128
      // Printable ASCII, which is what an opaque handle minted by a client can be
      // held to without constraining what it MEANS. The value enters events, and
      // an event is append-only: a control character or a newline that reaches the
      // log is there forever, and every consumer of that log has to survive it.
      pattern: "^[\\x20-\\x7E]*$"
    }
  ];
}

// AuthenticateResponse reports what an attempt established, and never why one
// failed.
//
// A refusal does not arrive here at all: it is an error, and it is the same
// error for every cause (ADR-036). What this distinguishes is only the two
// SUCCESSFUL shapes — the first factor passed and a second is owed, or every
// factor passed.
message AuthenticateResponse {
  // True when the password was correct and the authentication is not finished.
  bool second_factor_required = 1;

  // The second-factor KINDS this account can complete with, so a client can show
  // the right prompt.
  //
  // Kinds only. Credential ids are deliberately absent: a list of them would let
  // anyone holding a correct password enumerate the account's authenticators,
  // which is the inventory an attacker choosing an attack wants. Empty when no
  // second factor is owed.
  // The ceiling is the number of kinds `MethodKind` declares, so it cannot be
  // reached by anything but a new enum value — which is the point. An unbounded
  // array in a published response is a promise that a client's rendering loop has
  // no upper bound on work, and this one has a very small one.
  repeated MethodKind offered = 2 [(buf.validate.field).repeated.max_items = 8];
}

// CreateSessionRequest completes a login and asks for a bearer token.
//
// It re-presents the credentials rather than redeeming something Authenticate
// handed back, because the evidence of a completed authentication is
// deliberately not serializable (ADR-050): it exists only inside the process
// that performed the ceremony, so there is no artifact for this message to
// carry. A caller that does not yet know whether a second factor is owed asks
// Authenticate first; one that arrives here without a required code gets the
// same undifferentiated refusal as any other failure.
message CreateSessionRequest {
  // The address as typed, as in AuthenticateRequest — bounded, not
  // format-checked, for the same reason.
  string identifier = 1 [
    // Published bounds, not rules — the CEL above measures the trimmed value and
    // the interceptor would measure the raw one. `pattern` says only "one line,
    // no line breaks": it is NOT the address grammar, because publishing that here
    // would describe the shape the paragraph above refuses to distinguish on.
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ada@example.com"}
      max_length: 254
      pattern: "^[^\\r\\n]+$"
    },
    (buf.validate.field).cel = {
      id: "identity.identifier.length"
      message: "an identifier may not exceed 254 bytes"
      expression: "bytes(this.trim()).size() <= 254"
    }
  ];

  // The secret as typed. NO RULES, as on AuthenticateRequest.password — the
  // bounds below are annotations, published and not enforced, for that field's
  // reason.
  string password = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "PLACEHOLDER-not-a-real-password"}
    max_length: 4096
    pattern: "^[^\\u0000-\\u001F\\u007F]*$"
  }];

  // The second factor. Required in practice for every account on this system,
  // because a session is never minted below AAL2.
  //
  // NOT declared `required`, despite that sentence. The message's own contract
  // is that a caller arriving here without a code "gets the same undifferentiated
  // refusal as any other failure", and a `required` rule would replace that
  // refusal with a distinct VALIDATION_FAILED — turning the absence of a second
  // factor into a separately observable outcome. Shape rules are absent for the
  // reason given on AuthenticateRequest.code.
  //
  // The bounds are ANNOTATIONS — published, not enforced — so the paragraph above
  // still holds: no interceptor rule distinguishes a TOTP code from a recovery
  // code, and nothing refuses either shape before the handler runs. The pattern is
  // "one line" and nothing more, deliberately: `normalizeRecoveryCode` accepts
  // lowercase, spaces, hyphens and stray punctuation and reduces them, so any
  // tighter pattern would describe a rejection this system does not perform.
  string code = 3 [(gnostic.openapi.v3.property) = {
    example: {yaml: "000000"}
    max_length: 64
    pattern: "^[^\\r\\n]*$"
  }];

  // An opaque pseudonym for the client, as in AuthenticateRequest.
  string device_id = 4 [
    (gnostic.openapi.v3.property) = {example: {yaml: "dev_9f2c1b7e"}},
    (buf.validate.field).string = {
      max_len: 128
      // Printable ASCII, which is what an opaque handle minted by a client can be
      // held to without constraining what it MEANS. The value enters events, and
      // an event is append-only: a control character or a newline that reaches the
      // log is there forever, and every consumer of that log has to survive it.
      pattern: "^[\\x20-\\x7E]*$"
    }
  ];
}

// CreateSessionResponse carries the bearer token back to the caller ONCE.
message CreateSessionResponse {
  // The session's public identifier, a prefixed ULID (ADR-030). It is not a
  // secret: it appears in the device list of every screen that renders one.
  string session_id = 1 [
    (gnostic.openapi.v3.property) = {example: {yaml: "sess_01ARZ3NDEKTSV4RRFFQ69G5FAV"}},
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^sess_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The authenticated account's pseudonym.
  string subject_id = 2 [
    (gnostic.openapi.v3.property) = {example: {yaml: "subj_01ARZ3NDEKTSV4RRFFQ69G5FAV"}},
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^subj_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The plaintext bearer token. Only its digest is stored, so this is the only
  // moment it exists anywhere this system can reach: it is returned here and by
  // no other call, ever. Clients must keep it out of URLs, logs and analytics.
  //
  // The exact shape IS published here, unlike the emailed tokens on
  // VerifyEmailRequest and ResetPasswordRequest, and the asymmetry is which
  // direction the value travels. Those fields are REQUESTS: describing the
  // alphabet there tells a guesser which guesses are worth making. This one is a
  // RESPONSE, so the only party who learns the shape is the party the server just
  // handed the token to — who is holding it. 32 bytes of crypto/rand rendered as
  // unpadded base64url is exactly 43 characters.
  string token = 3 [(buf.validate.field).string = {
    len: 43
    pattern: "^[A-Za-z0-9_-]{43}$"
  }];

  // The assurance level this session was established at. Always at least AAL2 —
  // a lower one is refused rather than downgraded, because a session recording
  // AAL1 would honestly satisfy every `min_aal` that asks for AAL1, which is
  // precisely the half-authenticated session identity.md §3 names as a complete
  // authentication bypass.
  chronos.options.v1.AssuranceLevel assurance_level = 4;

  // The deadline that MOVES: every authenticated request pushes it forward,
  // clamped to the absolute one. UTC (ADR-008).
  google.protobuf.Timestamp idle_expires_at = 5;

  // The deadline that does NOT move. It is what bounds a stolen token held by an
  // attacker who keeps it warm, which an idle deadline alone cannot do because a
  // thief can refresh it indefinitely. UTC.
  google.protobuf.Timestamp absolute_expires_at = 6;

  // True when the password that established this session was found in a breach
  // corpus. The session is restricted to profile and credential endpoints: the
  // login is not blocked, because blocking locks a person out of the only place
  // they can fix the problem (identity.md §4).
  bool requires_credential_rotation = 7;
}

// GetUserRequest is empty: the account it describes is the caller's own,
// resolved from the session rather than named in the request.
//
// A subject id field would make this an existence probe for any pseudonym a
// caller can obtain, which is the shape identity.md §11 warns about.
message GetUserRequest {}

// GetUserResponse is the account, its lifecycle position, and whether the
// address on it has been proven.
//
// No address comes back, by construction rather than by omission. The caller
// holds a subject id and resolves it against the vault, which is what keeps
// erasure a key destruction rather than a sweep across every projection that
// ever copied an address (ADR-002).
message GetUserResponse {
  // The account's pseudonym. Whatever renders a human-readable identity resolves
  // this against the vault.
  string subject_id = 1 [
    (gnostic.openapi.v3.property) = {example: {yaml: "subj_01ARZ3NDEKTSV4RRFFQ69G5FAV"}},
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^subj_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The account's public identifier, a prefixed ULID (ADR-030).
  string user_id = 2 [
    (gnostic.openapi.v3.property) = {example: {yaml: "usr_01ARZ3NDEKTSV4RRFFQ69G5FAV"}},
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^usr_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Where the account sits in its lifecycle.
  AccountState state = 3;

  // Whether the address was ever proven. This is a DIFFERENT question from the
  // state: an account can be verified and still Pending, because a second factor
  // is also required before it activates (identity.md §2).
  bool email_verified = 4;

  // When the account was registered, UTC. Always set.
  google.protobuf.Timestamp registered_at = 5;

  // When the account activated, UTC. Unset means it never has — not "unknown".
  google.protobuf.Timestamp activated_at = 6;

  // When the holder switched the account off, UTC. Unset means never.
  google.protobuf.Timestamp deactivated_at = 7;

  // When the account was suspended administratively, UTC. Unset means never.
  google.protobuf.Timestamp suspended_at = 8;

  // When the holder asked for the account to be erased, UTC. Unset means never.
  //
  // This is NOT a lifecycle state and `state` does not move because of it. A
  // request changes nothing the account can do: it keeps its credentials, its
  // sessions and its position in the lifecycle until the compliance domain acts
  // on it. Rendering it as "deleted" would contradict every other endpoint,
  // which will keep serving this account normally.
  google.protobuf.Timestamp deletion_requested_at = 9;

  // When erasure falls due, UTC. Unset means no request is outstanding.
  //
  // The date carried by the request itself, never recomputed from today's grace
  // period — this is the date the holder was told, and a deadline that moved
  // after it was communicated would be worse than none.
  google.protobuf.Timestamp deletion_scheduled_for = 10;

  // The account's public handle, in the clear (ADR-051).
  //
  // It is the ONE field in this whole file that returns user-supplied text about
  // a person, and it is the ONE piece of personal data that leaves the read
  // model. Both are the same deliberate exception: a handle is PUBLISHED by
  // design — @alice in a mention, /u/alice in a URL — so the PII vault cannot
  // protect it (crypto-shredding does nothing to a value that was published) and
  // there is nothing for a pseudonym to stand in for.
  //
  // Empty means the account has not claimed one, which is exactly the window
  // between registering and following the verification link — or means it was
  // erased, in which case it is empty forever and the handle is tombstoned so
  // nobody else can take it.
  //
  // The published bounds are the same three CheckUsernameAvailabilityRequest
  // declares, and they have to be: a handle this response can carry but that
  // request would refuse is a value no client could ever round-trip. The `^$`
  // alternative is the empty case above — a handle not yet claimed, or erased.
  string username = 11 [
    (gnostic.openapi.v3.property) = {example: {yaml: "ada_lovelace"}},
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^$|^[A-Za-z][A-Za-z0-9]*(_[A-Za-z0-9]+)*$"
    }
  ];
}

// CheckUsernameAvailabilityRequest asks whether a public handle can be claimed.
message CheckUsernameAvailabilityRequest {
  // The handle to test, as typed. It is normalized server-side — case folded to
  // lower — and the normalized form comes back in the response so a client can
  // show what would actually be claimed.
  //
  // The rules mirror VerifyEmailRequest.username exactly, and must: a handle
  // this call reports available and that call then refuses as malformed would be
  // worse than no check at all.
  string username = 1 [
    (gnostic.openapi.v3.property) = {example: {yaml: "ada_lovelace"}},
    (buf.validate.field) = {
      required: true
      string: {
        min_len: 3
        max_len: 30
        pattern: "^[A-Za-z][A-Za-z0-9]*(_[A-Za-z0-9]+)*$"
      }
    }
  ];
}

// CheckUsernameAvailabilityResponse answers with one boolean.
//
// # There is deliberately no reason field, and there must not be one
//
// Taken, reserved and tombstoned are ONE answer. Merging the first two is only
// tidiness — the action is the same, pick another handle — but merging the THIRD
// is a privacy control. "This handle was tombstoned" means "the account that
// held it was erased", which is a fact about a PERSON, and the tombstone exists
// precisely to protect that person. A field that distinguished it would undo the
// protection at the point of use.
message CheckUsernameAvailabilityResponse {
  // True only when the handle is free, well-formed and not reserved.
  bool available = 1;

  // The NORMALIZED handle — what would actually be claimed. Case folded to
  // lower. Returned so a client can show the canonical form rather than echo
  // what was typed.
  //
  // Case folded, so the published pattern is the lowercase half of the request's
  // — this field cannot carry a capital, and a client rendering it does not have
  // to allow for one.
  string username = 2 [
    (gnostic.openapi.v3.property) = {example: {yaml: "ada_lovelace"}},
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^$|^[a-z][a-z0-9]*(_[a-z0-9]+)*$"
    }
  ];
}

// ListSessionsRequest asks for a page of the caller's device list.
message ListSessionsRequest {
  // How many entries to return. Zero means the server's default (50), and the
  // server CLAMPS anything above its maximum (200) rather than refusing it — so
  // a client must read the returned page's length rather than assume it got what
  // it asked for.
  //
  // Only the negative half is refused, and that mirrors `page.Clamp` exactly: it
  // treats a negative size as a caller bug and an oversized one as a request to
  // satisfy with less. Declaring `lte: 200` here would REFUSE what the server
  // deliberately clamps, which is the contradiction this file avoids.
  //
  // The published `maximum` is an ANNOTATION for exactly that reason. 200 is a
  // true statement about this field — nothing above it has any effect — and a
  // document that leaves a numeric input unbounded describes an API that will
  // accept 2^31-1 and try. Stating it as an annotation publishes the ceiling
  // without converting the clamp into a refusal.
  int32 page_size = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "50"}
      maximum: 200
    },
    (buf.validate.field).int32.gte = 0
  ];

  // An opaque cursor from a previous response's next_page_token. Empty starts at
  // the beginning.
  //
  // Opaque means opaque: it is bound to the query that produced it, and a token
  // presented against a different query, sort or filter is an ERROR rather than
  // a silent restart. A client that treated an unreadable token as "begin again"
  // would loop forever with nothing in the loop looking like a failure.
  //
  // Optional — empty is the first page. Bounded because it is echoed back into a
  // query, and the server mints it, so no legitimate client produces a long one.
  string page_token = 2 [
    (gnostic.openapi.v3.property) = {example: {yaml: "PLACEHOLDER-opaque-cursor-from-a-previous-response"}},
    (buf.validate.field).string = {
      max_len: 1024
      // `page.Encode` renders every cursor as unpadded base64url, so this refuses
      // only values `page.Decode` was going to refuse anyway — one line earlier
      // and with the field named. Opaque to the CLIENT is not opaque to the
      // server: the alphabet is ours, and publishing it costs nothing because a
      // cursor carries no authority (page/token.go deliberately does not sign it).
      pattern: "^[A-Za-z0-9_-]*$"
    }
  ];
}

// Session is one entry in the device list.
//
// No token and no digest. The digest lives in a table this list joins for the
// idle deadline and last-seen time and never selects the secret from — a device
// list that returned anything derived from the bearer token would put a
// credential on the one screen whose entire purpose is to let a user revoke one.
message Session {
  // The session's public identifier, and what RevokeSession names.
  string session_id = 1 [
    (gnostic.openapi.v3.property) = {example: {yaml: "sess_01ARZ3NDEKTSV4RRFFQ69G5FAV"}},
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^sess_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The opaque client-supplied handle, empty when the client sent none. It is
  // NOT a device name: a name is personal data the user typed, and personal data
  // may not enter a projection.
  //
  // The bounds are the ones AuthenticateRequest.device_id enforces on the way in.
  // They are restated on the way out because a client reading this list is
  // rendering the value, and what it may contain is a property of the render.
  string device_id = 2 [
    (gnostic.openapi.v3.property) = {example: {yaml: "dev_9f2c1b7e"}},
    (buf.validate.field).string = {
      max_len: 128
      pattern: "^[\\x20-\\x7E]*$"
    }
  ];

  // The level this session was established at, so a screen can mark one that has
  // only ever presented a single factor.
  chronos.options.v1.AssuranceLevel assurance_level = 3;

  // When this device is signed out for inactivity, UTC.
  google.protobuf.Timestamp idle_expires_at = 4;

  // When this device is signed out regardless, UTC. Both deadlines are shown
  // because they answer different questions.
  google.protobuf.Timestamp absolute_expires_at = 5;

  // When the session was established, UTC. It is here because the list is
  // ordered by it — a caller cannot page this list without the server having
  // sorted on something stable.
  google.protobuf.Timestamp created_at = 6;

  // The last request this session made, UTC. Unset for a session that has made
  // none since it was issued.
  google.protobuf.Timestamp last_seen_at = 7;
}

// ListSessionsResponse is one page of the device list, newest first.
message ListSessionsResponse {
  // The page, newest first.
  //
  // The ceiling is the page size the server clamps to (200). A client sizing a
  // buffer, a virtual list or a render budget from this document gets the real
  // number rather than "unbounded", and the two are very different to build for.
  repeated Session sessions = 1 [(buf.validate.field).repeated.max_items = 200];

  // The cursor for the next page. EMPTY MEANS DONE — it is the only termination
  // signal, and a client must not infer the end from a short page, because a
  // clamped page size makes short pages ordinary.
  string next_page_token = 2 [
    (gnostic.openapi.v3.property) = {example: {yaml: "PLACEHOLDER-opaque-cursor-for-the-next-page"}},
    (buf.validate.field).string = {
      max_len: 1024
      pattern: "^[A-Za-z0-9_-]*$"
    }
  ];
}

// ListMethodsRequest is empty: it lists the caller's own methods.
message ListMethodsRequest {}

// AuthMethod is one enrolled authentication method.
//
// Nothing that verifies anything is here. There is no verifier, no sealed TOTP
// secret, no recovery-code digest and no pepper version — and no field this
// message could grow that would hold one. The consecutive-failure count is
// absent on its own merits: it is a lockout counter, and publishing it tells
// whoever reaches this screen how many attempts remain before a factor locks.
message AuthMethod {
  // The credential's identifier, a prefixed ULID (ADR-030).
  string credential_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "cred_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 31
      pattern: "^cred_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    },
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^cred_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // What kind of factor this is.
  MethodKind kind = 2;

  // Whether it can be used right now: enabled, and not locked out. This is
  // computed from the account's own events rather than re-derived by the client,
  // so a screen cannot come to show a factor the login refuses or hide one it
  // accepts.
  bool usable = 3;

  // When the method was first provisioned, UTC. This is NOT enabled_at: a TOTP
  // secret is scanned before it is proven, and the gap between the two is
  // exactly the enrolment the user may have abandoned.
  google.protobuf.Timestamp added_at = 4;

  // When possession was first proven, UTC. Unset while the method is
  // provisioned but unproven, which is also when it is not usable.
  google.protobuf.Timestamp enabled_at = 5;

  // When the method last took part in an authentication, UTC. UNSET IS THE
  // INTERESTING VALUE: this screen is really asked "is there something enrolled
  // here that I did not enrol", and the answer is only credible if a method that
  // has never been used says so.
  google.protobuf.Timestamp last_used_at = 6;
}

// ListMethodsResponse is every authentication method on the caller's account.
//
// Unpaginated, and that is a bounded claim rather than an oversight: an account
// holds at most one usable credential per kind, and there are five kinds.
message ListMethodsResponse {
  // The methods, in no guaranteed order.
  //
  // The ceiling is the sentence above stated as a rule: five kinds, at most one
  // usable credential per kind, and room for the enum to grow before anyone has
  // to think about this again. "Unpaginated" is only safe while something bounds
  // it, and until now nothing did.
  repeated AuthMethod methods = 1 [(buf.validate.field).repeated.max_items = 16];
}

// ListLoginHistoryRequest asks for a page of the caller's recent activity.
message ListLoginHistoryRequest {
  // How many entries to return. Zero means the server's default (50), and the
  // server clamps at its maximum (200). Only a negative size is refused, as on
  // ListSessionsRequest.page_size.
  //
  // The published `maximum` is an ANNOTATION for exactly that reason. 200 is a
  // true statement about this field — nothing above it has any effect — and a
  // document that leaves a numeric input unbounded describes an API that will
  // accept 2^31-1 and try. Stating it as an annotation publishes the ceiling
  // without converting the clamp into a refusal.
  int32 page_size = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "50"}
      maximum: 200
    },
    (buf.validate.field).int32.gte = 0
  ];

  // An opaque cursor from a previous response, with the same rules as
  // ListSessionsRequest.page_token. Empty starts at the beginning.
  string page_token = 2 [
    (gnostic.openapi.v3.property) = {example: {yaml: "PLACEHOLDER-opaque-cursor-from-a-previous-response"}},
    (buf.validate.field).string = {
      max_len: 1024
      // `page.Encode` renders every cursor as unpadded base64url, so this refuses
      // only values `page.Decode` was going to refuse anyway — one line earlier
      // and with the field named. Opaque to the CLIENT is not opaque to the
      // server: the alphabet is ours, and publishing it costs nothing because a
      // cursor carries no authority (page/token.go deliberately does not sign it).
      pattern: "^[A-Za-z0-9_-]*$"
    }
  ];
}

// LoginAttempt is one entry in "recent activity".
//
// The row's server-side sequence number is deliberately not exposed. It is
// global across every account, so its gaps would leak how much authentication
// traffic the whole system carries; it exists to make the page boundary correct
// and is folded into the opaque cursor instead.
message LoginAttempt {
  // Whether the attempt succeeded. FAILURES ARE THE POINT of this list: the
  // screen exists to answer "was that me?", and a history of successes shows a
  // compromised account as a quiet, ordinary list.
  bool succeeded = 1;

  // Why a failure failed. Unspecified on success. See FailureReason for why the
  // account holder may be told this when the failing caller may not.
  FailureReason reason = 2;

  // The factors presented. Empty for an attempt refused before any credential
  // was examined.
  repeated MethodKind methods = 3 [(buf.validate.field).repeated.max_items = 8];

  // The level the attempt established. Unspecified for a failure — nothing was
  // established.
  chronos.options.v1.AssuranceLevel assurance_level = 4;

  // The opaque client pseudonym the attempt came from, empty when none was sent.
  // Never a device name (see Session.device_id).
  string device_id = 5 [
    (gnostic.openapi.v3.property) = {example: {yaml: "dev_9f2c1b7e"}},
    (buf.validate.field).string = {
      max_len: 128
      pattern: "^[\\x20-\\x7E]*$"
    }
  ];

  // When the attempt happened, UTC.
  google.protobuf.Timestamp occurred_at = 6;
}

// ListLoginHistoryResponse is one page of recent activity, newest first.
message ListLoginHistoryResponse {
  // The page, newest first. Bounded by the clamped page size, as on
  // ListSessionsResponse.sessions.
  repeated LoginAttempt attempts = 1 [(buf.validate.field).repeated.max_items = 200];

  // The cursor for the next page. Empty means done.
  string next_page_token = 2 [
    (gnostic.openapi.v3.property) = {example: {yaml: "PLACEHOLDER-opaque-cursor-for-the-next-page"}},
    (buf.validate.field).string = {
      max_len: 1024
      pattern: "^[A-Za-z0-9_-]*$"
    }
  ];
}

// EnrollTotpRequest asks for a new authenticator secret. It carries nothing.
//
// # Field 1 held `account_name`, and it is gone
//
// It used to carry the account's email address, and that put personal data in
// the otpauth:// URI — rendered to a QR code, then stored PERMANENTLY by the
// authenticator app, synced to the holder's cloud backup and shown on their lock
// screen. That is the one place ADR-002 can never reach to erase.
//
// The server derives the label from the account's own public handle (ADR-051),
// which is public by design and is what a public label should carry. Deriving it
// server-side also removes a caller-controlled string from a QR code: a session
// holder could otherwise enrol with the label "security@chronos.io" and produce
// an entry indistinguishable from an official one.
//
// # Why it is deleted now, having been deprecated-in-place before
//
// The field was kept because removing it fails `buf breaking`'s FIELD_NO_DELETE,
// and the note it carried was right about the thing it refused: RELAXING the
// ruleset to admit the deletion would be widening a gate to fit a change. That
// is still refused, and nothing in buf.yaml has moved.
//
// What changed is that this repository has now taken a DELIBERATE break, with
// the gate intact — the same one `ExportMyDataResponse` took. No release has
// been cut, so the baseline is the previous commit rather than a published
// contract, and the break costs one gate failure on the commit that makes it.
// Carrying a field whose value is discarded until an unscheduled release
// boundary was the more expensive option: every client generated from this
// schema offered a parameter that did nothing.
//
// RESERVED, not reused. A client built against the old schema decodes nothing
// here rather than reading some future field's value into what it calls
// `accountName`.
message EnrollTotpRequest {
  reserved 1;
  reserved "account_name";
}

// EnrollTotpResponse carries the provisioning material back to the caller ONCE.
//
// Both secrets below are returned by this call and are then unrecoverable:
// nothing stores them in the clear, and the sealed copy is opened only to check
// a code. A caller that loses them starts the enrolment again, which is the
// correct outcome — the alternative is an endpoint that re-displays a shared
// secret to anyone holding a session, turning a stolen session into a permanent
// second factor.
message EnrollTotpResponse {
  // The credential this enrolment provisioned, a prefixed ULID (ADR-030).
  string credential_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "cred_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 31
      pattern: "^cred_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    },
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^cred_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The base32 shared secret, for manual entry when a camera is unavailable.
  // Returned ONLY here. Never log it, never persist it client-side.
  //
  // `totp.SecretBytes` is 20 — RFC 4226 §4 R6 — and 20 bytes of unpadded base32
  // is exactly 32 characters from the alphabet A-Z2-7. Describing a RESPONSE
  // precisely costs nothing: the only reader is the caller the server just handed
  // it to.
  string secret = 2 [(buf.validate.field).string = {
    len: 32
    pattern: "^[A-Z2-7]{32}$"
  }];

