  // RevokeSessionRequest.
  string reason = 2 [
    (gnostic.openapi.v3.property) = {example: {yaml: "user_signed_out"}},
    (buf.validate.field).string = {
      max_len: 64
      pattern: "^$|^[a-z][a-z0-9_]*$"
    }
  ];
}

// RevokeAllSessionsResponse reports what the fan-out did.
//
