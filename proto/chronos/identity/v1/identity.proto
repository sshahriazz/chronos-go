// ConfirmTotpResponse reports what the confirmation produced.
message ConfirmTotpResponse {
  // The credential that was proven.
  string credential_id = 1 [
    (gnostic.openapi.v3.property) = {example: {yaml: "cred_01ARZ3NDEKTSV4RRFFQ69G5FAV"}},
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^cred_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
