  // verifier's business, and pinning it in the schema would refuse a longer code
  // if the verifier is ever configured to issue one.
  string code = 1 [
    // The published `pattern` is an annotation and says only "one line", so the
    // paragraph above still holds — no digit count, no character class, nothing
