      max_len: 1024
      // `page.Encode` renders every cursor as unpadded base64url, so this refuses
      // only values `page.Decode` was going to refuse anyway — one line earlier
      // and with the field named. Opaque to the CLIENT is not opaque to the
      // server: the alphabet is ours, and publishing it costs nothing because a
      // cursor carries no authority (page/token.go deliberately does not sign it).
      pattern: "^[A-Za-z0-9_-]*$"
    }
  ];
}

// Session is one entry in the device list.
//
// No token and no digest. The digest lives in a table this list joins for the
// idle deadline and last-seen time and never selects the secret from — a device
// list that returned anything derived from the bearer token would put a
// credential on the one screen whose entire purpose is to let a user revoke one.
message Session {
  // The session's public identifier, and what RevokeSession names.
  string session_id = 1 [
    (gnostic.openapi.v3.property) = {example: {yaml: "sess_01ARZ3NDEKTSV4RRFFQ69G5FAV"}},
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^sess_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The opaque client-supplied handle, empty when the client sent none. It is
  // NOT a device name: a name is personal data the user typed, and personal data
  // may not enter a projection.
  //
  // The bounds are the ones AuthenticateRequest.device_id enforces on the way in.
  // They are restated on the way out because a client reading this list is
  // rendering the value, and what it may contain is a property of the render.
  string device_id = 2 [
    (gnostic.openapi.v3.property) = {example: {yaml: "dev_9f2c1b7e"}},
    (buf.validate.field).string = {
      max_len: 128
      pattern: "^[\\x20-\\x7E]*$"
    }
  ];

  // The level this session was established at, so a screen can mark one that has
  // only ever presented a single factor.
  chronos.options.v1.AssuranceLevel assurance_level = 3;

  // When this device is signed out for inactivity, UTC.
  google.protobuf.Timestamp idle_expires_at = 4;

  // When this device is signed out regardless, UTC. Both deadlines are shown
  // because they answer different questions.
  google.protobuf.Timestamp absolute_expires_at = 5;

  // When the session was established, UTC. It is here because the list is
  // ordered by it — a caller cannot page this list without the server having
  // sorted on something stable.
  google.protobuf.Timestamp created_at = 6;

  // The last request this session made, UTC. Unset for a session that has made
  // none since it was issued.
  google.protobuf.Timestamp last_seen_at = 7;
}

// ListSessionsResponse is one page of the device list, newest first.
message ListSessionsResponse {
  // The page, newest first.
  //
  // The ceiling is the page size the server clamps to (200). A client sizing a
  // buffer, a virtual list or a render budget from this document gets the real
  // number rather than "unbounded", and the two are very different to build for.
  repeated Session sessions = 1 [(buf.validate.field).repeated.max_items = 200];

  // The cursor for the next page. EMPTY MEANS DONE — it is the only termination
  // signal, and a client must not infer the end from a short page, because a
  // clamped page size makes short pages ordinary.
  string next_page_token = 2 [
    (gnostic.openapi.v3.property) = {example: {yaml: "PLACEHOLDER-opaque-cursor-for-the-next-page"}},
    (buf.validate.field).string = {
      max_len: 1024
      pattern: "^[A-Za-z0-9_-]*$"
    }
  ];
}

// ListMethodsRequest is empty: it lists the caller's own methods.
message ListMethodsRequest {}

// AuthMethod is one enrolled authentication method.
//
// Nothing that verifies anything is here. There is no verifier, no sealed TOTP
// secret, no recovery-code digest and no pepper version — and no field this
// message could grow that would hold one. The consecutive-failure count is
// absent on its own merits: it is a lockout counter, and publishing it tells
// whoever reaches this screen how many attempts remain before a factor locks.
message AuthMethod {
  // The credential's identifier, a prefixed ULID (ADR-030).
  string credential_id = 1 [
    (gnostic.openapi.v3.property) = {example: {yaml: "cred_01ARZ3NDEKTSV4RRFFQ69G5FAV"}},
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^cred_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // What kind of factor this is.
  MethodKind kind = 2;

  // Whether it can be used right now: enabled, and not locked out. This is
  // computed from the account's own events rather than re-derived by the client,
  // so a screen cannot come to show a factor the login refuses or hide one it
  // accepts.
  bool usable = 3;

