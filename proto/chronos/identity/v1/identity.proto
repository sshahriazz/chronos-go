  // account label. Returned ONLY here. Never log it.
  string provisioning_uri = 3 [(buf.validate.field).string = {
    max_len: 512
    pattern: "^otpauth://totp/[^\\s]*$"
  }];

  // When this unproven secret stops being confirmable, UTC.
  //
  // Short by design: the window is the time in which a secret exists that nobody
  // has demonstrated possession of, so a secret captured from a screen — a
  // screenshot, a shoulder-surf, a shared screen — stops being usable quickly. A
  // user who takes longer starts again at no cost.
  google.protobuf.Timestamp expires_at = 4;
}

// ConfirmTotpRequest presents a live code against a provisioned secret.
message ConfirmTotpRequest {
  // The digits from the authenticator app. Never logged, stored, or placed in an
  // event.
  //
  // `required` matches the handler, which refuses an empty or whitespace-only
  // code. It is declared here and NOT on AuthenticateRequest.code, and the
  // difference is who is asking: this call runs on an AAL2 session, against the
  // caller's OWN account, confirming a secret the same caller was handed
  // moments ago. There is no account to enumerate and no factor inventory to
  // disclose, so a refusal for malformed input reveals nothing a login refusal
  // would have hidden.
  //
  // Still no digit-count or character-class rule: the code's length is the
  // verifier's business, and pinning it in the schema would refuse a longer code
  // if the verifier is ever configured to issue one.
  string code = 1 [
    // The published `pattern` is an annotation and says only "one line", so the
    // paragraph above still holds — no digit count, no character class, nothing
    // that would refuse a longer code if the verifier is reconfigured to issue
    // one.
    (gnostic.openapi.v3.property) = {
      example: {yaml: "000000"}
      pattern: "^[^\\r\\n]+$"
    },
    (buf.validate.field) = {
      required: true
      string: {max_len: 32}
    }
  ];
}

// ConfirmTotpResponse reports what the confirmation produced.
message ConfirmTotpResponse {
  // The credential that was proven.
  string credential_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "cred_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 31
      pattern: "^cred_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    },
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^cred_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // True when this confirmation was the event that completed the account: a
  // verified address plus a REAL second factor. Only a TOTP confirmation can set
  // it — generating recovery codes must never be what activates an account.
  bool activated = 2;

  // False when the authenticator was already proven — a retried confirmation.
  // Nothing was appended, and it is not an error.
  bool changed = 3;
}

// GenerateRecoveryCodesRequest asks for a fresh set, replacing any existing one.
message GenerateRecoveryCodesRequest {
  // How many codes to mint. Zero means the server's default (10). The server
  // bounds it at 20: every code is a row plus a hash, so an unbounded count is a
  // request that asks for a million of them inside one transaction.
  //
  // Both ends are refused rather than clamped, and that is `app.MaxRecoveryCodeCount`
  // exactly — unlike a page size, an over-large count is not a request the server
  // can satisfy with less, because the caller would then be shown a set smaller
  // than the one they asked to write down.
  int32 count = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 20
  }];
}

// GenerateRecoveryCodesResponse carries the plaintext codes back ONCE.
//
// Only digests are stored, so this is the only moment the codes exist anywhere
// this system can reach. A caller that loses them generates a new set, which
// invalidates the old one — that is the correct outcome, and an endpoint that
// could re-display them would turn a stolen session into a permanent bypass of
// every factor on the account.
message GenerateRecoveryCodesResponse {
  // The credential holding this set, a prefixed ULID (ADR-030).
  string credential_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "cred_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 31
      pattern: "^cred_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    },
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^cred_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The plaintext codes, in the order they should be presented. Returned ONLY
  // here. Never log them; show them once and tell the user to store them.
  //
  // The ceiling is `app.MaxRecoveryCodeCount`, which the request's `lte` already
  // refuses above — so the two ends of this call now state the same number, and a
  // client sizing a printable list gets it from the document. Each code is 10
  // bytes of entropy as unpadded base32, presented in groups of four: 16
  // characters from A-Z2-7 and three hyphens.
  repeated string codes = 2 [(buf.validate.field).repeated = {
    max_items: 20
    items: {
      string: {
        len: 19
        pattern: "^[A-Z2-7]{4}(-[A-Z2-7]{4}){3}$"
      }
    }
  }];
}

// RevokeSessionRequest ends one of the caller's sessions.
message RevokeSessionRequest {
  // The session to end. It must belong to the caller: a request naming somebody
  // else's session gets the same answer as one naming a session that does not
  // exist, because telling the two apart would turn the device list into a probe
  // for which session ids exist.
  //
  // A prefixed ULID, `sess_` followed by 26 Crockford base32 characters
  // (ADR-030). Rejecting the wrong TYPE of identifier at the boundary is
  // CONVENTIONS §4, and it is not the probe the paragraph above forbids: it
  // separates "that is not a session id at all" from "no such session of yours",
  // and the first is a fact the caller already had. Which session ids EXIST
  // stays indistinguishable.
  string session_id = 1 [
    (gnostic.openapi.v3.property) = {example: {yaml: "sess_01ARZ3NDEKTSV4RRFFQ69G5FAV"}},
    (buf.validate.field) = {
      required: true
      string: {
        max_len: 31
        pattern: "^sess_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
      }
