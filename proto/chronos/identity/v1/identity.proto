  bool activated = 2;

  // False when the authenticator was already proven — a retried confirmation.
  // Nothing was appended, and it is not an error.
  bool changed = 3;
}

// GenerateRecoveryCodesRequest asks for a fresh set, replacing any existing one.
message GenerateRecoveryCodesRequest {
  // How many codes to mint. Zero means the server's default (10). The server
  // bounds it at 20: every code is a row plus a hash, so an unbounded count is a
  // request that asks for a million of them inside one transaction.
  //
