  // to render the account screen would make step-up routine, which is how people
  // learn to approve it without reading it.
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    // No side effects, so Connect may serve it over GET and it is cacheable.
    option idempotency_level = NO_SIDE_EFFECTS;
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_READ;

    // Authenticated: no `security` here, so the document-level `bearerAuth`
    // default applies. Only a PUBLIC method states a security requirement, and
    // it states the empty one.
    option (gnostic.openapi.v3.operation) = {
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description:
                  "The caller's own account. No address comes back, by construction: the\n"
                  "caller holds a `subjectId` and resolves it against the vault, which is\n"
                  "what keeps erasure a key destruction rather than a sweep across every\n"
                  "projection that ever copied an address.\n"
                  "\n"
                  "`state` and `emailVerified` answer DIFFERENT questions. An account can\n"
                  "be verified and still `PENDING`, because a proven second factor is also\n"
                  "required before it activates. An unset timestamp means never — not\n"
                  "unknown.\n"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {reference: {_ref: "#/components/schemas/chronos.identity.v1.GetUserResponse"}}
                        example: {
                          yaml:
                            "subjectId: subj_01ARZ3NDEKTSV4RRFFQ69G5FAV\n"
                            "userId: usr_01ARZ3NDEKTSV4RRFFQ69G5FAV\n"
                            "state: ACCOUNT_STATE_ACTIVE\n"
                            "emailVerified: true\n"
                            "registeredAt: '2026-07-02T08:15:00Z'\n"
                            "activatedAt: '2026-07-02T08:19:41Z'\n"
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }

  // ListSessions returns the caller's device list, newest first, one page at a
  // time.
  //
  // AAL1. It is a read of a list the holder needs in order to NOTICE a
  // compromise, and putting step-up in front of noticing is backwards — the
  // revocation that follows is what carries the AAL2 requirement.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_READ;

    option (gnostic.openapi.v3.operation) = {
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description:
                  "One page of the device list, newest first. No token and no digest\n"
                  "appears here: a device list that returned anything derived from the\n"
                  "bearer token would put a credential on the one screen whose purpose is\n"
                  "to let a user revoke one.\n"
                  "\n"
                  "`nextPageToken` empty means done. Do not infer the end from a short\n"
                  "page — the server clamps an oversized `pageSize`, so short pages are\n"
                  "ordinary. `lastSeenAt` is unset for a session that has made no request\n"
                  "since it was issued.\n"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {reference: {_ref: "#/components/schemas/chronos.identity.v1.ListSessionsResponse"}}
                        example: {
                          yaml:
                            "sessions:\n"
                            "  - sessionId: sess_01ARZ3NDEKTSV4RRFFQ69G5FAV\n"
                            "    deviceId: dev_9f2c1b7e\n"
                            "    assuranceLevel: ASSURANCE_LEVEL_2\n"
                            "    idleExpiresAt: '2026-08-14T12:04:55Z'\n"
                            "    absoluteExpiresAt: '2026-08-21T11:04:55Z'\n"
                            "    createdAt: '2026-08-14T11:04:55Z'\n"
                            "    lastSeenAt: '2026-08-14T11:39:12Z'\n"
                            "  - sessionId: sess_01ARZ3NDEKTSV4RRFFQ69G5FB2\n"
                            "    deviceId: ''\n"
                            "    assuranceLevel: ASSURANCE_LEVEL_2\n"
                            "    idleExpiresAt: '2026-08-14T10:22:00Z'\n"
                            "    absoluteExpiresAt: '2026-08-20T09:22:00Z'\n"
                            "    createdAt: '2026-08-13T09:22:00Z'\n"
                            "nextPageToken: ''\n"
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }

  // ListMethods returns the authentication methods on the caller's account:
  // which exist, what kind each is, whether it can be used now, and when it last
  // was.
  //
  // AAL1, on the same argument as ListSessions: this is the screen on which
  // somebody discovers an authenticator they did not enrol.
  rpc ListMethods(ListMethodsRequest) returns (ListMethodsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_READ;

    option (gnostic.openapi.v3.operation) = {
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description:
                  "Every authentication method on the caller's account. Unpaginated, and\n"
                  "that is a bounded claim rather than an oversight: an account holds at\n"
                  "most one usable credential per kind, and there are five kinds.\n"
                  "\n"
                  "Nothing that verifies anything is here — no verifier, no sealed TOTP\n"
                  "secret, no recovery-code digest. The consecutive-failure count is\n"
                  "absent on its own merits: publishing it would tell whoever reaches this\n"
                  "screen how many attempts remain before a factor locks.\n"
                  "\n"
                  "`usable` is computed server-side from the account's own events, so a\n"
                  "screen cannot come to show a factor the login refuses. An unset\n"
                  "`lastUsedAt` is the INTERESTING value: this screen is really asked \"is\n"
                  "there something enrolled here that I did not enrol\", and the answer is\n"
                  "only credible if a method that has never been used says so.\n"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {reference: {_ref: "#/components/schemas/chronos.identity.v1.ListMethodsResponse"}}
                        example: {
                          yaml:
                            "methods:\n"
                            "  - credentialId: cred_01ARZ3NDEKTSV4RRFFQ69G5FAV\n"
                            "    kind: METHOD_KIND_PASSWORD\n"
                            "    usable: true\n"
                            "    addedAt: '2026-07-02T08:15:00Z'\n"
                            "    enabledAt: '2026-07-02T08:15:00Z'\n"
                            "    lastUsedAt: '2026-08-14T11:04:55Z'\n"
                            "  - credentialId: cred_01ARZ3NDEKTSV4RRFFQ69G5FB2\n"
                            "    kind: METHOD_KIND_TOTP\n"
                            "    usable: true\n"
                            "    addedAt: '2026-07-02T08:18:20Z'\n"
                            "    enabledAt: '2026-07-02T08:19:41Z'\n"
                            "    lastUsedAt: '2026-08-14T11:04:55Z'\n"
                            "  - credentialId: cred_01ARZ3NDEKTSV4RRFFQ69G5FC7\n"
                            "    kind: METHOD_KIND_RECOVERY_CODE\n"
                            "    usable: true\n"
                            "    addedAt: '2026-07-02T08:20:05Z'\n"
                            "    enabledAt: '2026-07-02T08:20:05Z'\n"
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }

  // ListLoginHistory returns recent authentication attempts against the caller's
  // account, successes and failures alike, newest first.
  //
  // AAL1, and deliberately so even though this is the most sensitive read here.
  // It is the account holder's own security log, and it is only useful if they
  // actually look at it.
  rpc ListLoginHistory(ListLoginHistoryRequest) returns (ListLoginHistoryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_READ;

    option (gnostic.openapi.v3.operation) = {
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description:
                  "Recent authentication attempts against the caller's account, successes\n"
                  "and failures alike, newest first.\n"
                  "\n"
                  "FAILURES ARE THE POINT of this list: it exists to answer \"was that\n"
                  "me?\", and a history of successes shows a compromised account as a\n"
                  "quiet, ordinary list. `reason` is what the account HOLDER may be told\n"
                  "about their own account after the fact — it is never what a failing\n"
                  "caller is told, because naming which factor was wrong hands an attacker\n"
                  "a working oracle for the other.\n"
                  "\n"
                  "`FAILURE_REASON_REPLAYED_CODE` is worth alerting on: a wrong code is a\n"
                  "typo, a replayed one means somebody OBSERVED a real code.\n"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {reference: {_ref: "#/components/schemas/chronos.identity.v1.ListLoginHistoryResponse"}}
                        example: {
                          yaml:
                            "attempts:\n"
                            "  - succeeded: true\n"
                            "    reason: FAILURE_REASON_UNSPECIFIED\n"
                            "    methods:\n"
                            "      - METHOD_KIND_PASSWORD\n"
                            "      - METHOD_KIND_TOTP\n"
                            "    assuranceLevel: ASSURANCE_LEVEL_2\n"
                            "    deviceId: dev_9f2c1b7e\n"
                            "    occurredAt: '2026-08-14T11:04:55Z'\n"
                            "  - succeeded: false\n"
                            "    reason: FAILURE_REASON_WRONG_SECOND_FACTOR\n"
                            "    methods:\n"
                            "      - METHOD_KIND_PASSWORD\n"
                            "      - METHOD_KIND_TOTP\n"
                            "    assuranceLevel: ASSURANCE_LEVEL_UNSPECIFIED\n"
                            "    deviceId: ''\n"
                            "    occurredAt: '2026-08-14T03:41:02Z'\n"
                            "  - succeeded: false\n"
                            "    reason: FAILURE_REASON_RATE_LIMITED\n"
                            "    methods: []\n"
                            "    assuranceLevel: ASSURANCE_LEVEL_UNSPECIFIED\n"
                            "    deviceId: ''\n"
                            "    occurredAt: '2026-08-14T03:40:58Z'\n"
                            "nextPageToken: PLACEHOLDER-opaque-cursor-pass-this-back-verbatim\n"
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }

  // EnrollTotp provisions a new authenticator secret and returns it once.
  //
  // AAL2. Enrolling a second factor is how an attacker holding one factor makes
  // their access durable, so it must not be reachable from a session that only
  // ever presented one. It replaces any unproven enrolment on the account, so
  // the abandoned secret stops existing at the moment the new one is written
  // rather than lingering as a second confirmable factor.
  //
  // AAL1 while the account has never held a proven second factor, and only
  // then. Read the two levels together and they say: presenting the existing
  // factor is what buys the right to add another, and an account with no
  // existing factor is exempt from a demand nothing could satisfy. Without the
  // exemption an account registered through this API could never activate — the
  // factor it must have to reach AAL2 is the factor this call exists to give it
  // (identity.md §2).
  //
  // The exemption is not a weaker version of the same permission. It applies to
  // a strictly poorer target: an account with no second factor, whose password
  // is therefore already the only thing standing between an attacker and it. An
  // attacker who enrols there has gained nothing they did not already have. On
  // an account that HAS a factor the floor is AAL2, so the same attacker must
  // present that factor — and it does not re-open when a factor is removed,
  // because the window closes on first proof and never re-opens.
  rpc EnrollTotp(EnrollTotpRequest) returns (EnrollTotpResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;
    option (chronos.options.v1.bootstrap_min_aal) = ASSURANCE_LEVEL_1;

    // An authenticated MUTATION, so it carries an Idempotency-Key. The header
    // is described once, in proto/openapi.base.yaml's components, and every
    // operation that requires it references that one description.
    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description:
                  "The provisioning material, delivered ONCE. Both `secret` and\n"
                  "`provisioningUri` are returned here and are then unrecoverable —\n"
                  "nothing stores them in the clear, and the sealed copy is opened only to\n"
                  "check a code. `provisioningUri` CONTAINS the secret. Never log either;\n"
                  "render the URI as a QR code and the secret for manual entry.\n"
                  "\n"
                  "`expiresAt` is short by design: it bounds the window in which a secret\n"
                  "exists that nobody has demonstrated possession of, so a secret captured\n"
                  "from a screen stops being usable quickly. A user who takes longer\n"
                  "starts again at no cost.\n"
                  "\n"
                  "This call replaces any unproven enrolment on the account, so an\n"
                  "abandoned secret stops existing rather than lingering as a second\n"
                  "confirmable factor.\n"
                  "\n"
                  "The secret below is a placeholder and is not valid anywhere.\n"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {reference: {_ref: "#/components/schemas/chronos.identity.v1.EnrollTotpResponse"}}
                        example: {
                          yaml:
                            "credentialId: cred_01ARZ3NDEKTSV4RRFFQ69G5FB2\n"
                            "secret: PLACEHOLDERSECRETNOTREAL234567AB\n"
                            "provisioningUri: otpauth://totp/Chronos:ada@example.com?secret=PLACEHOLDERSECRETNOTREAL234567AB&issuer=Chronos&algorithm=SHA1&digits=6&period=30\n"
                            "expiresAt: '2026-08-14T11:19:55Z'\n"
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }

  // ConfirmTotp proves possession of a provisioned secret, and may be what
  // activates the account.
  //
  // AAL2, matching EnrollTotp: a confirmation is the half of an enrolment that
  // makes a factor real, and letting it run at a lower level than the enrolment
  // itself would leave the pair only as strong as its weaker call.
  //
  // The bootstrap floor matches EnrollTotp for the same reason. The two calls
  // are one operation split in half, and exempting only the first would leave
  // an account able to provision a secret it could never prove — the deadlock
  // moved one call to the right rather than removed.
  //
  // This is the call that CLOSES the window: the account it activates has a
  // proven second factor from that moment, so the next call to either method
  // faces AAL2. The exemption is therefore self-limiting, and it is limited by
  // the very thing it was granted to produce.
  rpc ConfirmTotp(ConfirmTotpRequest) returns (ConfirmTotpResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;
    option (chronos.options.v1.bootstrap_min_aal) = ASSURANCE_LEVEL_1;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description:
                  "Possession of the provisioned secret has been proven.\n"
                  "\n"
                  "`activated: true` means this confirmation was the event that completed\n"
                  "the account — a verified address plus a REAL second factor. Only a TOTP\n"
                  "confirmation can set it; generating recovery codes never activates an\n"
                  "account. `changed: false` means the authenticator was already proven,\n"
                  "so nothing was appended and it is not an error.\n"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {reference: {_ref: "#/components/schemas/chronos.identity.v1.ConfirmTotpResponse"}}
                        example: {
                          yaml:
                            "credentialId: cred_01ARZ3NDEKTSV4RRFFQ69G5FB2\n"
                            "activated: true\n"
                            "changed: true\n"
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }

  // GenerateRecoveryCodes replaces the whole recovery-code set and returns the
  // new plaintext codes once.
  //
  // AAL2. A recovery code is a standing bypass of every other factor, so minting
  // a fresh set from a single-factor session would hand an attacker a permanent
  // credential that survives the password change the victim makes in response.
  // Generating codes never activates an account — only a real second factor
  // does.
  //
  // NO bootstrap exemption, deliberately, and this is the method where the
  // decision is load-bearing. The exemption exists to break a deadlock, and
  // there is no deadlock here: recovery codes cannot activate an account, so
  // nothing about the path from registered to Active runs through this call. An
  // account reaches its first AAL2 session by confirming a TOTP secret, and only
  // then asks for codes — by which time the strict floor is satisfiable. Granting
  // the exemption anyway would mean a single-factor session could mint the one
  // credential that outlives every remedy the account holder has, on an account
  // that has no second factor to lose. That is the exact hole the floor is
  // shaped to keep shut, and it would be opened for no gain.
  rpc GenerateRecoveryCodes(GenerateRecoveryCodesRequest) returns (GenerateRecoveryCodesResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description:
                  "The plaintext codes, delivered ONCE, in the order they should be\n"
                  "presented. Only digests are stored, so this is the only moment they\n"
                  "exist anywhere this system can reach.\n"
                  "\n"
                  "This REPLACES the whole existing set — any previous codes stop working.\n"
                  "Show them once, tell the user to store them offline, and never log\n"
                  "them. A caller who loses them generates a new set, which is the correct\n"
                  "outcome: an endpoint that could re-display them would turn a stolen\n"
                  "session into a permanent bypass of every factor on the account.\n"
                  "\n"
                  "The codes below are placeholders and are not valid anywhere.\n"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {reference: {_ref: "#/components/schemas/chronos.identity.v1.GenerateRecoveryCodesResponse"}}
                        example: {
                          yaml:
                            "credentialId: cred_01ARZ3NDEKTSV4RRFFQ69G5FC7\n"
                            "codes:\n"
                            "  - PLACEHOLDER-code-01\n"
                            "  - PLACEHOLDER-code-02\n"
                            "  - PLACEHOLDER-code-03\n"
                            "  - PLACEHOLDER-code-04\n"
                            "  - PLACEHOLDER-code-05\n"
                            "  - PLACEHOLDER-code-06\n"
                            "  - PLACEHOLDER-code-07\n"
                            "  - PLACEHOLDER-code-08\n"
                            "  - PLACEHOLDER-code-09\n"
                            "  - PLACEHOLDER-code-10\n"
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }

  // RevokeSession ends one of the caller's sessions.
  //
  // AAL2. Revocation is the control a person reaches for when they believe they
  // are compromised, and it must not be usable BY the compromise: a
  // single-factor session that could end sessions could sign the legitimate
  // holder out of the device they are using to investigate.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description:
                  "The session is no longer usable.\n"
                  "\n"
                  "`changed: false` means it was already revoked or already expired.\n"
                  "Nothing was appended, and it is NOT an error: the caller wanted the\n"
                  "session unusable, and it is.\n"
                  "\n"
                  "A request naming a session that is not the caller's own gets the same\n"
                  "answer as one naming a session that does not exist — telling the two\n"
                  "apart would turn the device list into a probe for which session ids\n"
                  "exist.\n"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {reference: {_ref: "#/components/schemas/chronos.identity.v1.RevokeSessionResponse"}}
                        example: {yaml: "changed: true\n"}
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }

  // RevokeAllSessions ends every live session on the caller's account, in one
  // atomic append.
  //
  // AAL2, on the same argument as RevokeSession and more so: this is the
  // account-wide version, so the denial of service an attacker could inflict
  // with it is total.
  rpc RevokeAllSessions(RevokeAllSessionsRequest) returns (RevokeAllSessionsResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description:
                  "Every live session on the account has ended, in one atomic append —\n"
                  "\"sign out everywhere\" that half happened is worse than one that failed,\n"
                  "because the user is told every device is signed out, one is not, and\n"
                  "nothing in the system disagrees with them.\n"
                  "\n"
                  "`revoked` counts what this call ended; sessions already revoked or\n"
                  "expired are not counted, because nothing was appended for them.\n"
                  "`scanned` is how many live sessions the work list returned, the spared\n"
                  "one included — reported so a client can tell \"nothing to do\" apart from\n"
                  "\"the list came back empty because it is broken\".\n"
                  "\n"
                  "Send an empty `exceptSessionId` to spare nothing, which is what a\n"
                  "compromise response needs: the party asking may be the attacker.\n"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {reference: {_ref: "#/components/schemas/chronos.identity.v1.RevokeAllSessionsResponse"}}
                        example: {
                          yaml:
                            "revoked: 3\n"
                            "scanned: 4\n"
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }

  // DeactivateAccount switches the caller's own account off, and ends every
  // session on it in the same atomic append.
  //
  // # Reversible, and how
  //
  // Deactivation is the holder's own switch and the holder undoes it by SIGNING
  // IN again with every factor the account has — the successful authentication
  // records the reactivation in the same append as itself, so the account is on
  // again before the new session exists. There is deliberately no
  // `ReactivateAccount` RPC: it would need a session, a session needs an
  // authentication, and an authentication refuses a deactivated account, so its
  // only precondition would be one its own subject can never satisfy. See
  // `identity.md` §1.
  //
  // Suspension is the administrative counterpart and is NOT here. It is not
  // reversible by the holder, every method on this service is reached by the
  // holder acting on their own account, and there is no operator surface in this
  // repository yet — so an RPC for it could only be a self-suspension, which
  // makes the account unreachable by every route this module has.
  //
  // # AAL2
  //
  // On RevokeAllSessions' argument: the sign-out is total, so the denial of
  // service an attacker holding a stolen password could inflict with it is total.
  // No `bootstrap_min_aal`, deliberately — an account still enrolling its first
  // factor has nothing to switch off, and the exemption exists for enrolment
  // alone.
  rpc DeactivateAccount(DeactivateAccountRequest) returns (DeactivateAccountResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description:
                  "The account is off and every session on it has ended, in one atomic\n"
                  "append. The token used to make this call is among the revoked ones: a\n"
                  "deactivation spares nothing, because an account switched off everywhere\n"
                  "except on the device that switched it off is not what was asked for.\n"
                  "\n"
                  "`changed` is false when the account was already deactivated. The sessions\n"
                  "are still swept in that case, and that is not tidying: a login whose\n"
                  "ceremony began before the first deactivation committed can have minted a\n"
                  "session the first sweep never saw.\n"
                  "\n"
                  "To come back, sign in again with every factor the account has. The\n"
                  "successful authentication reactivates it, and a security mail says so.\n"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {reference: {_ref: "#/components/schemas/chronos.identity.v1.DeactivateAccountResponse"}}
                        example: {
                          yaml:
                            "changed: true\n"
                            "sessionsRevoked: 2\n"
                            "sessionsScanned: 2\n"
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }

  // RequestAccountDeletion asks for the caller's own account to be erased, and
  // starts the grace period.
  //
  // # The account keeps working until the deadline
  //
  // A request is not a deletion. `compliance` runs the grace period as a durable
  // workflow and erases at the end of it; until then everything works normally,
  // and `CancelAccountDeletion` withdraws the request.
  //
  // This is stated on the RPC rather than only in a design document because a
  // client that reads "deletion requested" as "account gone" will build a screen
  // that lies to the person using it — and the screen that matters most here is
  // the one offering the way back.
  //
  // # AAL2, plus a typed confirmation
  //
  // identity.md §2 lists account deletion among the operations that require
  // step-up. The step-up proves WHO is asking; the `confirmation` field is what
  // makes it hard to ask by ACCIDENT — a distinct property, and the one
  // cancellation cannot cover, because cancelling requires somebody to notice
  // and the person who never meant to ask is the least likely to.
  //
  // # It does not sign anybody out
  //
  // Every other destructive call here voids sessions. This one deliberately does
  // not: the grace period exists so the person can change their mind, and signing
  // them out of an account that still works teaches them the request took effect
  // immediately, which it did not.
  rpc RequestAccountDeletion(RequestAccountDeletionRequest) returns (RequestAccountDeletionResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description:
                  "The request is recorded and `scheduledFor` is when erasure falls due.\n"
                  "\n"
                  "Nothing consumes it yet: the compliance domain that would perform the\n"
                  "erasure does not exist, and neither does the workflow that would run the\n"
                  "grace period or a command to cancel. The account keeps working, and every\n"
                  "other endpoint keeps serving it.\n"
                  "\n"
                  "`changed` is false when a request was already outstanding, and\n"
                  "`scheduledFor` is then the ORIGINAL deadline — a second request must not\n"
                  "move a date the holder has already been given.\n"
                  "\n"
                  "No session is revoked by this call, deliberately: the grace period exists\n"
                  "so the person can change their mind.\n"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {reference: {_ref: "#/components/schemas/chronos.identity.v1.RequestAccountDeletionResponse"}}
                        example: {
                          yaml:
                            "changed: true\n"
                            "scheduledFor: '2026-09-19T08:15:00Z'\n"
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }

  // CancelAccountDeletion withdraws the caller's own outstanding erasure request.
  //
  // # This is what makes the grace period real
  //
  // A waiting period nobody can use is a delay, not a safeguard. The window
  // exists so that somebody who clicked in anger, or whose session was taken,
  // can stop what was started — and the erasure workflow re-reads on every wake
  // precisely so that this call stops it.
  //
  // Cancelling when nothing is outstanding SUCCEEDS and records nothing. The
  // cancel link in the "deletion scheduled" mail gets clicked twice, or after an
  // operator already withdrew the request; neither person did anything wrong and
  // neither should be told they did.
  //
  // # AAL2, and no typed confirmation
  //
  // Step-up for the same reason requesting needs it: this decides whether an
  // account survives, and an attacker holding a low-assurance session must not be
  // able to keep alive an account its owner is trying to close.
  //
  // No confirmation field, and the asymmetry is deliberate. A typed confirmation
  // guards something that cannot be undone; this IS the undo, and putting a
  // hurdle in front of somebody who has just realised their mistake protects
  // nothing.
  //
  // # Why it notifies
  //
  // The catalogue mails a Security-class message on cancellation, which reads as
  // reassurance and is not only that. Somebody who deliberately asked for erasure
  // and whose request was withdrawn by SOMEBODY ELSE needs to know: that is
  // exactly what an attacker with a stolen session does when the holder tries to
  // close the account under them.
  //
  // Returns `NOT_FOUND` for an account already erased — there is nothing to come
  // back to, and saying so specifically would confirm that a particular person
  // once held it.
  rpc CancelAccountDeletion(CancelAccountDeletionRequest) returns (CancelAccountDeletionResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // RequestEmailChange starts a move to a different email address.
  //
  // Nothing about the account moves here, and that is the design rather than a
  // limitation: identity.md §12 requires the NEW address to be proven first,
  // because otherwise an attacker holding a session takes ownership by naming an
  // address they cannot read. This claims the address and mails a link to it.
  //
  // Two messages go out. The link goes to the new address. A SECURITY warning
  // goes to the address the account uses today — with no link and not even the
  // new address in it, since that mailbox is exactly the one an attacker may
  // already be reading. That warning is what makes the flow survivable, and it
  // is why this RPC is worth having rather than an administrator's edit.
  //
  // AAL2, because identity.md §4.3 lists an email change among the operations
  // that require step-up. There is no `bootstrap_min_aal`: an account with no
  // second factor has no business moving its recovery address, and the bootstrap
  // exemption exists to let somebody ENROL a factor, not to widen what a
  // single-factor session may do.
  rpc RequestEmailChange(RequestEmailChangeRequest) returns (RequestEmailChangeResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description:
                  "Accepted. The body is empty, and its emptiness is deliberate: this\n"
                  "response is identical whether the address was free or is already\n"
                  "claimed by somebody else. Reporting the difference would turn an\n"
                  "authenticated caller into an address-enumeration oracle.\n"
                  "Render one sentence — \"check the new address for a link\".\n"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {reference: {_ref: "#/components/schemas/chronos.identity.v1.RequestEmailChangeResponse"}}
                        example: {yaml: "{}"}
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }

  // CancelEmailChange calls off a pending change.
  //
  // The action the security warning tells somebody to take. It releases the
  // claim on the address and VOIDS the link already sitting in that mailbox, so
  // a change the account holder refused cannot complete afterwards.
  //
  // Idempotent: cancelling when nothing is pending is success, because the
  // caller asked for a state that already holds.
  rpc CancelEmailChange(CancelEmailChangeRequest) returns (CancelEmailChangeResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // ConfirmEmailChange redeems the link mailed to the new address.
  //
  // Public: it is reached from a mailbox by a browser that has never
  // authenticated — and after this call, could not be, because completing the
  // change voids every session on the account (identity.md §4.4). The token IS
  // the authentication and it is single-use.
  //
  // It grants nothing beyond the address move. No session is created and no
  // bearer is returned; the caller's next act is an ordinary CreateSession with
  // the new address.
  //
  // The old address is NOT released. It is held for a revert window and a link
  // to undo the change is mailed to it, which is the remedy for the case where
  // the party who proved the new address was not the account's owner.
  rpc ConfirmEmailChange(ConfirmEmailChangeRequest) returns (ConfirmEmailChangeResponse) {
    option (chronos.options.v1.public) = true;
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    option (gnostic.openapi.v3.operation) = {
      security: [{}]
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description:
                  "The account now uses the new address, and every session on it —\n"
                  "including any held by whoever requested the change — has been\n"
                  "signed out. Send the caller to sign in with the new address.\n"
                  "The body is empty: an unknown token, a spent one and an expired\n"
                  "one all answer VALIDATION_FAILED with one message, because\n"
                  "distinguishing them tells whoever holds a stale link that the\n"
                  "address it was sent to is real.\n"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {reference: {_ref: "#/components/schemas/chronos.identity.v1.ConfirmEmailChangeResponse"}}
                        example: {yaml: "{}"}
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }

  // RevertEmailChange undoes a completed change.
  //
  // Public, and reached from a link mailed to the address the account moved AWAY
  // from — so whoever redeems it has proven control of the address the account
  // had BEFORE the change. That is the whole remedy identity.md §12 asks for: an
  // attacker holding a session can move the address, and cannot stop the real
  // owner being told and undoing it.
  //
  // It voids every session again, for a sharper reason than the change did: the
  // party this is being undone against may still be holding the session they did
  // it from.
  //
  // The window is finite. After it the old address is available to anybody, so
  // this refuses rather than taking it back from whoever claimed it since.
  rpc RevertEmailChange(RevertEmailChangeRequest) returns (RevertEmailChangeResponse) {
    option (chronos.options.v1.public) = true;
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    option (gnostic.openapi.v3.operation) = {
      security: [{}]
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description:
                  "The account uses its previous address again and every session on it\n"
                  "has been signed out. Tell the caller to sign in and change their\n"
                  "password: somebody was able to move the address, so the credential\n"
                  "that let them should be assumed compromised.\n"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {reference: {_ref: "#/components/schemas/chronos.identity.v1.RevertEmailChangeResponse"}}
                        example: {yaml: "{}"}
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }

  // BeginPasskeyRegistration starts enrolling an authenticator.
  //
  // Returns the JSON for `navigator.credentials.create` and an opaque ceremony
  // id. Nothing is enrolled until FinishPasskeyRegistration verifies what the
  // authenticator signed.
  //
  // AAL2: adding a credential that can sign in on its own is a credential
  // change, and identity.md §4.3 requires step-up for those.
  rpc BeginPasskeyRegistration(BeginPasskeyRegistrationRequest) returns (BeginPasskeyRegistrationResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;
    // A first enrolment is the one case that legitimately runs below AAL2: an
    // account with no second factor presenting the only factor it has, in order
    // to enrol the one it is required to have. Without this a passkey could
    // never be somebody's FIRST second factor, and the strongest method
    // available would be reachable only by people who already have another.
    option (chronos.options.v1.bootstrap_min_aal) = ASSURANCE_LEVEL_1;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // FinishPasskeyRegistration verifies the authenticator's answer and enrols it.
  //
  // The ceremony is SINGLE-USE: replaying one is refused, because one signature
  // must not become two credentials.
  //
  // On an account's FIRST passkey this returns recovery codes, once.
  // identity.md §5 calls lockout "the real design problem" — somebody whose only
  // method is a passkey on a lost device must still get back in — so the codes
  // are issued here rather than offered afterwards, because an afterthought is a
  // path most people never take.
  rpc FinishPasskeyRegistration(FinishPasskeyRegistrationRequest) returns (FinishPasskeyRegistrationResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;
    option (chronos.options.v1.bootstrap_min_aal) = ASSURANCE_LEVEL_1;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // BeginPasskeyLogin starts a usernameless sign-in.
  //
  // PUBLIC, and it carries NO identifier. That absence is the feature: the
  // authenticator names the account, so this endpoint cannot be asked whether an
  // address exists. A field for one would reintroduce the enumeration oracle
  // every other public surface in this module removes.
  //
  // It looks up nothing and answers identically whether or not any account
  // exists.
  rpc BeginPasskeyLogin(BeginPasskeyLoginRequest) returns (BeginPasskeyLoginResponse) {
    option (chronos.options.v1.public) = true;
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    option (gnostic.openapi.v3.operation) = {
      security: [{}]
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // FinishPasskeyLogin verifies an assertion and creates a session.
  //
  // Public: the assertion IS the authentication. A user-verified passkey reaches
  // AAL2 on its own (identity.md §2) — the authenticator is the possession
  // factor and the PIN or biometric that unlocked it is the second — so this can
  // mint a full session in one gesture. Without user verification it reaches
  // AAL1 and anything sensitive will ask for step-up.
  //
  // A signature counter that went BACKWARDS does NOT refuse the sign-in. Most
  // synced passkeys report a counter of zero forever, and identity.md §5 is
  // explicit that treating a regression as fatal "locks out legitimate users".
  // The session is capped at AAL1 instead and the response says so.
  rpc FinishPasskeyLogin(FinishPasskeyLoginRequest) returns (FinishPasskeyLoginResponse) {
    option (chronos.options.v1.public) = true;
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    option (gnostic.openapi.v3.operation) = {
      security: [{}]
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // ListPasskeys shows the caller their own enrolled authenticators.
  //
  // The security screen. It returns the label the person chose, when each was
  // added and last used, and whether one has ever produced a counter regression
  // — which is what lets somebody notice a credential they do not recognise.
  rpc ListPasskeys(ListPasskeysRequest) returns (ListPasskeysResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_READ;
  }

  // RemovePasskey deletes one of the caller's authenticators.
  //
  // Refused when it would leave the account with no way to sign in, which is the
  // same rule that stops the last second factor being removed. Somebody deleting
  // their only passkey from a device they no longer have is not helped by an
  // endpoint that lets them.
  //
  // AAL2 with no bootstrap exemption: removing a credential is not a way to
  // enrol one.
  rpc RemovePasskey(RemovePasskeyRequest) returns (RemovePasskeyResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // ListFederatedProviders names the identity providers this deployment
  // supports.
  //
  // PUBLIC and deliberately uninteresting: it says what the DEPLOYMENT
  // supports, never what any account uses. A client needs it to render buttons,
  // and it discloses nothing about anybody.
  rpc ListFederatedProviders(ListFederatedProvidersRequest) returns (ListFederatedProvidersResponse) {
    option (chronos.options.v1.public) = true;
    option (chronos.options.v1.operation) = OPERATION_CLASS_READ;

    option (gnostic.openapi.v3.operation) = {security: [{}]};
  }

  // BeginFederatedSignIn starts signing in with an identity provider.
  //
  // Public: the population reaching it has not authenticated, and by definition
  // may have no account at all. It carries no identifier, so it cannot be asked
  // whether an address exists.
  //
  // A WRITE, because it records a ceremony: PKCE, state and nonce are bound to
  // this request and stored server-side, which is what makes the callback
  // verifiable rather than merely plausible.
  rpc BeginFederatedSignIn(BeginFederatedSignInRequest) returns (BeginFederatedSignInResponse) {
    option (chronos.options.v1.public) = true;
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    option (gnostic.openapi.v3.operation) = {
      security: [{}]
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // FinishFederatedSignIn redeems the provider's callback.
  //
  // # It does NOT always produce a session, and that is the design
  //
  // identity.md §7 forbids auto-linking a federated identity to an existing
  // account on an email match alone — the attacker registers at a provider using
  // the victim's address, the provider does not verify it, and naive matching
  // hands them the account. So a genuine sign-in whose conditions are not met
  // answers `link_refused` with no session, and the person authenticates with an
  // existing method and links explicitly from settings.
  //
  // `account_exists` rides with it so a client can say "you already have an
  // account, sign in and link this" rather than the dead end §7.5 names, where a
  // second account is created silently and one person owns two.
  //
  // The session it does create is AAL1: a provider may have required its own
  // second factor and this system cannot know that it did.
  rpc FinishFederatedSignIn(FinishFederatedSignInRequest) returns (FinishFederatedSignInResponse) {
    option (chronos.options.v1.public) = true;
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    option (gnostic.openapi.v3.operation) = {
      security: [{}]
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // BeginFederatedLink starts attaching a provider to the caller's own account.
  //
  // AAL2. identity.md §7 rule 3 requires step-up for linking, and the reason is
  // the whole of §7: a link attached to an account the linking party has not
  // proven control of is a TROJAN IDENTIFIER that survives every later recovery,
  // because a password reset changes a credential and leaves a link alone.
  //
  // No bootstrap exemption. Linking a provider is not a way to enrol a first
  // second factor, and admitting one here would make the weakest session able to
  // add a permanent way in.
  rpc BeginFederatedLink(BeginFederatedLinkRequest) returns (BeginFederatedLinkResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // FinishFederatedLink completes the link.
  //
  // It consults NO auto-link rules, deliberately: the caller has already proven
  // the account, and that proof is exactly what §7 rule 1's conditions
  // substitute for when it is absent. Applying them again would refuse somebody
  // permission to link their own provider to their own account.
  rpc FinishFederatedLink(FinishFederatedLinkRequest) returns (FinishFederatedLinkResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // UnlinkFederatedIdentity removes a provider from the caller's account.
  //
  // Refused when it would leave the account with no way to sign in — identity.md
  // §7's de-linking rule names the case exactly: removing the last federated
  // link from a PASSWORDLESS account, whose holder would then have nothing at
  // all. Somebody who signed up with Google has no password by design, so an
  // endpoint that allowed it would be account loss dressed as a settings toggle.
  rpc UnlinkFederatedIdentity(UnlinkFederatedIdentityRequest) returns (UnlinkFederatedIdentityResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // ---------------------------------------------------------------------
  // Service accounts and API keys (identity.md §10)
  //
  // # These are the only ORGANIZATION-scoped methods in this service
  //
  // Everything above declares `relation: "self"` on `user`, which answers gate
  // 2 locally from the principal and skips gates 1 and 3 — because a person
  // exists before any organization and an org whose payment lapsed must not
  // stop somebody signing out of a stolen device.
  //
  // A key is different in kind. It is a credential that acts INSIDE a tenant,
  // it is bound to one organization immutably at creation (identity.md §10,
  // review D2), and it is administered by that organization's admins rather
  // than by its owner alone. So these declare `admin` on `organization` and run
  // the whole pipeline: gate 1 resolves and VERIFIES the tenant, gate 2 asks
  // OpenFGA, gate 3 applies the org's lifecycle, and gate 5 claims the
  // idempotency key.
  //
  // # Every mutation requires AAL2, and that is what stops a key minting a key
  //
  // A machine cannot present a second factor, so a key-authenticated request
  // carries AAL1 permanently and can never be elevated — there is no step-up
  // ceremony a program can perform. `min_aal = ASSURANCE_LEVEL_2` on all four
  // mutations therefore means a machine credential can never create, rotate or
  // revoke one, which closes the self-perpetuation route: an attacker who
  // steals a key cannot use it to mint a second, quieter one, and cannot use it
  // to cover a track by revoking the first.
  //
  // It also matches what the level is FOR. Minting a credential that survives a
  // password change, a second-factor re-enrolment and a sign-out-everywhere is
  // exactly the kind of durable-access decision identity.md §2 lists step-up
  // for, beside MFA disable and account deletion.
  //
  // No bootstrap exemption on any of them. The exemption exists so an account
  // with no second factor can enrol its first (chronos.options.v1.
  // bootstrap_min_aal); minting an API key is not a way to enrol one, and an
  // account that has not finished enrolling has no business creating machine
  // credentials for an organization.
  //
  // GROW rather than WRITE is deliberately NOT used. A key is not a seat and
  // consumes no quota, and classing it as GROW would refuse key management to a
  // past-due organization — which is the moment its owner most needs to be able
  // to revoke a leaked credential.

  // CreateServiceAccount opens a non-human principal in the caller's
  // organization.
  //
  // It mints NO credential. A service account that has just been created can
  // authenticate nothing at all; CreateApiKey is a separate decision that
  // separately notifies, and keeping them apart is what lets an incident
  // timeline distinguish "somebody created a principal" from "somebody gave a
  // principal a way in".
  rpc CreateServiceAccount(CreateServiceAccountRequest) returns (CreateServiceAccountResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "organization"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    // A MUTATION, so it carries an Idempotency-Key. The header is described
    // once, in proto/openapi.base.yaml's components, and every operation that
    // requires it references that one description.
    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // ListServiceAccounts shows the organization's non-human principals.
  //
  // READ, so it is permitted in every organization state including Suspended
  // and Closed — a tenant that has stopped paying may still see what
  // authenticates against it.
  rpc ListServiceAccounts(ListServiceAccountsRequest) returns (ListServiceAccountsResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "organization"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_READ;
  }

  // CreateApiKey mints a machine credential and returns it exactly once.
  //
  // The token is in the response and nowhere else: only its digest is stored,
  // so this is the only moment it exists anywhere this system can reach. A
  // caller that loses it rotates the key.
  //
  // The key is bound to the caller's organization IMMUTABLY. Without that
  // binding a key silently inherits every organization its owner belongs to,
  // and a token leaked from one customer's CI reaches another customer's data —
  // a cross-tenant breach originating in a feature nobody thought was
  // tenant-scoped (identity.md §10, review D2).
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "organization"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // RotateApiKey replaces a key's secret without replacing the key.
  //
  // The key id, the scopes, the organization binding and every grant that names
  // the owner are unchanged, so no consumer has to be reconfigured beyond the
  // secret itself — which is what makes rotation something anybody actually
  // performs.
  //
  // The superseded secret keeps working for a bounded, RECORDED window, so
  // there is no instant in which neither secret resolves and no path by which
  // the old one lives forever. `immediate` collapses the window to nothing,
  // which is the leak response.
  rpc RotateApiKey(RotateApiKeyRequest) returns (RotateApiKeyResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "organization"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // RevokeApiKey ends a key and destroys every secret it ever had.
  //
  // IMMEDIATE, and not eventually: the stored digests are deleted in the same
  // request, and the event is what makes the projection and the audit trail
  // agree. Neither half is enough alone — the event alone leaves the credential
  // usable until the projector catches up, and the delete alone leaves nothing
  // in the log saying why the key stopped working, so a rebuild would show it
  // as live while it resolved nothing.
  //
  // Idempotent: revoking an already-revoked key appends nothing, reports
  // `changed = false`, and STILL sweeps secrets — a second call is what
  // somebody makes when they are not sure the first took.
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "organization"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // ListApiKeys shows the organization's machine credentials, revoked ones
  // included.
  //
  // No token and no digest comes back, and no field of the response could hold
  // one. Revoked keys are listed on purpose: the evidence that a revocation
  // took effect is what somebody checks immediately after performing one.
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "organization"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_READ;
  }
}
