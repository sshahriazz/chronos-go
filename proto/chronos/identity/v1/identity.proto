  // event.
  //
  // `required` matches the handler, which refuses an empty or whitespace-only
  // code. It is declared here and NOT on AuthenticateRequest.code, and the
  // difference is who is asking: this call runs on an AAL2 session, against the
  // caller's OWN account, confirming a secret the same caller was handed
  // moments ago. There is no account to enumerate and no factor inventory to
  // disclose, so a refusal for malformed input reveals nothing a login refusal
  // would have hidden.
