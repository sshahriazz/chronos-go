# The document-level default. Every public operation overrides it with an
# explicit empty requirement, so "unauthenticated" is a statement in this
# document rather than the absence of one.
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        The session token returned by `IdentityService/CreateSession`, sent as
        `Authorization: Bearer <token>`.

        Returned by that call and by no other, ever: only its digest is stored,
        so there is no endpoint that can re-display it. It is opaque — do not
        parse it.

        Two deadlines bound it, and both are returned with it. The IDLE deadline
        moves forward on each authenticated request; the ABSOLUTE one does not,
        and it is what bounds a stolen token held by an attacker who keeps it
        warm, which an idle deadline alone cannot do. Revocation through
        `RevokeSession` or `RevokeAllSessions` is immediate.

