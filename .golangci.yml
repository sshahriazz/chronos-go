# Enforces the import contract from CONVENTIONS.md §2 and ADR-001.
# These rules are the boundary. A violation fails the build, not the review.
version: "2"

linters:
  # Test files are exempt from three linters, and this block MUST live under
  # `linters:` — at the top level golangci-lint v2 rejects the whole config
  # (`additional properties 'exclusions' not allowed`), which means the rule had
  # never applied since the v2 migration: gosec, errcheck and noctx were running
  # on every _test.go in the repo. `golangci-lint config verify` is what catches
  # this; a plain `run` does not complain.
  #
  # Why these three and only in tests: gosec flags file reads and weak randomness
  # a fixture is entitled to; errcheck flags the deliberate discard of a Close
  # whose failure a test does not care about; noctx flags requests a test makes
  # against its own httptest server.
  exclusions:
    rules:
      - path: _test\.go$
        linters: [gosec, errcheck, noctx]
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - nilerr
    - noctx
    - revive

  settings:
    depguard:
      rules:
        # ── The kernel knows nothing about modules, and nothing about drivers ──
        platform-is-pure:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: github.com/chronos/chronos-go/internal/modules
              desc: "platform is the kernel; it must never import a module (ADR-001)"
            - pkg: github.com/chronos/chronos-go/internal/adapter
              desc: "platform declares ports; adapters implement them, not the reverse"
            - pkg: github.com/chronos/chronos-go/gen
              desc: "generated wire types are not kernel primitives"
            - pkg: github.com/jackc/pgx
              desc: "no drivers in the kernel — declare a port instead"
            - pkg: github.com/stripe/stripe-go
              desc: "no vendor SDKs in the kernel"
            - pkg: go.temporal.io
              desc: "no vendor SDKs in the kernel"

        # ── One JSON library, one place (ADR-047) ──
        #
        # encoding/json v1 and v2 disagree about things that silently corrupt
        # data rather than failing: v1 matches field names case-insensitively
        # and v2 does not, v1 takes the last of duplicate object members and v2
        # rejects them, v1 writes nil slices as null and v2 as []. Two libraries
        # in one binary means two answers to "what does this document mean", and
        # the disagreement is invisible until it is already in the event log.
        #
        # So v1 is reachable from exactly two places: the kernel that wraps v2,
        # and the one test that deliberately uses v1 as an INDEPENDENT parser to
        # check stored bytes — producing the expected value with the codec under
        # test would make both sides fail identically.
        json-goes-through-the-codec:
          files:
            - "**/*.go"
            - "!**/internal/platform/codec/**"
            - "!**/internal/adapter/kurrentdb/codecmigration_integration_test.go"
          deny:
            - pkg: encoding/json
              desc: "use internal/platform/codec, which wraps encoding/json/v2 and forces the strict-vs-tolerant choice into the function name (ADR-047)"
            - pkg: encoding/json/v2
              desc: "import the codec kernel, not the experimental package directly: it is outside the Go 1 compatibility promise, and the kernel is what keeps the blast radius at one file (ADR-047)"

        # ── Domain is pure: no I/O, no transport, no serialization ──
        domain-is-pure:
          files:
            - "**/internal/modules/*/domain/**"
          deny:
            - pkg: encoding/json
              desc: "a domain type with json tags has let a wire format dictate a business rule; serialize in adapters (ADR-001)"
            - pkg: net/http
              desc: "transport does not belong in the domain (ADR-001)"
            - pkg: database/sql
              desc: "persistence does not belong in the domain (ADR-001)"
            - pkg: github.com/chronos/chronos-go/gen
              desc: "generated protobuf types are DTOs, never domain types (ADR-007)"
            - pkg: github.com/chronos/chronos-go/internal/adapter
              desc: "the domain depends inward only"
            - pkg: connectrpc.com/connect
              desc: "the domain returns DomainError; the API layer maps it (CONVENTIONS §5)"
            - pkg: github.com/jackc/pgx
            - pkg: go.temporal.io
            - pkg: github.com/stripe/stripe-go

        # ── app/ declares ports; it must not reach for concrete infrastructure ──
        app-declares-ports:
          files:
            - "**/internal/modules/*/app/**"
          deny:
            - pkg: github.com/chronos/chronos-go/gen/proto
              desc: "use cases take domain types; the API layer maps proto (ADR-007)"
            - pkg: github.com/jackc/pgx
              desc: "declare a port; the adapter implements it"
            - pkg: github.com/stripe/stripe-go

        # ── The tenant API must not link the operator plane (ADR-024) ──
        api-excludes-operator:
          files:
            - "**/cmd/api/**"
            - "**/internal/server/**"
            - "**/internal/modules/**"
          deny:
            - pkg: github.com/chronos/chronos-go/internal/operator
              desc: "the operator plane is a separate binary; cmd/api must not link it (ADR-024)"

    revive:
      rules:
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: exported
          disabled: true

    gosec:
      excludes:
        - G404 # non-crypto rand is fine where we use it deliberately

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
