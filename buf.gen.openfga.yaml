# Generates the OpenFGA gRPC client.
#
# The official Go SDK (github.com/openfga/go-sdk) is generated by OpenAPI
# Generator and speaks HTTP only — verified: it imports net/http and contains no
# reference to google.golang.org/grpc anywhere in the module. The SERVER does
# serve gRPC on :8081, with Check, BatchCheck, ListObjects, ListUsers and Expand
# all present, so ADR-037 ("gRPC wherever the dependency offers it") means
# generating a client rather than taking the SDK.
#
# Generate with: make api-openfga
version: v2
managed:
  enabled: true
  # Only OpenFGA's own protos are rehomed into our module. Its transitive
  # dependencies — googleapis annotations, protoc-gen-validate, the gateway's
  # OpenAPI options — already have correct upstream Go packages, and rewriting
  # those would produce imports of packages that exist nowhere.
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
    - file_option: go_package
      module: buf.build/envoyproxy/protoc-gen-validate
    - file_option: go_package
      module: buf.build/grpc-ecosystem/grpc-gateway
  override:
    - file_option: go_package_prefix
      value: github.com/chronos/chronos-go/gen/thirdparty
plugins:
  - local: protoc-gen-go
    out: gen/thirdparty
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/thirdparty
    opt: paths=source_relative
