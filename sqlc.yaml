# sqlc is the mandated query path (ADR-011, CONVENTIONS §8): SQL lives in .sql
# files, is validated against the real schema at generate time, and never
# appears as a string in Go source.
#
# The schema comes from the GOOSE MIGRATIONS themselves, not a separate
# desired-state file. A second description of the schema is a second thing to
# keep in sync, and the migrations are what actually runs.
version: "2"
sql:
  - engine: postgresql
    schema: cmd/migrate/migrations
    queries: db/query/notification
    gen:
      go:
        package: notificationdb
        out: gen/sqlc/notification
        sql_package: pgx/v5

        # Exported query constants are what make this work with the batching
        # write path. A projector QUEUES statements into one pipelined round
        # trip (ADR-019), so it cannot call a generated method that executes
        # immediately — but it can queue the generated CONSTANT. The SQL is
        # still authored in .sql, still schema-checked by sqlc, and still absent
        # from Go source.
        emit_exported_queries: true

        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true

  - engine: postgresql
    schema: cmd/migrate/migrations
    queries: db/query/platform
    gen:
      go:
        package: platformdb
        out: gen/sqlc/platform
        sql_package: pgx/v5
        emit_exported_queries: true
        emit_interface: true
        emit_empty_slices: true

  - engine: postgresql
    schema: cmd/migrate/migrations
    queries: db/query/identity
    gen:
      go:
        package: identitydb
        out: gen/sqlc/identity
        sql_package: pgx/v5
        emit_exported_queries: true
        emit_interface: true
        emit_empty_slices: true
  - engine: postgresql
    schema: cmd/migrate/migrations
    queries: db/query/profile
    gen:
      go:
        package: profiledb
        out: gen/sqlc/profile
        sql_package: pgx/v5
        emit_exported_queries: true
        emit_interface: true
        emit_empty_slices: true
  - engine: postgresql
    schema: cmd/migrate/migrations
    queries: db/query/organization
    gen:
      go:
        package: organizationdb
        out: gen/sqlc/organization
        sql_package: pgx/v5
        emit_exported_queries: true
        emit_interface: true
        emit_empty_slices: true
