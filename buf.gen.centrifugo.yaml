version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/chronos/chronos-go/gen/thirdparty
plugins:
  - local: protoc-gen-go
    out: gen/thirdparty
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/thirdparty
    opt: paths=source_relative
