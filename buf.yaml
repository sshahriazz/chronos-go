version: v2
modules:
  - path: proto
  # The operator plane's own module (ADR-024, operator.md §1).
  #
  # A SEPARATE module rather than another directory under proto/, and the reason
  # is what gets generated from each. The OpenAPI document, the error catalogue
  # and the embedded API reference are all produced from `proto/` alone, so no
  # operator method can reach the published REST surface — not because a filter
  # drops it, but because the generator is never handed the file. An exclusion
  # rule inside the generator config would be one refactor away from being lost;
  # this cannot be lost without somebody moving a directory.
  #
  # It is still linted, still breaking-checked and still generated into Go by
  # buf.gen.yaml, because none of that publishes anything.
  - path: proto-operator
deps:
  # protovalidate's rule extensions (ADR-007). Constraints live in the .proto
  # and are enforced by an interceptor before a handler runs, so a documented
  # constraint and an enforced one are the same artefact (CONVENTIONS §7).
  - buf.build/bufbuild/protovalidate
  # gnostic's OpenAPI v3 annotations. The REST reference is the only published
  # surface, and a worked example per operation is part of it (CONVENTIONS §7.1);
  # protobuf has no native way to carry one, so it is carried here — next to the
  # message it exemplifies, rather than in a side file that can drift from it.
  - buf.build/gnostic/gnostic
  # Re-add when the OpenFGA gRPC adapter is built (ADR-037) — their official Go
  # SDK is HTTP-only, so the gRPC client is generated from their protos:
  #   - buf.build/openfga/api
lint:
  use:
    - STANDARD
    # Documentation is part of the API contract (CONVENTIONS §7.1). An
    # undocumented field ships forever, so this is enforced, not encouraged.
    - COMMENTS
  except:
    # Our package path is chronos.<module>.v1; the directory mirrors it.
    - PACKAGE_VERSION_SUFFIX
    # Comments on enum *values* are noise when the name is self-describing;
    # everything else must be documented.
    - COMMENT_ENUM_VALUE
breaking:
  use:
    - FILE
