# Everything this repository claims about itself is verified here.
#
# Until this existed, every guarantee — the RLS leak test, the snapshot
# equivalence proof, exactly-once reactor delivery, the lease-starvation test —
# held only because someone ran the command locally. That is not a guarantee.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same branch, except on main
# where every commit's result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # What the integration suite actually touches, which is no longer "the log and
  # the read model, nothing else": the tests grew Valkey (decision cache,
  # revocation epochs, attempt ceilings), OpenFGA (tuple writes), Temporal
  # (schedules are server-side state) and Mailpit (delivery is asserted through
  # the real SMTP path). Every one of those was missing, and every integration
  # failure was that absence rather than a defect:
  #
  #   valkey was unreachable when this process started
  #   dial tcp [::1]:6379: connect: connection refused
  #   TEMPORAL_ENABLED=true built no client
  #   dial tcp [::1]:10000: connect: connection refused   (Centrifugo)
  #   dial tcp [::1]:8200: connect: connection refused    (OpenBao)
  #
  # A job that starts less than the suite needs does not test less; it fails.
  COMPOSE_SERVICES: postgres kurrentdb valkey openfga temporal mailpit centrifugo openbao

jobs:
  build:
    name: format, vet, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # proto-breaking and the migration guard both diff against main.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting and tidiness
        run: make fmt-check

      - run: go build ./...

      - run: go vet ./...

      # 180 MB of arm64 executables were committed here between 2026-08-10 and
      # 2026-08-26, from `go build` runs in the repository root. GitHub warned
      # on every push and nobody read the warning, so it is a build step now.
      - name: No compiled executable is tracked
        run: go run ./internal/tools/checkbinaries

      # -race, because the projector and reactor runners are concurrent by
      # design and a data race here corrupts a read model rather than crashing.
      - name: Unit tests
        run: go test ./... -race -count=1 -timeout 15m

      # No .env is ever created in this job, so the run above IS the clean-
      # environment run. That is the case the config tests failed: they passed
      # locally only because the developer's shell carried POSTGRES_APP_PASSWORD.

  lint:
    name: lint and import contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The pinned version, BUILT FROM SOURCE with this job's Go rather than
      # downloaded as a prebuilt binary. The release binaries are compiled with
      # whatever Go the golangci-lint release used, and a linter built with an
      # older Go cannot typecheck a module that declares a newer one — it does
      # not degrade, it panics:
      #   panic: file requires newer Go version go1.27 (application built with go1.26)
      # That happened here on the 1.26 -> 1.27 move. `go install` compiles it
      # against go.mod's toolchain, so the linter can always read what it lints.
      # Invoked through the same make target developers run.
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: golangci-lint, including the depguard import contract
        run: make lint

  proto:
    name: proto lint, breaking changes, API docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.71.0
      # The OpenAPI checker is a Go program in this repository. It reads the
      # `(chronos.options.v1.public)` option off the COMPILED descriptors —
      # the same ones the authentication interceptor enforces at runtime — so
      # it needs the toolchain, not a scripting runtime.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The COMMENTS category is on, so an undocumented service, RPC, message
      # or field fails the build (CONVENTIONS §7.1).
      - run: buf lint

      - name: Breaking change check
        if: github.event_name == 'pull_request'
        run: |
          # Against the LOCAL main. A https:// baseline would need credentials
          # the moment this repository becomes private.
          git fetch --no-tags --depth=1 origin main
          buf breaking --against '.git#ref=origin/main,subdir=.'

      - name: OpenAPI spec is complete
        # No runtime to install and nothing to skip: the YAML parser and the
        # protobuf descriptors are compiled into the checker. Its predecessor
        # was a script that exited 0 when its YAML library was missing, which
        # is what this step did on every run here for its entire life — passing
        # without ever parsing the spec.
        run: go run ./internal/tools/checkopenapi

  migrations:
    name: migrations are append-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # An applied migration must never change. The guard diffs against main,
      # so it needs full history and an explicit base.
      - run: bash scripts/check_migrations.sh
        env:
          MIGRATION_BASE_REF: origin/main

  changelog:
    name: unreleased fragments are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Entries are written at RELEASE time, from the diffs, so there is nothing
      # to require of a pull request. What is checked here is that any fragment
      # already sitting in .changes/unreleased/ satisfies .changie.yaml — an
      # unknown kind or domain, an empty body or a pasted commit subject fails
      # now rather than at 'make release', when someone is waiting on a tag.
      #
      # The coverage half of this tool (-coverage, "does this release describe
      # anything?") belongs to 'make release' and runs there.
      - name: Fragments satisfy .changie.yaml
        run: go run ./internal/tools/checkchangelog

  integration:
    name: integration against real infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The SAME compose file developers use. A separate CI definition would
      # drift, and the drift would be invisible until production.
      - name: Start PostgreSQL and KurrentDB
        run: |
          cp .env.example .env
          docker compose up -d $COMPOSE_SERVICES

      - name: Wait for health
        run: |
          # Only the services this job started. A service with no healthcheck
          # reports an EMPTY status, which would otherwise never satisfy the
          # loop — grafana is exactly that, and would hang here forever.
          for i in $(seq 1 60); do
            pending=""
            for svc in $COMPOSE_SERVICES; do
              state=$(docker compose ps --format '{{.Service}} {{.Health}}' \
                | awk -v s="$svc" '$1 == s {print $2}')
              [ "$state" = "healthy" ] || pending="$pending $svc($state)"
            done
            if [ -z "$pending" ]; then echo "all healthy"; exit 0; fi
            echo "waiting on:$pending"
            sleep 5
          done
          echo "services never became healthy"
          docker compose ps
          docker compose logs --tail=100
          exit 1

      # Personal data cannot be stored at all without the transit engine: the
      # vault wraps every data key through it, and a fresh volume has none, so
      # Register fails with a 404 nobody expects and the tests read it as
      # "internal error". Idempotent, and the same target `make up` runs.
      - name: Mount the OpenBao transit engine and create the KEK
        run: make bao-init

      # Applied with the OWNER credentials; the tests then connect as the
      # non-privileged chronos_app role, which is what makes the RLS assertions
      # meaningful (ADR-015).
      - name: Apply migrations
        run: set -a && . ./.env && set +a && go run ./cmd/migrate -cmd=up

      # OpenFGA is provisioned out-of-band, never by the server (see
      # internal/tools/deployauthzmodel: a process that creates its own
      # authorization store answers every check against whatever it just made).
      # .env.example ships the ids EMPTY, which is correct for a file in git and
      # useless to a test that writes tuples.
      #
      # The ids are written back into .env rather than exported to $GITHUB_ENV,
      # because the test step sources .env afterwards — an exported id would be
      # overwritten by the empty one a moment later, and the job would fail with
      # the ids apparently set.
      - name: Provision the OpenFGA store and model
        run: |
          set -a && . ./.env && set +a
          go run ./internal/tools/deployauthzmodel | tee /tmp/authz.out
          store=$(grep -m1 '^OPENFGA_STORE_ID=' /tmp/authz.out | cut -d= -f2)
          model=$(grep -m1 '^OPENFGA_MODEL_ID=' /tmp/authz.out | cut -d= -f2)
          if [ -z "$store" ] || [ -z "$model" ]; then
            echo "provisioning printed no ids; refusing to run tests against an unpinned model"
            exit 1
          fi
          sed -i "s|^OPENFGA_STORE_ID=.*|OPENFGA_STORE_ID=$store|" .env
          sed -i "s|^OPENFGA_MODEL_ID=.*|OPENFGA_MODEL_ID=$model|" .env
          echo "pinned store=$store model=$model"

      - name: Integration tests
        run: |
          set -a && . ./.env && set +a
          go test -tags=integration ./... -race -count=1 -timeout 20m

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
