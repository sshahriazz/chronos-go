syntax = "proto3";

// Package compliance is the wire contract for a data subject's own rights.
//
// Every method here acts on the CALLER'S OWN data and names no subject. That is
// not a convenience: a request that could name a subject is a request to
// exercise somebody else's rights, and the most dangerous endpoint in a product
// like this is one that acts on a person named by whoever asked.
//
// The rights are Chapter III of the GDPR. What is here is what is built;
// compliance.md §3 lists six and this carries one, because shipping an endpoint
// for a right the system cannot actually deliver is worse than not having it.
package chronos.compliance.v1;

import "buf/validate/validate.proto";
import "chronos/options/v1/options.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

// RestrictProcessingRequest halts processing of the caller's data (Article 18).
message RestrictProcessingRequest {}

// RestrictProcessingResponse reports the state after the call.
message RestrictProcessingResponse {
  // Whether this call changed anything. False means processing was ALREADY
  // restricted, which is a success: the caller asked for a state that holds.
  bool changed = 1;

  // When the restriction began — the FIRST time it was invoked, not this call.
  // A repeated request must not move a date the person has been given.
  google.protobuf.Timestamp restricted_since = 2;
}

// LiftProcessingRestrictionRequest resumes processing of the caller's data.
message LiftProcessingRestrictionRequest {}

// LiftProcessingRestrictionResponse reports the state after the call.
message LiftProcessingRestrictionResponse {
  // False means nothing was restricted, which is a success for the same reason
  // the cancel path is: the control is clicked twice, and neither click is
  // wrong.
  bool changed = 1;
}

// GetProcessingRestrictionRequest asks whether the caller's data is restricted.
message GetProcessingRestrictionRequest {}

// GetProcessingRestrictionResponse is the current state.
message GetProcessingRestrictionResponse {
  // Whether processing is currently halted.
  bool restricted = 1;

  // When it began. Unset when there is no restriction.
  google.protobuf.Timestamp restricted_since = 2;
}

// ExportMyDataRequest asks for a copy of everything held about the caller.
message ExportMyDataRequest {}

// ExportMyDataResponse names the request, and carries no link.
//
// # The link is GONE from this message, deliberately
//
// It used to carry a signed URL, produced inside the request. Building the
// bundle is now a workflow (compliance.md §5), so at the moment this responds
// there is nothing to link to — and a field that was sometimes a URL and
// sometimes empty would be a client branching on emptiness to decide whether a
// legal obligation had been met.
//
// The break is deliberate and one-time. No release has been cut, and the
// alternative was a permanently empty field on the most sensitive endpoint in
// the product.
message ExportMyDataResponse {
  // 1 and 2 held `download_url` and `expires_at`. They are RESERVED rather than
  // reused, and that matters even in a deliberate break: a client built against
  // the old schema would otherwise decode an export id into the field it calls
  // `downloadUrl` and hand a person an identifier where a link belonged.
  // Reserved, it decodes nothing at all — which is the honest answer.
  reserved 1, 2;
  reserved "download_url", "expires_at";

  // The request's own id, which GetDataExport is polled with.
  //
  // DERIVED from the caller's Idempotency-Key rather than minted at random, so
  // one person pressing a button twice polls one export instead of starting two
  // workflows — and so a client that retried a request it never saw the answer
  // to can recover the id by retrying with the same key.
  string export_id = 3 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "export_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 33
      pattern: "^export_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    },
    (buf.validate.field) = {required: true}
  ];

  // Where the request has got to, at the moment it was accepted. Always
  // DATA_EXPORT_STATUS_PENDING today; returned rather than assumed so a client
  // that polls immediately reads one shape of answer everywhere.
  DataExportStatus status = 4;
}

// DataExportStatus is where one request has got to.
enum DataExportStatus {
  DATA_EXPORT_STATUS_UNSPECIFIED = 0;

  DATA_EXPORT_STATUS_PENDING = 1;

  DATA_EXPORT_STATUS_READY = 2;

  DATA_EXPORT_STATUS_FAILED = 3;
}

// GetDataExportRequest polls one request the caller made.
message GetDataExportRequest {
  // The id ExportMyData returned.
  //
  // It is unguessable, and "unguessable" is not the authorization rule: the
  // server matches it against the AUTHENTICATED caller, so an id belonging to
  // somebody else answers exactly as an unknown one.
  string export_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "export_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 33
      pattern: "^export_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    },
    (buf.validate.field) = {
      required: true
      string: {max_len: 33}
    }
  ];
}

// GetDataExportResponse is the request's state, and its links when ready.
message GetDataExportResponse {
  // Where the request has got to.
  DataExportStatus status = 1;

  // A signed, EXPIRING URL for the manifest — the JSON describing everything
  // included. Empty unless the status is READY.
  //
  // Minted per poll and stored nowhere: it is a bearer capability, and
  // persisting one would turn an expiring link into a durable credential for the
  // most concentrated personal data we hold. Delivered here rather than by
  // email, which compliance.md §5 requires — a link in a mailbox is forwarded,
  // archived, and outlives its hour.
  string manifest_url = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "https://s3.example.com/chronos/subj9f2.../k4m2n?X-Amz-Signature=..."}
    max_length: 4096
    pattern: "^https://"
  }];

  // The stored files the manifest references, each with its own link.
  repeated ExportedFile files = 3 [(buf.validate.field).repeated.max_items = 1000];

  // When every link above stops working. They are minted together, so there is
  // one deadline rather than one each.
  google.protobuf.Timestamp expires_at = 4;

  // Why the request produced nothing. Set only when the status is FAILED.
  //
  // A SHORT MACHINE STRING, not a sentence and not a diagnosis: an object
  // store's error names a bucket, a key and an endpoint, none of which means
  // anything to the person reading it. Render one sentence per known value and a
  // generic one for anything else.
  string failure_reason = 5 [(gnostic.openapi.v3.property) = {
    example: {yaml: "processing_restricted"}
    max_length: 64
    // A lower-case machine token, or empty when the export did not fail. NOT an
    // enum: a client must render an unrecognised reason as its generic sentence
    // rather than failing to decode, so that adding one is not a breaking
    // change to every client.
    pattern: "^[a-z_]*$"
  }];

  // When the request was made, and when it settled. settled_at is unset while
  // the status is PENDING.
  google.protobuf.Timestamp requested_at = 6;

  // When it settled, either way. Unset while the status is PENDING.
  google.protobuf.Timestamp settled_at = 7;
}

// ExportedFile is one stored file the export references.
//
// REFERENCED, not copied into the bundle. Copying would put a second copy of the
// most concentrated personal data in the system beside the first, and erasure
// would then have to find both.
message ExportedFile {
  // The opaque object key. It carries no business meaning by construction, and
  // is included so a person can quote it to support.
  string key = 1 [(gnostic.openapi.v3.property) = {
    example: {yaml: "subj9f2.../k4m2n"}
    max_length: 1024
    // A prefix and an unguessable name, separated by one slash. Published as
    // documentation rather than enforced, because this is a RESPONSE field: the
    // server produces it from a key it minted, so a rule here would be an oracle
    // about the store's layout rather than a bound on anything a caller sends.
    pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
  }];

  // The file's length in bytes, as the store reported it when the export ran.
  int64 size_bytes = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "18422"}
      // The wire type's own ceiling, expressed as the largest int64 a JSON
      // number carries EXACTLY. 2^63-1 does not survive the document's float64
      // round trip — it comes back as 9223372036854776000, which is not the
      // number anybody meant — and a bound a client cannot read back is worse
      // than the honest one below.
      maximum: 9007199254740991
    },
    // The floor is a RULE rather than an annotation, and it has to be:
    // `minimum: 0` on the annotation is proto3's zero value for that field,
    // indistinguishable from unset, so the generator never sees it and the
    // document silently loses the bound. `gte` survives, and on a response
    // message it adds no refusal to anything — the interceptor validates
    // requests. The same construction RevokeAllSessionsResponse uses.
    (buf.validate.field).int64.gte = 0
  ];

  // A signed, EXPIRING URL, or EMPTY when the file no longer exists.
  //
  // The manifest is a snapshot of what the account held when the export ran, so
  // a file deleted since has nothing to fetch. It is reported as an entry with
  // no link rather than omitted, because "you had a file here and it is gone
  // now" is a true answer and silence is not.
  string download_url = 3 [(gnostic.openapi.v3.property) = {
    example: {yaml: "https://s3.example.com/chronos/subj9f2.../a1b2?X-Amz-Signature=..."}
    max_length: 4096
    // HTTPS or EMPTY, and the empty alternative is the point: a file deleted
    // since the export ran is reported as an entry with no link rather than
    // omitted. A pattern demanding a URL would make the honest answer invalid.
    pattern: "^(https://.*)?$"
  }];
}

// ListDataExportsRequest asks what the caller has requested before.
message ListDataExportsRequest {
  // How many to return, newest first. Clamped server-side.
  int32 limit = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "20"}
      minimum: 1
      maximum: 50
    },
    (buf.validate.field).int32 = {
      gte: 0
      lte: 50
    }
  ];
}

// ListDataExportsResponse is the caller's own request history.
//
// It carries NO links. Minting one per file of every past export would turn a
// list screen into a bulk issuance of bearer capabilities for everything the
// person has ever exported; the caller opens the one they want.
message ListDataExportsResponse {
  // The caller's own requests, newest first.
  repeated DataExportSummary exports = 1 [(buf.validate.field).repeated.max_items = 50];
}

// DataExportSummary is one past request, without its links.
message DataExportSummary {
  // The request's id. Poll it with GetDataExport to obtain the links.
  string export_id = 1 [(gnostic.openapi.v3.property) = {
    example: {yaml: "export_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
    max_length: 33
    pattern: "^export_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
  }];

  // Where the request got to.
  DataExportStatus status = 2;

  // How many stored files the export referenced.
  int32 file_count = 3 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "3"}
      // The server's own ceiling on one export's listing, restated. An export
      // that would exceed it FAILS rather than truncating, so this is a real
      // bound on what can appear here and not a wire-type maximum.
      maximum: 1000
    },
    // The floor is a RULE rather than an annotation, and it has to be:
    // `minimum: 0` on the annotation is proto3's zero value for that field,
    // indistinguishable from unset, so the generator never sees it and the
    // document silently loses the bound. `gte` survives, and on a response
    // message it adds no refusal to anything — the interceptor validates
    // requests. The same construction RevokeAllSessionsResponse uses.
    (buf.validate.field).int32.gte = 0
  ];

  // Set only when the status is FAILED. See GetDataExportResponse.
  string failure_reason = 4 [(gnostic.openapi.v3.property) = {
    example: {yaml: "source_unreadable"}
    max_length: 64
    pattern: "^[a-z_]*$"
  }];

  // When the request was made.
  google.protobuf.Timestamp requested_at = 5;

  // When it settled, either way. Unset while the status is PENDING.
  google.protobuf.Timestamp settled_at = 6;
}

// ComplianceService is the data subject's own rights, exercised on their own
// data.
service ComplianceService {
  // RestrictProcessing halts processing of the caller's data (Article 18).
  //
  // # What it stops, and what it deliberately does not
  //
  // Storage CONTINUES and nothing is deleted — that is the whole distinction
  // from erasure. The account keeps working, sign-in keeps working, projections
  // keep building. What stops is being contacted: no transactional mail, no
  // activity nudges, nothing product.
  //
  // SECURITY ALERTS STILL ARRIVE, and that exemption is deliberate. A control a
  // session holder can set, which stops a security alert, is a control an
  // attacker sets to silence the message that would reveal them — the same
  // reason a notification preference cannot switch one off. Article 18(2)
  // permits it: restriction does not bar processing needed to protect the
  // rights of a natural person, and a warning to the account's own holder about
  // their own account is exactly that.
  //
  // # Why AAL2
  //
  // Restricting somebody silences most of what would tell them their account is
  // being used. Requiring step-up does not remove that risk — the security
  // exemption above is what addresses it — but an endpoint that quietens a
  // person's mail must not be reachable from a session that has proven one
  // factor.
  //
  // Idempotent: a second call reports `changed: false` and returns the ORIGINAL
  // instant.
  rpc RestrictProcessing(RestrictProcessingRequest) returns (RestrictProcessingResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // LiftProcessingRestriction resumes processing of the caller's data.
  //
  // Nothing was lost while the restriction stood, which is Article 18's point as
  // distinct from Article 17: the data was held and not processed, so resuming
  // needs no recovery.
  //
  // Lifting nothing succeeds and reports `changed: false`.
  rpc LiftProcessingRestriction(LiftProcessingRestrictionRequest) returns (LiftProcessingRestrictionResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // ExportMyData produces a machine-readable copy of the caller's personal data
  // (Articles 15 and 20).
  //
  // # This is the most dangerous endpoint in the product
  //
  // It exports everything known about a person, on demand, in a convenient
  // bundle — which is compliance.md §3's own description of it. That is why the
  // subject is the authenticated caller and nothing else, why it takes AAL2, and
  // why the result is a link that expires rather than a payload in the response.
  //
  // # What the bundle contains, and what it does not
  //
  // Every personal-data field the vault holds, plus a statement of what is
  // RETAINED and why — Article 15(1) asks about the processing, not only the
  // values, so a file listing a name and an address while saying nothing about
  // invoices retained under a statutory obligation would be accurate and
  // misleading.
  //
  // It carries no event log, no password hash, no TOTP secret and no session
  // digests. The first names pseudonyms and positions meaningless outside this
  // deployment; the rest are derived from credentials rather than data about the
  // person, and exporting them would turn a privacy right into an offline attack
  // surface.
  //
  // # The bundle is purged by erasure, structurally
  //
  // It is written under the subject's OWN object prefix, which is the namespace
  // an erasure already empties. compliance.md §4 step 9 requires exported
  // bundles to be purged on erasure; putting them there makes that a property of
  // where they live rather than a step somebody has to remember.
  rpc ExportMyData(ExportMyDataRequest) returns (ExportMyDataResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    // EXPORT, not READ. Gate 4 never blocks this class: withholding a person's
    // own data from a suspended tenant is a portability violation, not leverage.
    //
    // EXPORT is a MUTATING class, which it was not until this call became
    // asynchronous: it now appends a data-subject request to the log rather than
    // building a bundle inside the request. The two properties are independent,
    // and BILLING_MANAGE is the precedent for holding both.
    option (chronos.options.v1.operation) = OPERATION_CLASS_EXPORT;
    option (chronos.options.v1.min_aal) = ASSURANCE_LEVEL_2;

    option (gnostic.openapi.v3.operation) = {
      // The key is REQUIRED and it is load-bearing beyond deduplication: the
      // export id is derived from it, so a client that retried a request whose
      // answer it never saw recovers the same id by retrying with the same key.
      // Without one, one person pressing a button twice starts two workflows and
      // receives two bundles.
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // GetDataExport reports where one of the caller's own requests has got to,
  // and mints the download links once it is ready.
  //
  // # A READ, and AAL1
  //
  // Somebody must be able to check on their own request from an ordinary
  // session. Requiring step-up to POLL would mean a person who asked for their
  // data at AAL2 could not find out whether it was ready without stepping up
  // again — on the endpoint they are already waiting on.
  //
  // The links it mints are a different matter, and they are bounded rather than
  // gated: every URL expires within the hour, and the request that produced them
  // required AAL2.
  //
  // # The id is not the authorization
  //
  // It is unguessable, and unguessable is not an authorization rule. The server
  // matches it against the authenticated caller, so an id belonging to somebody
  // else answers exactly as an unknown one — which is the only thing a holder of
  // a leaked id learns for free.
  rpc GetDataExport(GetDataExportRequest) returns (GetDataExportResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_READ;
  }

  // ListDataExports returns the caller's own request history, newest first.
  //
  // It carries NO links. Minting one per file of every past export would turn a
  // list screen into a bulk issuance of bearer capabilities for everything the
  // person has ever exported; the caller opens the one they want.
  rpc ListDataExports(ListDataExportsRequest) returns (ListDataExportsResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_READ;
  }

  // GetProcessingRestriction reports whether the caller's data is restricted.
  //
  // A READ, and AAL1: somebody must be able to see the state of their own
  // request from an ordinary session. Requiring step-up to read what you already
  // asked for would make the setting hard to verify and easy to forget.
  rpc GetProcessingRestriction(GetProcessingRestrictionRequest) returns (GetProcessingRestrictionResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_READ;
  }
}
