syntax = "proto3";

// Package workspace is the wire contract for the collaboration boundary: the
// spaces inside an organization where work actually happens.
//
// Three properties of this schema are load-bearing.
//
// **A workspace lives inside exactly one organization, and never names it.**
// There is no `org_id` field on any request. The organization comes from the
// resolved tenant scope, and a request that could name its own would be a
// request to create a workspace inside somebody else's tenant.
//
// **Creating one CONSUMES QUOTA**, which is why `CreateWorkspace` declares
// `(chronos.options.v1.entitlement)`. The declaration is what makes gate 4 run:
// without it the RPC is ungated and the plan's workspace cap does not apply.
//
// **The creator is its first admin**, from the creation event itself rather than
// a second one. A workspace that existed for even one event with no admin would
// violate the never-zero rule from birth, and a replay would reproduce that.
package chronos.workspace.v1;

import "buf/validate/validate.proto";
import "chronos/options/v1/options.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

// CreateWorkspaceRequest opens a workspace in the caller's organization.
message CreateWorkspaceRequest {
  // The display name people read. Free text within a bound.
  string name = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "Engineering"}
      max_length: 80
      pattern: "^\\S(.*\\S)?$"
    },
    (buf.validate.field).string = {
      min_len: 1
      max_len: 80
      pattern: "^\\S(.*\\S)?$"
    }
  ];
}

// CreateWorkspaceResponse names what was created.
message CreateWorkspaceResponse {
  // The workspace's public id, a prefixed ULID (ADR-030).
  string workspace_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ws_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 29
    },
    (buf.validate.field).string = {
      max_len: 29
      pattern: "^ws_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The name as stored, which is the trimmed form of what was sent.
  //
  // Carries the SAME pattern as the request. A response string is published to
  // clients exactly as a request string is, and a generated client validating
  // what it receives must be given the shape to validate against.
  string name = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "Engineering"}
      max_length: 80
      pattern: "^\\S(.*\\S)?$"
    },
    (buf.validate.field).string = {
      max_len: 80
      pattern: "^\\S(.*\\S)?$"
    }
  ];

  // The lifecycle status. Always `active` for a workspace just created.
  string status = 3 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "active"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: [
        "active",
        "archived",
        "deleted"
      ]
    }
  ];
}

// AddWorkspaceMemberRequest puts an existing account into a workspace.
//
// It names a SUBJECT, never an address. A pseudonym is the only way an account
// appears on this wire (ADR-002), and adding by email would need the caller to
// know one — which is what invitations are for, and they are a different call.
message AddWorkspaceMemberRequest {
  // Which workspace. Read by the authz gate, which asks for `admin` on THIS
  // object rather than on the organization: an org admin inherits it through the
  // `parent` edge, and a workspace admin who is not an org admin does not.
  string workspace_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ws_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 29
    },
    (buf.validate.field).string = {
      max_len: 29
      pattern: "^ws_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Who joins, by pseudonym.
  string subject_id = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "subj_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 31
    },
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^subj_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The role they join with: `admin`, `member` or `guest`.
  //
  // `admin` and `member` draw on the member seat pool; `guest` draws on the
  // separate guest pool (ADR-027). Which pool is consulted is decided from this
  // value, so it is bounded by an enumeration rather than by a length.
  string role = 3 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "member"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: [
        "admin",
        "member",
        "guest"
      ]
    }
  ];
}

// AddWorkspaceMemberResponse reports what the join cost.
message AddWorkspaceMemberResponse {
  // The role as recorded.
  string role = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "member"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: [
        "admin",
        "member",
        "guest"
      ]
    }
  ];

  // Whether this join took a seat from the organization's pool.
  //
  // False is the ordinary answer for somebody already in the organization: a
  // seat is per person per organization, so their second workspace is free
  // (workspace.md §2). Published because a caller adding people in bulk
  // otherwise has no way to see which of them were billable.
  bool seat_consumed = 2;
}

// RemoveWorkspaceMemberRequest takes an account out of a workspace.
message RemoveWorkspaceMemberRequest {
  // Which workspace.
  string workspace_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ws_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 29
    },
    (buf.validate.field).string = {
      max_len: 29
      pattern: "^ws_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Who leaves, by pseudonym.
  string subject_id = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "subj_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 31
    },
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^subj_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];
}

// RemoveWorkspaceMemberResponse reports what the removal returned.
message RemoveWorkspaceMemberResponse {
  // Whether a seat went back to the pool.
  //
  // False when the person is still in another workspace of the same
  // organization, which is the half of the seat rule that leaks revenue if
  // inverted: releasing on every removal hands back a seat the person still
  // holds.
  bool seat_released = 1;
}

// ChangeWorkspaceMemberRoleRequest promotes or demotes an existing member.
message ChangeWorkspaceMemberRoleRequest {
  // Which workspace.
  string workspace_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ws_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 29
    },
    (buf.validate.field).string = {
      max_len: 29
      pattern: "^ws_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Whose role changes, by pseudonym.
  string subject_id = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "subj_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 31
    },
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^subj_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The role to move to.
  string role = 3 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "admin"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: [
        "admin",
        "member",
        "guest"
      ]
    }
  ];
}

// ChangeWorkspaceMemberRoleResponse reports the role now held.
message ChangeWorkspaceMemberRoleResponse {
  // The role as recorded. Equal to the requested one on success, and equal to
  // the previous one when the request asked for the role already held — which
  // is a no-op rather than a conflict.
  string role = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "admin"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: [
        "admin",
        "member",
        "guest"
      ]
    }
  ];
}

// InviteToWorkspaceRequest invites an address into a workspace.
//
// The ADDRESS is the one piece of personal data on this service's wire. It
// reaches the vault and the blind indexer and goes no further: no event, no log
// line and no projection carries it, and the response never echoes it back.
message InviteToWorkspaceRequest {
  // Which workspace. Read by the authz gate, which asks for `admin` on THIS
  // object rather than on the organization.
  string workspace_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ws_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 29
    },
    (buf.validate.field).string = {
      max_len: 29
      pattern: "^ws_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Where to send the invitation.
  //
  // The bound is PUBLISHED rather than enforced, for the reason every other
  // email field in this schema publishes one: the CEL `email` rule is measured
  // on the trimmed value and a `max_len` rule is measured by the interceptor on
  // the raw one, so an enforced length would refuse an address the handler
  // accepts (CONVENTIONS §7.2).
  string email = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "colleague@example.com"}
      max_length: 254
      pattern: "^.+@.+\\..+$"
    },
    (buf.validate.field).string = {email: true}
  ];

  // The role they join with: `admin`, `member` or `guest`.
  string role = 3 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "member"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: [
        "admin",
        "member",
        "guest"
      ]
    }
  ];
}

// InviteToWorkspaceResponse names the invitation that was created.
//
// It carries NO TOKEN. The link is a credential, and the only party entitled to
// it is the person at the address — putting it in this response would hand it to
// the inviter, who could then join as somebody else. It also never echoes the
// address back, so the response cannot be used to confirm what was typed.
message InviteToWorkspaceResponse {
  // The invitation's public id, a prefixed ULID (ADR-030).
  string invitation_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "inv_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 30
    },
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^inv_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The role as recorded.
  string role = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "member"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: [
        "admin",
        "member",
        "guest"
      ]
    }
  ];

  // Whether issuing took a seat from the organization's pool.
  //
  // The seat is taken AT ISSUE, not at acceptance: otherwise 60 pending
  // invitations against 50 seats all look valid, and the 51st acceptance fails
  // for somebody who did nothing wrong (workspace.md §5). False means the
  // invitee is already in the organization and already holds one.
  bool seat_consumed = 3;

  // When the link stops working.
  //
  // A Timestamp rather than a formatted string, which is this schema's
  // convention for an instant: a string would need a pattern that re-implements
  // RFC 3339 badly, and every client would parse it by hand.
  google.protobuf.Timestamp expires_at = 4;
}

// AcceptInvitationRequest redeems an invitation link.
message AcceptInvitationRequest {
  // The token from the link.
  //
  // 256 bits of crypto/rand, base64url without padding — 43 characters. The
  // bound is published AND enforced, because unlike a password there is no
  // oracle: every value of the right shape is equally unguessable, and refusing
  // a malformed one tells an attacker nothing they did not already know.
  string token = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}
      max_length: 43
    },
    (buf.validate.field).string = {
      len: 43
      pattern: "^[A-Za-z0-9_-]{43}$"
    }
  ];
}

// AcceptInvitationResponse names what was joined.
message AcceptInvitationResponse {
  // The workspace now joined.
  string workspace_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ws_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 29
    },
    (buf.validate.field).string = {
      max_len: 29
      pattern: "^ws_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The organization it belongs to, which the caller may be learning for the
  // first time — the invitation named neither until it was redeemed.
  string org_id = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "org_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 30
    },
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^org_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The role now held.
  string role = 3 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "member"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: [
        "admin",
        "member",
        "guest"
      ]
    }
  ];

  // True when the caller was already in the workspace and nothing changed.
  //
  // A SUCCESS, not an error: the inviter's intent was already satisfied, and
  // reporting a conflict would make a second click of one link look like a
  // failure (workspace.md §5).
  bool already_member = 4;
}

// RevokeInvitationRequest withdraws an outstanding invitation.
message RevokeInvitationRequest {
  // Which workspace. Read by the authz gate, which asks for `admin` on THIS
  // object.
  string workspace_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ws_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 29
    },
    (buf.validate.field).string = {
      max_len: 29
      pattern: "^ws_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Which invitation.
  string invitation_id = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "inv_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 30
    },
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^inv_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];
}

// RevokeInvitationResponse reports what the withdrawal returned.
message RevokeInvitationResponse {
  // Whether a seat went back to the pool.
  //
  // False when issuing took none — the invitee was already in the organization,
  // and revoking an invitation to somebody who is already there frees nothing.
  bool seat_released = 1;
}

// ResendInvitationRequest issues a fresh link for an outstanding invitation.
message ResendInvitationRequest {
  // Which workspace. Read by the authz gate, which asks for `admin` on THIS
  // object.
  string workspace_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ws_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 29
    },
    (buf.validate.field).string = {
      max_len: 29
      pattern: "^ws_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Which invitation.
  string invitation_id = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "inv_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 30
    },
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^inv_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];
}

// ResendInvitationResponse reports the new window.
//
// It carries NO TOKEN, for the reason InviteToWorkspaceResponse does not: the
// link is a credential and the only party entitled to it is the person at the
// address.
message ResendInvitationResponse {
  // When the new link stops working.
  google.protobuf.Timestamp expires_at = 1;
}

// DeclineInvitationRequest refuses an invitation.
message DeclineInvitationRequest {
  // The token from the link.
  string token = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}
      max_length: 43
    },
    (buf.validate.field).string = {
      len: 43
      pattern: "^[A-Za-z0-9_-]{43}$"
    }
  ];
}

// DeclineInvitationResponse is empty.
//
// Deliberately: the reply is identical whether the token was real, already spent
// or never existed. A response that distinguished them would let anybody holding
// a guess learn they had guessed a live invitation — and would tell somebody
// with an old mail whether the organization still exists.
message DeclineInvitationResponse {}

// ListWorkspaceInvitationsRequest asks for one page of a workspace's
// invitations.
message ListWorkspaceInvitationsRequest {
  // Which workspace. Read by the authz gate, which asks for `admin` on THIS
  // object — an invitation list names who has been asked to join, which is not
  // a member's business.
  string workspace_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ws_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 29
    },
    (buf.validate.field).string = {
      max_len: 29
      pattern: "^ws_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Which invitations to list. Empty means `pending`, which is what an admin
  // screen almost always wants — settled invitations are history.
  string status = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "pending"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: [
        "",
        "pending",
        "accepted",
        "revoked",
        "expired",
        "declined",
        "undeliverable"
      ]
    }
  ];

  // How many to return. Zero takes the default; an oversized request is CLAMPED
  // rather than refused, which is why the maximum is published and not enforced
  // (CONVENTIONS §7.2).
  int32 page_size = 3 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "50"}
      maximum: 200
    },
    (buf.validate.field).int32.gte = 0
  ];

  // An opaque cursor from a previous response. Empty starts at the beginning.
  //
  // Bound to the query that produced it: a token presented against a different
  // list is an ERROR rather than a silent restart, because a client handed page
  // one for a token it believes points into the middle walks the list forever
  // with nothing in the loop looking like a failure.
  string page_token = 4 [
    (gnostic.openapi.v3.property) = {example: {yaml: "PLACEHOLDER-opaque-cursor-from-a-previous-response"}},
    (buf.validate.field).string = {
      max_len: 1024
      pattern: "^[A-Za-z0-9_-]*$"
    }
  ];
}

// WorkspaceInvitation is one entry in the invitation list.
//
// It carries the invitee's PSEUDONYM and no address. Rendering the list to a
// human needs the address, and the vault resolves it at read time under the key
// erasure destroys — putting it here would make every cached response a place
// personal data lives (ADR-002).
message WorkspaceInvitation {
  // The invitation's public id, and what Revoke and Resend name.
  string invitation_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "inv_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 30
    },
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^inv_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The invitee's pseudonym. The address lives in the vault under it.
  string subject_id = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "subj_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 31
    },
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^subj_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Who issued it.
  string invited_by = 3 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "subj_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 31
    },
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^subj_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The role they would join with.
  string role = 4 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "member"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: [
        "admin",
        "member",
        "guest"
      ]
    }
  ];

  // Where it sits in the lifecycle.
  string status = 5 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "pending"}
      max_length: 16
    },
    (buf.validate.field).string = {
      max_len: 16
      in: [
        "pending",
        "accepted",
        "revoked",
        "expired",
        "declined",
        "undeliverable"
      ]
    }
  ];

  // When the link stops working. Moves on a resend.
  google.protobuf.Timestamp expires_at = 6;

  // When it was issued.
  google.protobuf.Timestamp issued_at = 7;
}

// ListWorkspaceInvitationsResponse is one page.
message ListWorkspaceInvitationsResponse {
  // The page, oldest deadline first — the order somebody chasing them wants.
  repeated WorkspaceInvitation invitations = 1 [(buf.validate.field).repeated.max_items = 200];

  // Empty on the last page.
  string next_page_token = 2 [
    (gnostic.openapi.v3.property) = {example: {yaml: "PLACEHOLDER-opaque-cursor-for-the-next-page"}},
    (buf.validate.field).string = {
      max_len: 1024
      pattern: "^[A-Za-z0-9_-]*$"
    }
  ];
}

// CreateTeamRequest opens a team inside a workspace.
message CreateTeamRequest {
  // Which workspace. Read by the authz gate, which asks for `admin` on THIS
  // object.
  string workspace_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "ws_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 29
    },
    (buf.validate.field).string = {
      max_len: 29
      pattern: "^ws_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The display name people read.
  //
  // It carries no meaning to the access engine, which knows a team only by its
  // id — so a rename is invisible to every tuple naming the team.
  string name = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "Engineering"}
      max_length: 60
      pattern: "^\\S(.*\\S)?$"
    },
    (buf.validate.field).string = {
      min_len: 1
      max_len: 60
      pattern: "^\\S(.*\\S)?$"
    }
  ];
}

// CreateTeamResponse names what was created.
message CreateTeamResponse {
  // The team's public id, a prefixed ULID (ADR-030).
  //
  // It is NEVER REUSED, and that is load-bearing rather than tidy: grants target
  // `team:x#member`, so a recreated id would silently inherit the deleted team's
  // access (access.md §7.5).
  string team_id = 1 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "team_01ARZ3NDEKTSV4RRFFQ69G5FAV"}
      max_length: 31
    },
    (buf.validate.field).string = {
      max_len: 31
      pattern: "^team_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The name as stored, which is the trimmed form of what was sent.
  string name = 2 [
    (gnostic.openapi.v3.property) = {
      example: {yaml: "Engineering"}
      max_length: 60
      pattern: "^\\S(.*\\S)?$"
    },
    (buf.validate.field).string = {
