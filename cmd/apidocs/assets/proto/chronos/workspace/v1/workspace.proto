// WorkspaceService is the collaboration surface.
service WorkspaceService {
  // CreateWorkspace opens a workspace in the caller's organization.
  //
  // # It runs the whole pipeline, in order
  //
  // organization.md §6: authz (org `admin`) -> subscription (`grow`, so blocked
  // outside Trialing and Active) -> entitlement (`workspaces.count` reserved) ->
  // handler. This is the first RPC in the system to declare an entitlement, and
  // therefore the first that gate 4 has ever run for.
  //
  // The `grow` class matters as much as the entitlement: a past-due organization
  // is refused here while its existing workspaces keep working, which is
  // organization.md §5.2's rule that growth stops before work does.
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "organization"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_GROW;
    option (chronos.options.v1.entitlement) = "workspaces.count";

    // A MUTATION, so it carries an Idempotency-Key. The header is described
    // once, in proto/openapi.base.yaml's components, and every operation that
    // requires it references that one description.
    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // AddWorkspaceMember puts an existing account into a workspace.
  //
  // # `admin` on the WORKSPACE, not on the organization
  //
  // The authz gate reads `workspace_id` from the request and asks about that
  // object. An org admin still passes, through the `parent` edge that
  // `CreateWorkspace` writes (organization.md §5.1) — but a workspace admin who
  // administers nothing else passes too, which is the point of the edge.
  //
  // # GROW, because it may consume a seat
  //
  // May, not will. A seat is per person per ORGANIZATION, so somebody joining
  // their second workspace consumes nothing (workspace.md §2). That is why this
  // method declares no `(chronos.options.v1.entitlement)`: gate 4 reserves
  // unconditionally, and reserving here would take a seat from somebody who
  // already holds one, every time they joined another workspace. The reservation
  // is conditional and therefore belongs in the handler, which is the only place
  // that can ask "is this person already in this organization".
  //
  // The response reports `seat_consumed` so a caller adding people in bulk can
  // see which of them were billable.
  rpc AddWorkspaceMember(AddWorkspaceMemberRequest) returns (AddWorkspaceMemberResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_GROW;

    // A MUTATION, so it carries an Idempotency-Key.
    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // RemoveWorkspaceMember takes an account out of a workspace.
  //
  // # WRITE, not GROW
  //
  // Removal returns capacity rather than taking it, so gating it at GROW would
  // stop a past-due organization from reducing what it owes — which is the
  // opposite of what organization.md §5.2 is for.
  //
  // # The last admin cannot be removed
  //
  // A workspace with no admin is unadministrable and no event can fix it from
  // the outside, so the aggregate refuses rather than recording it. The refusal
  // is FAILED_PRECONDITION: the request is well formed and the caller is
  // permitted, and the state is what says no.
  //
  // The seat goes back only when this was the person's LAST membership in the
  // organization. `seat_released` reports which happened.
  rpc RemoveWorkspaceMember(RemoveWorkspaceMemberRequest) returns (RemoveWorkspaceMemberResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    // A MUTATION, so it carries an Idempotency-Key.
    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // ChangeWorkspaceMemberRole promotes or demotes an existing member.
  //
  // # GROW, because a promotion can cross seat pools
  //
  // Guest seats and member seats are independent limits (ADR-027), so moving
  // somebody from `guest` to `member` releases one and takes the other. The new
  // seat is taken BEFORE the old one is returned, so a promotion into a full
  // pool fails visibly instead of leaving the person holding neither.
  //
  // A change within one pool — `member` to `admin` — costs nothing and is still
  // GROW, because the class is a property of the method and not of the argument.
  rpc ChangeWorkspaceMemberRole(ChangeWorkspaceMemberRoleRequest) returns (ChangeWorkspaceMemberRoleResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_GROW;

    // A MUTATION, so it carries an Idempotency-Key.
    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // InviteToWorkspace invites an address into a workspace.
  //
  // # GROW, and it consumes the seat NOW
  //
  // workspace.md §5: the seat is reserved at ISSUE and not at acceptance.
  // Reserving at acceptance means 60 pending invitations against 50 seats all
  // look valid, and the 51st person to click their link is refused for something
  // somebody else did.
  //
  // The reservation is still CONDITIONAL — somebody already in the organization
  // holds a seat, and inviting them into another workspace costs nothing — which
  // is why this declares no `(chronos.options.v1.entitlement)`: gate 4 reserves
  // unconditionally, and would charge a second seat every time.
  //
  // # The address goes no further than the vault
  //
  // It is the one piece of personal data on this service's wire. The event
  // carries a keyed blind index and a pseudonym; the mail resolves the real
  // address from the vault at send time (ADR-002).
  //
  // # The response carries no link
  //
  // The token is a credential and the only party entitled to it is the person at
  // the address. Returning it here would hand it to the inviter, who could then
  // accept as somebody else.
  rpc InviteToWorkspace(InviteToWorkspaceRequest) returns (InviteToWorkspaceResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_GROW;

    // A MUTATION, so it carries an Idempotency-Key.
    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // AcceptInvitation redeems an invitation link.
  //
  // # Self-scoped, because the caller is not in the organization yet
  //
  // Every other org-scoped RPC gets its tenant from gate 1, which verifies
  // membership. The person clicking this link has none — joining is what they
  // are doing — so there is nothing for gate 1 to resolve and nothing for gate 2
  // to check. The TOKEN is the authorization: a 256-bit capability this system
  // issued and stored, which names the organization only after the handler has
  // looked it up.
  //
  // So the checks gates 1 and 3 would have made move into the handler, and
  // workspace.md §5 lists all five: the token is valid and unspent, the
  // organization still permits growth, the workspace is still active, the caller
  // is the person it was sent to, and a seat is still available. Every one is
  // revalidated at redemption rather than trusted from issue time, because days
  // pass and organizations stop paying.
  //
  // # It consumes no quota of its own
  //
  // The seat was taken at issue. Declaring an entitlement here would charge a
  // second one for the same person, which is the mistake charging at issue
  // exists to avoid.
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse) {
    option (chronos.options.v1.authz) = {
      relation: "self"
      resource_type: "user"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    // A MUTATION, so it carries an Idempotency-Key.
    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // RevokeInvitation withdraws an outstanding invitation.
  //
  // WRITE, not GROW: a revocation returns capacity rather than taking it, so
  // gating it at GROW would stop a past-due organization from reducing what it
  // owes — the opposite of what organization.md §5.2 is for.
  //
  // The seat comes back if issuing took one, and every outstanding link for the
  // invitation dies. Both matter: a revocation that left the link live is not a
  // revocation, and one that left the seat held charges for somebody who will
  // never arrive.
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // ResendInvitation issues a fresh link and extends the window.
  //
  // # The old link stops working
  //
  // Every outstanding digest for the invitation is dropped before the new one is
  // stored, so exactly one link is live afterwards. Without that, a resent
  // invitation has two live credentials and either can be redeemed — which is
  // the "old token stays dead" rule in workspace.md §5 read backwards.
  //
  // # It is the SAME invitation
  //
  // Same id, same seat, same authorisation: only the credential and the deadline
  // change. Re-inviting instead would take a second seat for one person and lose
  // the link to the original.
  //
  // GROW rather than WRITE, because a resend is how an organization keeps
  // pursuing a seat it is holding — it should stop when growth stops.
  rpc ResendInvitation(ResendInvitationRequest) returns (ResendInvitationResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_GROW;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // DeclineInvitation refuses an invitation.
  //
  // # Public, because the person declining may have no account
  //
  // Most invitations go to people who have never used this system. Requiring
  // them to register in order to say no would be absurd, and it would mean the
  // seat stays held until expiry for everybody who is not interested — which is
  // the case a decline exists to shorten.
  //
  // The TOKEN is the authorization, exactly as it is for acceptance: 256 bits
  // from crypto/rand that exist only in the recipient's mail. Nothing here
  // grants anything — a decline can only release a seat and kill a link — so
  // there is no privilege for a stolen token to escalate.
  //
  // Distinct from a revocation, and the distinction is not cosmetic: re-inviting
  // somebody who declined is a decision a human should make deliberately, while
  // re-inviting after an accidental revocation is routine.
  rpc DeclineInvitation(DeclineInvitationRequest) returns (DeclineInvitationResponse) {
    option (chronos.options.v1.public) = true;
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    option (gnostic.openapi.v3.operation) = {
      security: [{}]
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // ListWorkspaceInvitations returns one page of a workspace's invitations.
  //
  // `admin` on the WORKSPACE, because the list names who has been asked to join
  // and that is not a member's business — an ordinary member seeing pending
  // invitations learns who the organization is hiring.
  //
  // READ, so it is permitted in every organization state including Suspended and
  // Closed: seeing what is outstanding is exactly what somebody winding an
  // organization down needs.
  rpc ListWorkspaceInvitations(ListWorkspaceInvitationsRequest) returns (ListWorkspaceInvitationsResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_READ;
  }

  // CreateTeam opens a team inside a workspace.
  //
  // # It costs no quota and no seat
  //
  // A team is a grouping of people who are ALREADY in the workspace and already
  // hold whatever seat their membership took. Creating one grants nobody
  // anything until something is shared with it — which is why this declares no
  // `(chronos.options.v1.entitlement)`.
  //
  // WRITE rather than GROW for the same reason: nothing here adds a person to
  // the organization, so there is nothing for the growth gate to stop.
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // RenameTeam changes a team's display name.
  //
  // It grants and revokes nothing: the access engine knows a team by its id, so
  // a rename is invisible to every tuple naming it.
  rpc RenameTeam(RenameTeamRequest) returns (RenameTeamResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // DeleteTeam ends a team.
  //
  // # Terminal, and the id is never reused
  //
  // access.md §7.5: grants target `team:x#member`, so a recreated id would
  // silently inherit the deleted team's access. There is deliberately no
  // RestoreTeam — restoring would BE reusing the id.
  rpc DeleteTeam(DeleteTeamRequest) returns (DeleteTeamResponse) {
    option (chronos.options.v1.authz) = {
      relation: "admin"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // ListTeams returns one page of a workspace's teams.
  //
  // `member` on the workspace, not `admin`: a team is a grouping of colleagues
  // and knowing which ones exist is ordinary collaboration, unlike the
  // invitation list — which names who has been ASKED to join and is not a
  // member's business.
  //
  // READ, so it is permitted in every organization state including Suspended and
  // Closed.
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse) {
    option (chronos.options.v1.authz) = {
      relation: "member"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_READ;
  }

  // AddTeamMember puts a workspace member into a team.
  //
  // # Why the gate asks for `member` and not `admin`
  //
  // workspace.md §6 requires that MAINTAINERS manage a team's membership without
  // being workspace admins — the people who know who belongs in a team are
  // usually not the people who administer the workspace. So the gate cannot ask
  // for `admin`, and the question it would have to ask instead is half in the
  // graph and half in an aggregate: "a maintainer of THIS team, or an admin".
  //
  // Maintainers are deliberately not in the graph. A `maintainer` relation would
  // need one tuple per maintainer per team, kept in step with the roster by a
  // projector, and the roster is already the aggregate's — a second copy that
  // lags the first.
  //
  // So the gate bounds this to the tenant by requiring workspace membership, and
  // the handler takes the real decision against the aggregate, where it is not
  // eventually consistent.
  //
  // # The subject must ALREADY be a workspace member
  //
  // A team groups people who are here; it is never a way in. Adding a non-member
  // is refused rather than implicitly admitting them, because admitting would
  // hand anybody who maintains a team a way to put a stranger in the workspace
  // with no invitation, no seat and no entitlement check.
  //
  // WRITE and not GROW for the same reason: nothing here adds a person to the
  // organization, so there is nothing for the growth gate to stop.
  rpc AddTeamMember(AddTeamMemberRequest) returns (AddTeamMemberResponse) {
    option (chronos.options.v1.authz) = {
      relation: "member"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // RemoveTeamMember takes somebody out of a team.
  //
  // It releases no seat: they are still a workspace member, and the seat belongs
  // to that membership.
  rpc RemoveTeamMember(RemoveTeamMemberRequest) returns (RemoveTeamMemberResponse) {
    option (chronos.options.v1.authz) = {
      relation: "member"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // AddTeamMaintainer grants somebody the right to manage a team.
  //
  // They must be a workspace member for the reason a team member must be: a
  // maintainer who is not in the workspace could add people to a team inside it
  // while having no standing there at all.
  rpc AddTeamMaintainer(AddTeamMaintainerRequest) returns (AddTeamMaintainerResponse) {
    option (chronos.options.v1.authz) = {
      relation: "member"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }

  // RemoveTeamMaintainer withdraws that right.
  //
  // NEVER the last one. A team with no maintainer cannot have its membership
  // managed by anybody who is not a workspace admin, and nothing outside the
  // team can appoint one — appointing is itself a maintainer's act. Refused with
  // CONFLICT: the request is well formed and the caller is permitted, and it is
  // the current state that says no.
  rpc RemoveTeamMaintainer(RemoveTeamMaintainerRequest) returns (RemoveTeamMaintainerResponse) {
    option (chronos.options.v1.authz) = {
      relation: "member"
      resource_type: "workspace"
      resource_id_field: "workspace_id"
    };
    option (chronos.options.v1.operation) = OPERATION_CLASS_WRITE;

    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {reference: {_ref: "#/components/schemas/idempotency-key"}}
          }
        }
      ]
    };
  }
}
