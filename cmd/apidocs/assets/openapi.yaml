            screen cannot come to show a factor the login refuses. An unset
            `lastUsedAt` is the INTERESTING value: this screen is really asked "is
            there something enrolled here that I did not enrol", and the answer is
            only credible if a method that has never been used says so.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.ListMethodsResponse'
              example:
                methods:
                  - credentialId: cred_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    kind: METHOD_KIND_PASSWORD
                    usable: true
                    addedAt: '2026-07-02T08:15:00Z'
                    enabledAt: '2026-07-02T08:15:00Z'
                    lastUsedAt: '2026-08-14T11:04:55Z'
