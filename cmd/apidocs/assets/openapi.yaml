  /chronos.identity.v1.IdentityService/Register:
    post:
      tags:
        - IdentityService
      summary: Register claims an address and creates the account that claims it.
      description: |-
        Public: the caller has no session and, by definition, no account. It is a
         WRITE rather than a GROW — a person is not a seat, and seats are consumed
         when an organization adds a member, not when a human being signs up.

         It sets NO PASSWORD and creates no credential of any kind. The account is
         unusable by everybody until the link mailed to the address is followed and
         VerifyEmail supplies one.

         The response is identical whether or not the address was free. See
         RegisterResponse.
      operationId: IdentityService_Register
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: "1"
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: "5000"
        - name: Idempotency-Key
          in: header
          required: true
          explode: false
          schema:
            $ref: '#/components/schemas/idempotency-key'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.RegisterRequest'
            example:
              email: ada@example.com
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            Accepted. The body is empty, and its emptiness is the feature: this
            response is identical whether or not the address was free, and the
            server pays the same cost either way, so neither content nor timing
            reveals whether an account exists. Render one sentence for both — "if
            that address can be registered, we have sent it a link".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.RegisterResponse'
              example: {}
      security: []
  /chronos.identity.v1.IdentityService/RequestAccountDeletion:
    post:
      tags:
        - IdentityService
      summary: |-
        RequestAccountDeletion asks for the caller's own account to be erased, and
         starts the grace period.
      description: |-
        # Nothing acts on it yet

         The request is appended to the account's stream and that is the whole
         behaviour. Erasure is the compliance domain's work — destroy the key, and the
         personal data becomes unreadable everywhere at once — and that module does not
         exist. Neither does the workflow that runs the grace period, the mail that
         names the date, nor a command to cancel. The account keeps working.

         This is stated on the RPC rather than only in a design document because a
         client that reads "deletion requested" as "account gone" will build a screen
         that lies to the person using it.

         # AAL2, plus a typed confirmation

         identity.md §2 lists account deletion among the operations that require
         step-up. The step-up proves WHO is asking; the `confirmation` field is what
         makes it hard to ask by accident, which matters here and nowhere else in this
         service, because nothing in this module undoes it.

         # It does not sign anybody out

         Every other destructive call here voids sessions. This one deliberately does
         not: the grace period exists so the person can change their mind, and signing
         them out of an account that still works teaches them the request took effect
         immediately, which it did not.
      operationId: IdentityService_RequestAccountDeletion
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: "1"
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: "5000"
        - name: Idempotency-Key
          in: header
          required: true
          explode: false
          schema:
            $ref: '#/components/schemas/idempotency-key'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.RequestAccountDeletionRequest'
            example:
              confirmation: DELETE
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            The request is recorded and `scheduledFor` is when erasure falls due.

            Nothing consumes it yet: the compliance domain that would perform the
            erasure does not exist, and neither does the workflow that would run the
            grace period or a command to cancel. The account keeps working, and every
            other endpoint keeps serving it.

            `changed` is false when a request was already outstanding, and
            `scheduledFor` is then the ORIGINAL deadline — a second request must not
            move a date the holder has already been given.

            No session is revoked by this call, deliberately: the grace period exists
            so the person can change their mind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.RequestAccountDeletionResponse'
              example:
                changed: true
                scheduledFor: '2026-09-19T08:15:00Z'
  /chronos.identity.v1.IdentityService/RequestPasswordReset:
    post:
      tags:
        - IdentityService
      summary: |-
        RequestPasswordReset sends a reset link to the address a registered account
         holds.
      description: |-
        Public, and the choice is forced rather than preferred: the population that
         needs this call is exactly the population that cannot sign in.

         The cost of being public is that it is an unauthenticated mail trigger
         pointed at a third party's mailbox, so it is rate limited on TWO axes before
         anything is looked up — per address, which bounds mail-bombing one victim,
         and per caller, which bounds an enumeration sweep. Both counters are
         consumed whether or not an account exists, so the ceiling itself is not an
         oracle. The per-address counter is the SAME one verification mail spends
         (NOTIFICATIONS.md §4: "an hourly ceiling per address across all classes"), so
         an attacker cannot double a victim's mail by alternating between the two
         endpoints.

         A WRITE: the successful path appends PasswordResetRequested to the account's
         stream, and the reset-mail issuer does the rest.
      operationId: IdentityService_RequestPasswordReset
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: "1"
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: "5000"
        - name: Idempotency-Key
          in: header
          required: true
          explode: false
          schema:
            $ref: '#/components/schemas/idempotency-key'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.RequestPasswordResetRequest'
            example:
              email: ada@example.com
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            Accepted. The body is empty, and its emptiness is the feature: this
            response is identical for an unknown address, a resettable account, a
            passwordless account, a deactivated account and a suspended one.
            Render one sentence for all five — "if that address has an account
            with a password, we have sent it a reset link".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.RequestPasswordResetResponse'
              example: {}
      security: []
  /chronos.identity.v1.IdentityService/ResendEmailVerification:
    post:
      tags:
        - IdentityService
      summary: |-
        ResendEmailVerification issues a new verification link for an address whose
         account has not proven it yet.
      description: |-
        Public, and the choice is forced rather than preferred. A Pending account
         can hold no session, so requiring one would make this call unavailable to
         every account that needs it — the endpoint would exist and serve nobody.

         The cost of being public is that it is an unauthenticated mail trigger
         pointed at a third party's mailbox, so it is rate limited on TWO axes before
         anything is looked up: per address, which bounds mail-bombing one victim, and
         per caller, which bounds an enumeration sweep. Both counters are consumed
         whether or not an account exists, so the ceiling itself is not an oracle.

         A WRITE: the successful path appends EmailVerificationRequested to the
         account's stream, and the verification reactor does the rest.
      operationId: IdentityService_ResendEmailVerification
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: "1"
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: "5000"
        - name: Idempotency-Key
          in: header
          required: true
          explode: false
          schema:
            $ref: '#/components/schemas/idempotency-key'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.ResendEmailVerificationRequest'
            example:
              email: ada@example.com
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.ResendEmailVerificationResponse'
      security: []
  /chronos.identity.v1.IdentityService/ResetPassword:
    post:
      tags:
        - IdentityService
      summary: ResetPassword redeems a reset link and replaces the account's password.
      description: |-
        Public: it is reached from a link in a mailbox, by a browser that has never
         authenticated. The token IS the authentication, and it is single-use.

         It grants NOTHING beyond the credential change. No session is created, no
         bearer token is returned, the second factor is untouched, and a Pending
         account is not activated — so a reset cannot be used to bypass the second
         factor (ASVS 5.0 V6.4.3). The caller's next act is an ordinary
         CreateSession.

         In the same request it voids every session for the account including any
         held by whoever is resetting, every outstanding token of every purpose, and
         any pending identifier change (identity.md §4.4, §4.5).
      operationId: IdentityService_ResetPassword
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: "1"
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: "5000"
        - name: Idempotency-Key
          in: header
          required: true
          explode: false
          schema:
            $ref: '#/components/schemas/idempotency-key'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.ResetPasswordRequest'
            example:
              token: PLACEHOLDER-not-a-real-reset-token
              password: PLACEHOLDER-not-a-real-password
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            The link was valid and has been spent. The account's password is the
            one just supplied, every session it had is gone, and every outstanding
            link of every kind is dead. The body is empty on purpose: a reset must
            not advance the caller towards a session, so there is no token, no
            assurance level and no account identifier here. Sign in normally next,
            presenting the account's second factor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.ResetPasswordResponse'
              example: {}
      security: []
  /chronos.identity.v1.IdentityService/RevokeAllSessions:
    post:
      tags:
        - IdentityService
      summary: |-
        RevokeAllSessions ends every live session on the caller's account, in one
         atomic append.
      description: |-
        AAL2, on the same argument as RevokeSession and more so: this is the
         account-wide version, so the denial of service an attacker could inflict
         with it is total.
      operationId: IdentityService_RevokeAllSessions
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: "1"
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: "5000"
        - name: Idempotency-Key
          in: header
          required: true
          explode: false
          schema:
            $ref: '#/components/schemas/idempotency-key'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.RevokeAllSessionsRequest'
            example:
              exceptSessionId: sess_01ARZ3NDEKTSV4RRFFQ69G5FAV
              reason: user_signed_out
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            Every live session on the account has ended, in one atomic append —
            "sign out everywhere" that half happened is worse than one that failed,
            because the user is told every device is signed out, one is not, and
            nothing in the system disagrees with them.

            `revoked` counts what this call ended; sessions already revoked or
            expired are not counted, because nothing was appended for them.
            `scanned` is how many live sessions the work list returned, the spared
            one included — reported so a client can tell "nothing to do" apart from
            "the list came back empty because it is broken".

            Send an empty `exceptSessionId` to spare nothing, which is what a
            compromise response needs: the party asking may be the attacker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.RevokeAllSessionsResponse'
              example:
                revoked: 3
                scanned: 4
  /chronos.identity.v1.IdentityService/RevokeSession:
    post:
      tags:
        - IdentityService
      summary: RevokeSession ends one of the caller's sessions.
      description: |-
        AAL2. Revocation is the control a person reaches for when they believe they
         are compromised, and it must not be usable BY the compromise: a
         single-factor session that could end sessions could sign the legitimate
         holder out of the device they are using to investigate.
      operationId: IdentityService_RevokeSession
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: "1"
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: "5000"
        - name: Idempotency-Key
          in: header
          required: true
          explode: false
          schema:
            $ref: '#/components/schemas/idempotency-key'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.RevokeSessionRequest'
            example:
              sessionId: sess_01ARZ3NDEKTSV4RRFFQ69G5FAV
              reason: user_signed_out
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            The session is no longer usable.

            `changed: false` means it was already revoked or already expired.
            Nothing was appended, and it is NOT an error: the caller wanted the
            session unusable, and it is.

            A request naming a session that is not the caller's own gets the same
            answer as one naming a session that does not exist — telling the two
            apart would turn the device list into a probe for which session ids
            exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.RevokeSessionResponse'
              example:
                changed: true
  /chronos.identity.v1.IdentityService/VerifyEmail:
    post:
      tags:
        - IdentityService
      summary: |-
        VerifyEmail proves control of an address, sets the account's first
         password, and makes the claim on the address permanent.
      description: |-
        Public: it is reached from a link in a mailbox, by a browser that has never
         authenticated. The token IS the authentication, and it is single-use.

         It is the ONLY call that can give a brand-new account a password, and that
         is the pre-hijacking defence: the credential is created by the party that
         has just proven the mailbox, in the same request as the proof.
      operationId: IdentityService_VerifyEmail
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: "1"
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: "5000"
        - name: Idempotency-Key
          in: header
          required: true
          explode: false
          schema:
            $ref: '#/components/schemas/idempotency-key'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.identity.v1.VerifyEmailRequest'
            example:
              token: PLACEHOLDER-not-a-real-verification-token
              password: PLACEHOLDER-not-a-real-password
              username: ada_lovelace
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            The token was valid and has been spent. Unlike registration this is
            not an existence oracle — presenting a valid single-use token IS proof
            of control over the address — so the caller is told whose account it
            belongs to. `changed: false` means a link clicked twice, or prefetched
            by a mail client; nothing was appended and it is not an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.identity.v1.VerifyEmailResponse'
              example:
                subjectId: subj_01ARZ3NDEKTSV4RRFFQ69G5FAV
                userId: usr_01ARZ3NDEKTSV4RRFFQ69G5FAV
                changed: true
      security: []
