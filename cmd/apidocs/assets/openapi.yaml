          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: |
            Every authentication method on the caller's account. Unpaginated, and
            that is a bounded claim rather than an oversight: an account holds at
            most one usable credential per kind, and there are five kinds.

            Nothing that verifies anything is here — no verifier, no sealed TOTP
            secret, no recovery-code digest. The consecutive-failure count is
            absent on its own merits: publishing it would tell whoever reaches this
            screen how many attempts remain before a factor locks.

