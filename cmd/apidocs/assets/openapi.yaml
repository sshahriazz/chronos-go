  /chronos.notification.v1.NotificationService/MarkNotificationsRead:
    post:
      tags:
        - NotificationService
      summary: MarkNotificationsRead dismisses items the caller has seen.
      description: |-
        It appends one `notification.Read.v1` event per item, atomically across
         every item's stream: a batch either lands whole or not at all, so a client
         never has to reconcile a half-dismissed screen.

         Marking is idempotent in the strongest sense available — the FIRST read
         time is kept, so a replay, a retry and a second device all leave the same
         answer to "when did they first see this", which is the question email
         arbitration asks (ADR-026).
      operationId: NotificationService_MarkNotificationsRead
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
