  /chronos.organization.v1.OrganizationService/CreateOrganization:
    post:
      tags:
        - OrganizationService
      summary: CreateOrganization opens an organization owned by the caller.
      description: |-
        # What makes this safe to retry

         The organization, the owner reservation and the slug reservation are written
         in ONE atomic append, each with a `NoStream` precondition. A retry with the
         same `Idempotency-Key` derives byte-identical event ids and is refused as a
         duplicate; a genuine second attempt loses the precondition and is refused as
         a `CONFLICT`. Neither leaves a half-created organization behind, because a
         failed multi-append writes nothing at all.

         # Why it is self-scoped

         There is no organization to check a permission against — this call is what
         brings one into existence. The only authorization question is "is there an
         authenticated person here", which the `self` relation answers locally
         without consulting the graph.

         A person may own ONE organization. A second attempt returns `CONFLICT`.
      operationId: OrganizationService_CreateOrganization
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: "1"
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: "5000"
        - name: Idempotency-Key
          in: header
          required: true
          explode: false
          schema:
            $ref: '#/components/schemas/idempotency-key'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chronos.organization.v1.CreateOrganizationRequest'
            example:
              name: Acme Corporation
              slug: acme
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chronos.organization.v1.CreateOrganizationResponse'
