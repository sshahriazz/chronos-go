syntax = "proto3";

// Package operator is the back-office wire contract — where WE see our
// customers (ADR-024, operator.md).
//
// # This surface is not published, and that is structural
//
// It lives in its own buf module, `proto-operator/`, rather than beside the
// tenant protos in `proto/`. The OpenAPI document, the error catalogue and the
// embedded reference are all generated from `proto/` alone, so no operator
// method can appear in the public REST reference — not because a filter drops
// it, but because the generator is never given the file.
//
// That matters more than it looks. A generated document listing
// `/chronos.operator.v1.OperatorService/ListCustomers` would advertise the
// existence and the exact shape of the cross-tenant surface to every reader of
// our public API docs, and an exclusion rule inside the generator is one
// refactor away from being dropped.
//
// # Every method here is dangerous by construction
//
// operator.md §1: this is "the only thing that deliberately breaks tenant
// isolation". There is no org context to scope a request by, no RLS policy
// behind the queries, and no OpenFGA object to check. What stands in their
// place is: a two-stage session that requires SSO *and* WebAuthn, a capability
// declared on every method and checked before the handler, an audit event
// appended before every answer, and read models whose columns cannot express
// customer content.
package chronos.operator.v1;

import "buf/validate/validate.proto";
import "chronos/operator/v1/options.proto";
import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Sign-in — SSO, then WebAuthn, in that order (operator.md §3)
// ---------------------------------------------------------------------------

// BeginSignInRequest starts the OIDC ceremony. It names nobody.
//
// Deliberately empty. A request that carried an email or an operator id would
// let an unauthenticated caller aim a ceremony at a chosen account, and would
// turn this endpoint into an oracle for "is this person an operator" — which is
// a question about our staff that the public internet should not be able to
// ask, even though this port is not on it.
message BeginSignInRequest {}

// BeginSignInResponse carries where to send the browser.
message BeginSignInResponse {
  // The IdP's authorization endpoint with state, nonce and the PKCE challenge
  // already attached.
  string authorization_url = 1 [
    (buf.validate.field).string = {
      max_len: 2048
      min_len: 1
    }
  ];

  // The ceremony's own id, echoed back on completion so the server can find the
  // state it stored. Single-use and short-lived.
  string ceremony_id = 2 [
    (buf.validate.field).string = {
      max_len: 40
      pattern: "^opsess_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // When the ceremony stops being usable. Minutes, not hours.
  google.protobuf.Timestamp expires_at = 3;
}

// CompleteSignInRequest carries the IdP's answer.
message CompleteSignInRequest {
  // The authorization code. Bounded generously because providers differ widely
  // and a code refused for length is a sign-in that fails with no useful
  // message.
  string code = 1 [
    (buf.validate.field).string = {
      max_len: 4096
      min_len: 1
    }
  ];

  // The opaque `state` the ceremony was started with, returned by the IdP.
  // Compared in constant time against what was stored.
  string state = 2 [
    (buf.validate.field).string = {
      max_len: 512
      min_len: 1
    }
  ];

  // RFC 9207's `iss`, when the provider sends it. Verified against the issuer
  // the ceremony was started for — the mix-up defence of RFC 9700 §4.4.2.
  string iss = 3 [(buf.validate.field).string.max_len = 512];
}

// CompleteSignInResponse carries a session that authorizes ONE thing.
//
// # It is not a usable session, and the naming says so
//
// The field is `pending_token`, never `token`. A client that treats this as a
// session will find every call refused, which is the intended lesson: SSO alone
// is one factor, and operator.md §3 requires two.
message CompleteSignInResponse {
  // Presented as the bearer for BeginWebAuthn and FinishWebAuthn. Nothing else
  // accepts it.
  string pending_token = 1 [
    (buf.validate.field).string = {
      max_len: 128
      min_len: 1
    }
  ];

  // Whether this operator holds an authenticator yet. False sends the client to
  // enrolment rather than to assertion — the bootstrap window a freshly
  // provisioned operator passes through exactly once.
  bool credential_enrolled = 2;

  // When the pending token stops working. Short: it is the window between two
  // steps of one sign-in, not a session.
  google.protobuf.Timestamp expires_at = 3;
}

// BeginWebAuthnRequest starts the second factor. It names nobody either.
//
// Who is signing in is already known — it came from the SSO step and is bound
// to the pending token. A request field naming an operator would be a field the
// caller could change.
message BeginWebAuthnRequest {}

// BeginWebAuthnResponse carries the ceremony options for the browser.
message BeginWebAuthnResponse {
  // `PublicKeyCredentialRequestOptions` or `PublicKeyCredentialCreationOptions`
  // as JSON, depending on `enrolment`. One field rather than two because the
  // browser passes whichever it received straight to `navigator.credentials`,
  // and a client that had to pick between two fields is a client that can pick
  // wrong.
  string options_json = 1 [
    (buf.validate.field).string = {
      max_len: 16384
      min_len: 1
    }
  ];

  // True when this is a REGISTRATION rather than an assertion — the operator
  // has no credential yet.
  bool enrolment = 2;

  // The ceremony this challenge belongs to, echoed back on finish.
  string ceremony_id = 3 [
    (buf.validate.field).string = {
      max_len: 40
      pattern: "^opsess_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];
}

// FinishWebAuthnRequest carries the authenticator's answer.
message FinishWebAuthnRequest {
  // The credential the browser produced, as JSON.
  string credential_json = 1 [
    (buf.validate.field).string = {
      max_len: 16384
      min_len: 1
    }
  ];

  // The ceremony this answer belongs to, from BeginWebAuthn.
  string ceremony_id = 2 [
    (buf.validate.field).string = {
      max_len: 40
      pattern: "^opsess_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // A label for a newly enrolled authenticator, so a security screen can say
  // "YubiKey 5" rather than a base64 blob. Ignored on assertion.
  string label = 3 [(buf.validate.field).string.max_len = 64];
}

// FinishWebAuthnResponse carries the session that actually works.
message FinishWebAuthnResponse {
  // The bearer token. Returned once and never stored in plaintext.
  string token = 1 [
    (buf.validate.field).string = {
      max_len: 128
      min_len: 1
    }
  ];

  // Who signed in.
  string operator_id = 2 [
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^opr_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The role this session carries. Sent so the console can hide what the
  // operator cannot do — a convenience, never the enforcement, which happens
  // server-side on every call.
  string role = 3 [(buf.validate.field).string.max_len = 32];

  // ABSOLUTE, and never moved. There is no refresh endpoint, deliberately:
  // operator.md §3 requires sessions to be non-extendable, and an extension
  // path is what turns "thirty minutes" into a working day.
  google.protobuf.Timestamp expires_at = 4;
}

// SignOutRequest ends the caller's own session. It names no session.
//
// The session is the bearer being presented, and accepting an id would make
// this "end a session" rather than "end my session" — a different, more
// dangerous endpoint that needs a capability this one does not.
message SignOutRequest {}

// SignOutResponse reports the state after the call.
message SignOutResponse {
  // False means the session was already over, which is a success: the caller
  // asked for a state that holds.
  bool changed = 1;
}

// ---------------------------------------------------------------------------
// The customer directory (operator.md §2, §9)
// ---------------------------------------------------------------------------

// ListCustomersRequest pages the directory.
message ListCustomersRequest {
  // A substring of the organization's name or slug. Matched
  // case-insensitively.
  string query = 1 [(buf.validate.field).string.max_len = 128];

  // Restrict to one lifecycle state — "active", "past_due", "suspended",
  // "closed". Empty means every state.
  string lifecycle_state = 2 [
    (buf.validate.field).string = {
      max_len: 16
      pattern: "^$|^(active|past_due|suspended|closed)$"
    }
  ];

  // Page size. Bounded above because this endpoint reads across every tenant we
  // have, and an unbounded page is a bulk export of the customer base — which
  // operator.md §2 lists as explicitly out of scope.
  int32 page_size = 3 [
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    }
  ];

  // The opaque cursor from a previous response.
  string page_token = 4 [(buf.validate.field).string.max_len = 512];
}

// Customer is one organization, as the operator plane sees it.
//
// Every field is org-level. There is no member list, no address, no workspace
// name and no content — the projection behind this message has no such columns,
// which is what makes minimisation structural rather than a promise about this
// message's future (operator.md §4).
message Customer {
  // The organization.
  string org_id = 1 [
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^org_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The organization's own name and slug — tenant-provided business data, not
  // vault data.
  string org_name = 2 [(buf.validate.field).string.max_len = 200];

  // The URL-safe handle the tenant chose.
  string slug = 3 [(buf.validate.field).string.max_len = 64];

  // "active", "past_due", "suspended" or "closed".
  string lifecycle_state = 4 [(buf.validate.field).string.max_len = 16];

  // The plan they are on, and the exact version of it. The version matters
  // because a plan's allowances change between versions and a support question
  // is nearly always about the one they actually hold.
  string plan_id = 5 [(buf.validate.field).string.max_len = 64];

  // The plan version, which is what entitlement actually reads.
  string plan_version_id = 6 [(buf.validate.field).string.max_len = 30];

  // Stripe's subscription status, mirrored. Empty for an org that has not
  // reached a subscription yet.
  string subscription_status = 7 [(buf.validate.field).string.max_len = 32];
  // When a trial ends. Unset when there is no trial.
  google.protobuf.Timestamp trial_ends_at = 8;

  // Coarse aggregates only (operator.md §2: "minimal activity").
  int32 workspace_count = 9 [(buf.validate.field).int32.gte = 0];
  // Distinct people across the organization — a SEAT count, not a sum of
  // memberships. Five workspaces and one person is one (workspace.md §2).
  int32 member_count = 10 [(buf.validate.field).int32.gte = 0];

  // The most recent activity anywhere in the organization. Coarse by design:
  // per-user activity is out of scope (operator.md §2).
  google.protobuf.Timestamp last_active_at = 11;

  // Where they came from, when it was recorded.
  string signup_source = 12 [(buf.validate.field).string.max_len = 64];

  // Support context: "is this org suspended, why, and since when".
  // When the suspension began. Unset when the org is not suspended.
  google.protobuf.Timestamp suspended_at = 13;

  // Why it was suspended, so a support answer does not begin with a guess.
  string suspension_reason = 14 [(buf.validate.field).string.max_len = 256];

  // When the organization was created.
  google.protobuf.Timestamp created_at = 15;

  // The organization owner's PSEUDONYM, and the only identifier in this
  // message that names a person.
  //
  // # Why it is here, and why it is the only one
  //
  // Without it the directory names nobody, and RevealPersonalData — which takes
  // a subject — is reachable only by an operator who already knows a pseudonym.
  // In practice that meant reading one out of the database by hand, which has no
  // justification, no audit entry and no bound on how many subjects it returns.
  // An access control that is unusable is not a strict one; it is one people
  // work around, and the workaround was strictly worse than the endpoint.
  //
  // The OWNER and nobody else, because operator.md §2 draws the line in its own
  // exclusion: out of scope are "member email addresses BEYOND THE ORG OWNER'S".
  // A second subject here would be the member list §2 excludes.
  //
  // It resolves to nothing on its own. Turning it into an address still needs
  // RevealPersonalData, with a justification and an audit entry written first.
  string owner_subject_id = 16 [
    (buf.validate.field).string = {
      max_len: 32
      pattern: "^$|^subj_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];
}

// ListCustomersResponse is one page of the directory.
message ListCustomersResponse {
  // The page, in creation order, newest first.
  repeated Customer customers = 1 [(buf.validate.field).repeated.max_items = 100];

  // Empty on the last page.
  string next_page_token = 2 [(buf.validate.field).string.max_len = 512];
}

// GetCustomerRequest names one organization.
message GetCustomerRequest {
  // The organization to read.
  string org_id = 1 [
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^org_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];
}

// GetCustomerResponse is one organization's record.
message GetCustomerResponse {
  // The organization's record.
  Customer customer = 1;
}

// ---------------------------------------------------------------------------
// Personal data (operator.md §4, §5)
// ---------------------------------------------------------------------------

// RevealPersonalDataRequest resolves ONE subject's vault fields.
//
// # Every field here exists to make the access narrow and attributable
//
// One subject, named fields, and a justification. The alternative shapes were
// all rejected for the same reason: a request that could name several subjects,
// or that defaulted to every field, or that had no reason, is a request whose
// audit entry says less than the access did.
message RevealPersonalDataRequest {
  // The subject's pseudonym, as it appears in the operator plane's own records.
  // Never an email: an endpoint that took an address would let an operator ask
  // "does this person exist here", which is a different disclosure.
  string subject_id = 1 [
    (buf.validate.field).string = {
      max_len: 32
      pattern: "^subj_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Which vault fields to resolve. Required and bounded — an empty list would
  // have to mean "everything", and "everything" is the default that makes a
  // justified-access rule meaningless.
  repeated string fields = 2 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 8
      items: {
        string: {
          max_len: 32
          pattern: "^[a-z][a-z0-9_]*$"
        }
      }
    }
  ];

  // The tenant this access is performed in the context of, so the tenant can be
  // shown their own operator-access history.
  string org_id = 3 [
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^org_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Why. Mandatory, and stored verbatim in the audit log.
  //
  // The minimum length is 8 rather than 1 on purpose: a one-character
  // justification is the shape a mandatory field takes when nobody means it,
  // and a rule that can be satisfied by "x" is a rule that will be.
  string reason = 4 [
    (buf.validate.field).string = {
      min_len: 8
      max_len: 500
    }
  ];
}

// RevealPersonalDataResponse carries the resolved values.
message RevealPersonalDataResponse {
  // Field name to value, for the fields that resolved. A field the vault does
  // not hold is ABSENT rather than empty — the two are different answers, and
  // the notification path already depends on telling them apart.
  map<string, string> fields = 1 [
    (buf.validate.field).map = {
      max_pairs: 8
      values: {
        string: {max_len: 512}
      }
    }
  ];

  // The audit entry this access produced. Returned so the operator can see that
  // it happened, and quote it — an audit trail somebody can point at is one
  // they believe in.
  string audit_entry_id = 2 [
    (buf.validate.field).string = {
      max_len: 32
      pattern: "^audit_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];
}

// ---------------------------------------------------------------------------
// Break-glass elevation (operator.md §5)
// ---------------------------------------------------------------------------

// RequestElevationRequest asks for one capability, for a short while, with a
// reason.
message RequestElevationRequest {
  // The single capability to take. One, never a list: an elevation granting
  // several would be a role change with a timer, and the audit entry would not
  // say which of them was actually needed.
  string capability = 1 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 32
      pattern: "^[a-z][a-z0-9_]*$"
    }
  ];

  // Why. Mandatory, stored verbatim, and eight characters minimum for the same
  // reason RevealPersonalData's is: a rule that can be satisfied by "x" is a
  // rule that will be.
  string reason = 2 [
    (buf.validate.field).string = {
      min_len: 8
      max_len: 500
    }
  ];
}

// RequestElevationResponse reports the window that was opened.
message RequestElevationResponse {
  // The capability granted, echoed so a console cannot show one thing while the
  // server granted another.
  string capability = 1 [(buf.validate.field).string.max_len = 32];

  // When the window closes. ABSOLUTE, and nothing extends it — there is no
  // renew endpoint, deliberately. A second break-glass is a second event with
  // its own justification and its own alert, which is what keeps the alert
  // worth reading.
  google.protobuf.Timestamp expires_at = 2;

  // The audit entry this elevation produced, so the operator can quote it.
  string audit_entry_id = 3 [
    (buf.validate.field).string = {
      max_len: 32
      pattern: "^audit_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];
}

// ---------------------------------------------------------------------------
// Operator account management (operator.md §3, §7)
// ---------------------------------------------------------------------------

// Operator is one employee's access to this plane.
//
// # No address, and that is not an omission
//
// An operator is identified here by their id, their pseudonym and their IdP
// binding. Their work address is personal data (§5's retention rule is why it
// matters: audit records outlive employment), and this plane holds none — it
// stores pseudonyms so the trail survives an erasure.
//
// A display name, if a console wants one, comes from RevealPersonalData like
// any other — one subject, a justification, an audit entry. The same rule that
// governs looking up a customer governs looking up a colleague.
message Operator {
  // The operator's id.
  string operator_id = 1 [
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^opr_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Their vault pseudonym. What every audit entry about them carries, and what
  // makes those entries non-identifying after an erasure.
  string subject_id = 2 [
    (buf.validate.field).string = {
      max_len: 32
      pattern: "^subj_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The IdP that authenticates them.
  string issuer = 3 [(buf.validate.field).string.max_len = 512];

  // The provider's immutable subject for them — what sign-in matches on, and
  // never an address (identity.md §7 rule 5).
  string provider_subject = 4 [(buf.validate.field).string.max_len = 255];

  // One of support, billing_ops, catalogue_admin, operator_admin.
  string role = 5 [(buf.validate.field).string.max_len = 32];

  // When they were offboarded. Unset means their access is live.
  google.protobuf.Timestamp disabled_at = 6;

  // When they were granted access.
  google.protobuf.Timestamp provisioned_at = 7;
}

// ProvisionOperatorRequest grants an employee access to this plane.
message ProvisionOperatorRequest {
  // The IdP issuer. Named per operator rather than assumed global, because it
  // is what a second IdP would vary.
  string issuer = 1 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 512
    }
  ];

  // The provider's immutable subject — Google's `sub`.
  //
  // NEVER an address. An identifier that can change is not an identity, and
  // matching on the address is the takeover identity.md §7 rule 5 exists to
  // prevent — which applies to our own staff exactly as it does to a tenant.
  //
  // Whoever provisions somebody reads this from the IdP's admin console; on a
  // laptop, `internal/tools/oidcsubject` obtains it from the person themselves.
  string provider_subject = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }
  ];

  // The role to grant. Least privilege is the caller's job, not this field's —
  // but the plane refuses a role it cannot evaluate rather than granting one
  // that silently does nothing.
  string role = 3 [
    (buf.validate.field).string = {
      max_len: 32
      pattern: "^(support|billing_ops|catalogue_admin|operator_admin)$"
    }
  ];
}

// ProvisionOperatorResponse names the operator that was created.
message ProvisionOperatorResponse {
  // Their new id.
  string operator_id = 1 [
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^opr_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Their new pseudonym.
  string subject_id = 2 [
    (buf.validate.field).string = {
      max_len: 32
      pattern: "^subj_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The audit entry this grant produced.
  string audit_entry_id = 3 [
    (buf.validate.field).string = {
      max_len: 32
      pattern: "^audit_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];
}

// ChangeOperatorRoleRequest moves an operator to a different role.
message ChangeOperatorRoleRequest {
  // Who to change. An operator may not name THEMSELVES — the aggregate refuses
  // it, because an operator_admin holds the capability to manage operators and
  // nothing in the capability table would otherwise stop them raising
  // themselves.
  string operator_id = 1 [
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^opr_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // The role to move them to.
  string role = 2 [
    (buf.validate.field).string = {
      max_len: 32
      pattern: "^(support|billing_ops|catalogue_admin|operator_admin)$"
    }
  ];
}

// ChangeOperatorRoleResponse reports the state after the call.
message ChangeOperatorRoleResponse {
  // False means they already held that role, which is a success: the caller
  // asked for a state that holds, and an event saying "support became support"
  // would be noise in the stream an escalation alert reads.
  bool changed = 1;

  // The audit entry, when this call changed anything.
  string audit_entry_id = 2 [
    (buf.validate.field).string = {
      max_len: 32
      pattern: "^$|^audit_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];
}

// DisableOperatorRequest offboards an operator.
message DisableOperatorRequest {
  // Who to offboard. SELF IS PERMITTED here, unlike a role change: an operator
  // locking themselves out is not an escalation, and a suspected-compromise
  // path where the person who noticed must first find an admin costs minutes at
  // the worst possible time.
  string operator_id = 1 [
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^opr_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];
}

// DisableOperatorResponse reports the state after the call.
message DisableOperatorResponse {
  // False means they were already offboarded.
  bool changed = 1;

  // How many live sessions were ended by this call.
  //
  // Returned because "offboarding is immediate and verified" (operator.md §3),
  // and this number is the verification — an offboarding that ended no sessions
  // when the person was signed in is one that did not take effect.
  int32 sessions_ended = 2 [(buf.validate.field).int32.gte = 0];

  // The audit entry, when this call changed anything.
  string audit_entry_id = 3 [
    (buf.validate.field).string = {
      max_len: 32
      pattern: "^$|^audit_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];
}

// ListOperatorsRequest asks who may use this plane.
message ListOperatorsRequest {
  // Include operators who have been offboarded. False by default: the ordinary
  // question is "who has access", and an offboarded operator is kept for the
  // audit trail rather than for the roster.
  bool include_disabled = 1;
}

// ListOperatorsResponse is everyone with access.
message ListOperatorsResponse {
  // The operators, oldest first.
  //
  // Unpaged, and bounded at a hundred. Operators are our own staff and there
  // are tens of them, not thousands — a cursor here would be machinery for a
  // scale this list does not reach. The ceiling is what stops that assumption
  // failing silently: a hundredth operator is a signal that the assumption
  // needs revisiting, not a page that quietly truncates.
  repeated Operator operators = 1 [(buf.validate.field).repeated.max_items = 100];
}

// ---------------------------------------------------------------------------
// Tenant writes (operator.md §7)
// ---------------------------------------------------------------------------

// SuspendCustomerRequest switches a tenant off.
message SuspendCustomerRequest {
  // The organization to suspend.
  string org_id = 1 [
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^org_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Why. Mandatory, stored verbatim in the audit log, and NOT sent to the
  // tenant.
  //
  // The mail they receive says the account was suspended by us and nothing
  // more. A suspension we decide on is usually about abuse, a legal instruction
  // or a fraud investigation, and broadcasting the specifics to every member of
  // the organization tells people who are not the subject of the decision
  // something they should not be told.
  string reason = 2 [
    (buf.validate.field).string = {
      min_len: 8
      max_len: 500
    }
  ];
}

// SuspendCustomerResponse reports the state after the call.
message SuspendCustomerResponse {
  // False means they were already suspended, which is a success: the caller
  // asked for a state that holds.
  bool changed = 1;

  // The audit entry this produced.
  string audit_entry_id = 2 [
    (buf.validate.field).string = {
      max_len: 32
      pattern: "^audit_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];
}

// ReinstateCustomerRequest returns a suspended tenant to active.
message ReinstateCustomerRequest {
  // The organization to reinstate.
  string org_id = 1 [
    (buf.validate.field).string = {
      max_len: 30
      pattern: "^org_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];

  // Why. Mandatory here too — turning a customer back on is less dangerous than
  // turning them off and equally worth being able to explain. An account
  // reinstated with no recorded reason is one nobody can defend having
  // reinstated.
  string reason = 2 [
    (buf.validate.field).string = {
      min_len: 8
      max_len: 500
    }
  ];
}

// ReinstateCustomerResponse reports the state after the call.
message ReinstateCustomerResponse {
  // False means they were not suspended.
  bool changed = 1;

  // The audit entry this produced.
  string audit_entry_id = 2 [
    (buf.validate.field).string = {
      max_len: 32
      pattern: "^audit_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    }
  ];
}

// ---------------------------------------------------------------------------
// The service
// ---------------------------------------------------------------------------

// OperatorService is the back office.
//
// Every method declares a capability and an audit action, and
// `internal/operator/policy` refuses to serve one that does not.
service OperatorService {
  // BeginSignIn starts the OIDC ceremony (operator.md §3).
  //
  // Unauthenticated by necessity: there is nobody to authenticate yet. It
  // records no audit entry for the same reason — an entry naming an
  // unidentified caller is a row that says only that somebody loaded a page.
  rpc BeginSignIn(BeginSignInRequest) returns (BeginSignInResponse) {
    option (chronos.operator.v1.unauthenticated) = true;
  }

  // CompleteSignIn exchanges the IdP's code for a PENDING session.
  //
  // The operator is resolved against `operator_account` by issuer and provider
  // subject. An unknown or disabled operator is refused HERE, at the first
  // step, so a valid Workspace login is not itself access to this plane.
  rpc CompleteSignIn(CompleteSignInRequest) returns (CompleteSignInResponse) {
    option (chronos.operator.v1.unauthenticated) = true;
  }

  // BeginWebAuthn starts the second factor, or the first enrolment.
  //
  // Reachable only with a pending token. That is the whole two-stage design:
  // the intermediate session authorizes exactly the step that ends it.
  rpc BeginWebAuthn(BeginWebAuthnRequest) returns (BeginWebAuthnResponse) {
    option (chronos.operator.v1.sso_only) = true;
  }

  // FinishWebAuthn verifies the assertion and issues the real session.
  //
  // User verification is REQUIRED, not preferred: operator.md §3 mandates
  // hardware-backed MFA with no fallback, and an assertion that only proves
  // possession is one factor wearing the shape of two.
  //
  // The token returned is a NEW secret, not a promotion of the pending one. A
  // token whose privileges change during its life is one that a client, a
  // proxy log or a browser extension may have captured before the change.
  rpc FinishWebAuthn(FinishWebAuthnRequest) returns (FinishWebAuthnResponse) {
    option (chronos.operator.v1.sso_only) = true;
    option (chronos.operator.v1.audit) = AUDIT_ACTION_SIGNED_IN;
  }

  // SignOut ends the caller's own session.
  //
  // `self_session` is held by every role: ending your own session is not a
  // privilege, and an operator who cannot sign out on a shared machine is an
  // operator whose safest action is unavailable.
  rpc SignOut(SignOutRequest) returns (SignOutResponse) {
    option (chronos.operator.v1.capability) = "self_session";
    option (chronos.operator.v1.audit) = AUDIT_ACTION_SIGNED_OUT;
  }

  // RequestElevation takes a capability this operator's role does not hold,
  // for fifteen minutes, with a recorded justification (operator.md §5).
  //
  // # What it can and cannot reach
  //
  // A role may break the glass to what the role ABOVE it holds, and no further.
  // The spec says only "beyond a role's default", which read literally would
  // permit a support engineer elevating to `manage_operators` — self-promotion
  // with a fifteen-minute delay and an alert nobody can act on faster than the
  // grant.
  //
  // Two capabilities are reachable by nobody: `manage_operators`, because it
  // grants capabilities and so the time box would bound nothing; and
  // `suspend_organization`, because it is the only operator action that stops a
  // paying customer working.
  //
  // # It declares `self_session`, which looks wrong and is not
  //
  // The capability being REQUESTED cannot gate the request — that is the
  // deadlock `bootstrap_min_aal` describes on the tenant plane, in another
  // costume. What gates it is that the caller holds a live session, and the
  // domain then decides whether their role may reach what they asked for.
  //
  // The elevation is scoped to the SESSION, so signing out ends it and a second
  // session of the same operator is unaffected.
  rpc RequestElevation(RequestElevationRequest) returns (RequestElevationResponse) {
    option (chronos.operator.v1.capability) = "self_session";
    option (chronos.operator.v1.audit) = AUDIT_ACTION_ELEVATED;
  }

  // ProvisionOperator grants an employee access to this plane (operator.md §3).
  //
  // # The first operator cannot come through here
  //
  // Every method on this plane needs a session, and a session needs an
  // operator, so the first one is a bootstrap no RPC can perform. That is
  // `internal/tools/provisionoperator`, which runs where the credentials
  // already are — the honest resolution, rather than an endpoint that is
  // exempt from authentication and therefore the most dangerous thing here.
  //
  // Both write through the SAME aggregate, so they cannot diverge: the event is
  // identical and the projection is identical. What differs is who may call
  // them.
  rpc ProvisionOperator(ProvisionOperatorRequest) returns (ProvisionOperatorResponse) {
    option (chronos.operator.v1.capability) = "manage_operators";
    option (chronos.operator.v1.audit) = AUDIT_ACTION_MANAGED_OPERATORS;
  }

  // ChangeOperatorRole moves an operator between roles.
  //
  // Refused when the caller names themselves. An operator_admin holds
  // `manage_operators`, so nothing in the capability table stops them raising
  // their own role — the aggregate is the only place that knows the actor and
  // the target are the same person, and that is where the refusal lives.
  //
  // Refused for a DISABLED operator too: re-granting access is a new
  // provisioning by a second person, and a role change that quietly revived an
  // offboarded account would make offboarding a toggle.
  rpc ChangeOperatorRole(ChangeOperatorRoleRequest) returns (ChangeOperatorRoleResponse) {
    option (chronos.operator.v1.capability) = "manage_operators";
    option (chronos.operator.v1.audit) = AUDIT_ACTION_MANAGED_OPERATORS;
  }

  // DisableOperator offboards an operator, and ends their live sessions.
  //
  // "Offboarding is immediate and verified — an operator account outliving
  // employment is a breach waiting to happen" (operator.md §3). Immediate means
  // the sessions are ended by THIS call rather than left to the projection: the
  // projection is what stops future sign-ins, and it is seconds behind, which
  // is seconds too many for a compromised account.
  //
  // Both paths exist because they fail differently. The direct end handles the
  // sessions that exist now; the projection handles every session created
  // between the append and the row landing. Neither alone closes the window.
  rpc DisableOperator(DisableOperatorRequest) returns (DisableOperatorResponse) {
    option (chronos.operator.v1.capability) = "manage_operators";
    option (chronos.operator.v1.audit) = AUDIT_ACTION_MANAGED_OPERATORS;
  }

  // ListOperators reads who may use this plane.
  //
  // Audited like every read here, and for a reason that is easy to miss: the
  // roster is a list of our staff and their privileges, which is exactly what
  // somebody who had reached this plane would want first.
  rpc ListOperators(ListOperatorsRequest) returns (ListOperatorsResponse) {
    option (chronos.operator.v1.capability) = "manage_operators";
    option (chronos.operator.v1.audit) = AUDIT_ACTION_MANAGED_OPERATORS;
  }

  // ListCustomers pages the customer directory.
  //
  // Audited, like every read here. The entry names no org, because a page is an
  // aggregate over many tenants and naming one of them would be false.
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse) {
    option (chronos.operator.v1.capability) = "view_customers";
    option (chronos.operator.v1.audit) = AUDIT_ACTION_VIEWED_CUSTOMER;
  }

  // GetCustomer reads one organization's record.
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse) {
    option (chronos.operator.v1.capability) = "view_customers";
    option (chronos.operator.v1.audit) = AUDIT_ACTION_VIEWED_CUSTOMER;
  }

  // SuspendCustomer switches a tenant off (operator.md §7).
  //
  // # It goes through the tenant's own domain command
  //
  // Not a flag, not an operator-plane row, not a privileged back-channel. The
  // organization aggregate is loaded from its own stream, `Suspend` is called
  // on it, and `OrganizationSuspended` is appended to the tenant's stream —
  // so every downstream consequence follows identically to a suspension
  // triggered by a failed payment: the projections update, `organization.
  // suspended` mails every member, and gate 3 begins refusing writes.
  //
  // §7 is explicit about why: "there is no privileged back-channel that skips
  // domain rules, because that back-channel is exactly what corrupts state that
  // then cannot be replayed".
  //
  // # `suspend_organization` is reachable by nobody through break-glass
  //
  // operator_admin holds it and needs no elevation; nothing else may reach it,
  // because this is the only operator action that stops a paying customer
  // working and it is reversible only by another operator action while they are
  // down.
  //
  // The state machine refuses what it would refuse from any caller — a CLOSED
  // organization cannot be suspended, and the refusal carries the domain's own
  // message so an operator stops rather than retries.
  rpc SuspendCustomer(SuspendCustomerRequest) returns (SuspendCustomerResponse) {
    option (chronos.operator.v1.capability) = "suspend_organization";
    option (chronos.operator.v1.audit) = AUDIT_ACTION_CHANGED_TENANT;
  }

  // ReinstateCustomer returns a suspended tenant to active.
  //
  // It calls the organization's ordinary `Activate`, not a reinstate-specific
  // command — a suspension lifted and a trial converting both land in Active,
  // and the state machine already says so. An operator-only path would be a
  // second way to reach one state, which is how two paths drift.
  rpc ReinstateCustomer(ReinstateCustomerRequest) returns (ReinstateCustomerResponse) {
    option (chronos.operator.v1.capability) = "suspend_organization";
    option (chronos.operator.v1.audit) = AUDIT_ACTION_CHANGED_TENANT;
  }

  // RevealPersonalData resolves one subject's vault fields, with a recorded
  // justification (operator.md §4).
  //
  // The ONLY path from this plane to a person's data. Lists never join the
  // vault, so there is no query that returns an address in bulk — the columns
  // do not exist.
  //
  // The audit entry is appended BEFORE the vault is read, and a failure to
  // append fails the call. The ordering is the point: an access that could not
  // be recorded must not happen, and the reverse ordering would make "the
  // audit write failed after we returned the data" a reachable state.
  rpc RevealPersonalData(RevealPersonalDataRequest) returns (RevealPersonalDataResponse) {
    option (chronos.operator.v1.capability) = "view_personal_data";
    option (chronos.operator.v1.audit) = AUDIT_ACTION_VIEWED_PERSONAL_DATA;
  }
}
